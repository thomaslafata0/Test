<title>Cinder Cell</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@600;800&family=Barlow+Semi+Condensed:wght@400;500;600&family=Martian+Mono:wght@400;500&display=swap">
<style>
/* Layout: a single occupied-town terminal. Status strip on top, one working panel, combat log beside it on wide screens.
   Single deliberate dark look: night curfew under sodium lamps. */
:root {
  color-scheme: dark;
  --bg: #121518;          /* curfew night, cold steel */
  --panel: #1a1f23;
  --panel-2: #222930;
  --line: #2f383f;
  --fg: #ddd6c6;          /* sodium-lit paper */
  --muted: #8d918b;
  --sodium: #e8973a;      /* accent: sodium street lamp */
  --sodium-dim: #e8973a33;
  --danger: #d4483a;
  --danger-dim: #d4483a2a;
  --ok: #8db57d;
  --ion: #73b6d4;
  --display: 'Big Shoulders Stencil Display', 'Impact', 'Arial Narrow', sans-serif;
  --body: 'Barlow Semi Condensed', 'Arial Narrow', system-ui, sans-serif;
  --mono: 'Martian Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.5 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 40px;
  background-image:
    radial-gradient(ellipse 60% 40% at 15% 0%, #e8973a14, transparent 70%),
    repeating-linear-gradient(0deg, #ffffff04 0 1px, transparent 1px 3px);
}
.wrap { max-width: 1080px; margin: 0 auto; display: grid; gap: 16px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--sodium); outline-offset: 2px; }
button:disabled { cursor: not-allowed; opacity: .4; }
h1, h2, h3 { font-family: var(--display); font-weight: 800; letter-spacing: .02em; text-wrap: balance; margin: 0; line-height: 1.05; }
h2 { font-size: 2.2rem; text-transform: uppercase; }
h3 { font-size: 1.3rem; text-transform: uppercase; font-weight: 600; letter-spacing: .04em; }
p { margin: 0; }
.muted { color: var(--muted); }
.label { font-family: var(--mono); font-size: .68rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* status strip */
.status { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding-block: 4px 12px; border-bottom: 1px solid var(--line); }
.brand { font-family: var(--display); font-weight: 800; font-size: 1.9rem; letter-spacing: .06em; color: var(--sodium); text-transform: uppercase; margin-right: auto; }
.stat { display: grid; gap: 2px; }
.stat .v { font-family: var(--mono); font-size: .9rem; font-variant-numeric: tabular-nums; }
.hp { width: 150px; }
.bar { height: 6px; background: var(--panel-2); position: relative; overflow: hidden; }
.bar > i { position: absolute; inset: 0 auto 0 0; background: var(--ok); transition: width .3s ease; }
.bar.low > i { background: var(--danger); }
.bar.enemy > i { background: var(--danger); }

/* panels */
.panel { background: var(--panel); border: 1px solid var(--line); padding: 20px; display: grid; gap: 16px; align-content: start; min-width: 0; }
.notice { border-left: 3px solid var(--sodium); padding: 8px 12px; background: var(--sodium-dim); font-size: .95rem; }

.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); }
.tab { background: none; border: 0; padding: 10px 14px; font-family: var(--display); font-weight: 600; font-size: 1.15rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--sodium); }

.rows { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); }
.row { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; align-items: center; padding: 10px 14px; background: var(--panel); }
.row .name { font-weight: 600; }
.row .desc { font-size: .9rem; color: var(--muted); }
.row.owned .name::after { content: ' \00B7  equipped'; font-family: var(--mono); font-size: .65rem; color: var(--ok); letter-spacing: .08em; text-transform: uppercase; }

.btn { background: var(--panel-2); border: 1px solid var(--line); padding: 8px 14px; font-weight: 600; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--sodium); }
.btn.primary { background: var(--sodium); color: #1a1208; border-color: var(--sodium); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.1); }
.btn.big { padding: 14px 22px; font-family: var(--display); font-size: 1.35rem; text-transform: uppercase; letter-spacing: .06em; }
.btn .k { font-family: var(--mono); font-size: .65rem; opacity: .6; margin-left: 6px; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; }

.columns { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
@media (max-width: 820px) { .columns { grid-template-columns: minmax(0, 1fr); } }

/* combat */
.stage { position: relative; border: 1px solid var(--line); background: #0b0e11; overflow: hidden; }
.stage canvas { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; image-rendering: pixelated; }
.hud { position: absolute; display: grid; gap: 3px; min-width: 0; width: 42%; max-width: 260px; padding: 6px 10px 7px; background: #121518e6; border: 1px solid var(--line); }
.hud-enemy { left: 3%; top: 5%; }
.hud-player { right: 3%; bottom: 6%; border-color: #e8973a66; }
.hud-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; min-width: 0; }
.hud-name { font-family: var(--display); font-weight: 600; font-size: clamp(.85rem, 2.4vw, 1.15rem); text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.hud-tag { font-family: var(--mono); font-size: .6rem; letter-spacing: .1em; color: var(--muted); white-space: nowrap; }
.hud-hp { font-size: .68rem; color: var(--muted); justify-self: end; }
.hud .bar i { transition: width .35s ease; }
.pops { position: absolute; inset: 0; pointer-events: none; }
.pop { position: absolute; transform: translate(-50%, 0); font-family: var(--display); font-weight: 800; font-size: clamp(1.1rem, 3.6vw, 1.9rem); color: #fff; text-shadow: 0 2px 0 #000, 0 0 8px #000; animation: pop 1s ease-out forwards; white-space: nowrap; }
.pop.crit { color: #ffd27a; font-size: clamp(1.4rem, 4.6vw, 2.4rem); }
.pop.heavy { color: #ff7a64; font-size: clamp(1.3rem, 4.2vw, 2.2rem); }
.pop.heal { color: var(--ok); }
.pop.ion { color: var(--ion); }
.pop.info { font-family: var(--mono); font-weight: 500; font-size: clamp(.65rem, 1.8vw, .85rem); letter-spacing: .08em; text-transform: uppercase; color: var(--fg); }
.pop.tag { font-family: var(--mono); font-size: clamp(.6rem, 1.6vw, .75rem); letter-spacing: .2em; color: #ffd27a; margin-top: 2.2em; }
.pop.level { color: #f1d98a; letter-spacing: .08em; }
@keyframes pop { 0% { opacity: 0; transform: translate(-50%, 8px) scale(.7); } 15% { opacity: 1; transform: translate(-50%, 0) scale(1.1); } 30% { transform: translate(-50%, 0) scale(1); } 100% { opacity: 0; transform: translate(-50%, -34px); } }
.speed { position: absolute; right: 2%; top: 4%; display: flex; gap: 2px; }
.speed button { background: #121518cc; border: 1px solid var(--line); color: var(--muted); font-family: var(--mono); font-size: .62rem; padding: 3px 6px; }
.speed button[aria-pressed="true"] { color: var(--sodium); border-color: var(--sodium); }
@media (max-width: 560px) {
  .stage { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1px; background: var(--line); }
  .stage canvas { grid-column: 1 / -1; }
  .hud { position: static; width: auto; max-width: none; border: 0; background: var(--panel-2); }
  .hud-player { order: 2; }
  .hud-enemy { order: 3; }
}
.busy .actions .btn, .busy .items .btn, .busy .skills .btn { opacity: .45; pointer-events: none; }
.foe-info { display: grid; gap: 10px; }
.foe-info .title { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.foe { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; padding: 18px; background: var(--panel-2); border: 1px solid var(--line); align-items: start; }
.foe-info { display: grid; gap: 10px; min-width: 0; }
.portrait { width: 160px; aspect-ratio: 1; max-width: 100%; image-rendering: pixelated; background: radial-gradient(circle at 50% 35%, #e8973a26, transparent 65%), var(--panel); border: 1px solid var(--line); display: block; }
.foe.boss .portrait { background: radial-gradient(circle at 50% 35%, #d4483a33, transparent 65%), var(--panel); border-color: var(--danger); }
.portrait.hit { animation: hit .35s steps(2) 1; }
.portrait.down { filter: grayscale(1) brightness(.5); }
@keyframes hit { 0% { transform: translateX(-4px); filter: brightness(2.2) saturate(0); } 50% { transform: translateX(4px); } 100% { transform: none; filter: none; } }
.killer { display: flex; gap: 16px; align-items: center; }
.killer img { width: 96px; height: 96px; image-rendering: pixelated; border: 1px solid var(--danger); background: var(--panel-2); }
@media (max-width: 520px) { .foe { grid-template-columns: minmax(0, 1fr); } .portrait { width: 128px; } }
.foe.boss { border-color: var(--danger); box-shadow: inset 0 0 0 1px var(--danger-dim); }
.foe .title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
.foe h2 { font-size: 2rem; }
.tag { font-family: var(--mono); font-size: .62rem; letter-spacing: .1em; text-transform: uppercase; padding: 2px 6px; border: 1px solid var(--line); color: var(--muted); }
.tag.boss { color: var(--danger); border-color: var(--danger); }
.tag.droid { color: var(--ion); border-color: var(--ion); }
.intent { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); }
.intent b { font-family: var(--display); font-size: 1.2rem; text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
.intent .tip { grid-column: 2; font-size: .88rem; color: var(--muted); }
.intent .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--sodium); grid-row: span 2; align-self: start; margin-top: 7px; }
.intent.danger { border-color: var(--danger); background: var(--danger-dim); }
.intent.danger .dot { background: var(--danger); animation: pulse 0.9s ease-in-out infinite; }
.intent.calm .dot { background: var(--ion); }
@keyframes pulse { 50% { opacity: .25; } }
.statline { display: flex; flex-wrap: wrap; gap: 16px; font-family: var(--mono); font-size: .78rem; color: var(--muted); }
.statline b { color: var(--fg); font-weight: 500; }
.actions { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.actions .btn { padding: 14px 8px; font-family: var(--display); font-size: 1.25rem; text-transform: uppercase; letter-spacing: .04em; white-space: normal; }
.items { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.items .btn { font-size: .9rem; white-space: normal; padding: 8px 6px; }
@media (max-width: 520px) { .actions, .items { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.log { font-family: var(--mono); font-size: .74rem; line-height: 1.6; display: grid; gap: 4px; max-height: 460px; overflow-y: auto; align-content: start; }
.log p { padding-left: 10px; border-left: 2px solid var(--line); }
.log .hit { border-color: var(--fg); }
.log .crit { border-color: var(--sodium); color: var(--sodium); }
.log .hurt { border-color: var(--danger); }
.log .bad { border-color: var(--danger); color: var(--danger); }
.log .good { border-color: var(--ok); color: var(--ok); }
.log .reward { border-color: var(--sodium); }
.log .sys, .log .boss { color: var(--muted); font-style: italic; }
.log .boss { color: var(--danger); }
.log p:last-child { background: #ffffff06; }

.big-title { font-size: clamp(2.6rem, 8vw, 4.6rem); color: var(--sodium); text-transform: uppercase; }
.story { display: grid; gap: 12px; max-width: 62ch; font-size: 1.08rem; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; font-family: var(--mono); font-size: .85rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-variant-numeric: tabular-nums; }
.pips { display: inline-flex; gap: 3px; flex-wrap: wrap; }
.pips i { width: 8px; height: 8px; background: var(--panel-2); border: 1px solid var(--line); }
.pips i.on { background: var(--sodium); border-color: var(--sodium); }
.wall { display: grid; gap: 6px; font-size: .9rem; }
.wall div { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px dashed var(--line); padding-bottom: 4px; }
.danger-text { color: var(--danger); }
.ok-text { color: var(--ok); }
.ins { display: flex; flex-wrap: wrap; gap: 8px; }

/* character creation, map board, skills, events */
.create-grid, .two-col { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px; }
@media (max-width: 820px) { .create-grid, .two-col { grid-template-columns: minmax(0, 1fr); } }
input.text { flex: 1 1 200px; min-width: 0; background: var(--panel-2); border: 1px solid var(--line); color: var(--fg); font: 600 1.1rem var(--body); padding: 8px 12px; }
input.text:focus-visible { outline: 2px solid var(--sodium); outline-offset: 1px; }
.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 520px) { .choices { grid-template-columns: minmax(0, 1fr); } }
.choice { text-align: left; display: grid; gap: 4px; align-content: start; padding: 12px; background: var(--panel-2); border: 1px solid var(--line); }
.choice b { font-family: var(--display); font-size: 1.2rem; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.choice .desc { font-size: .88rem; color: var(--muted); }
.choice .perk { font-size: .85rem; color: var(--sodium); }
.choice.on, .map-card.on { border-color: var(--sodium); box-shadow: inset 0 0 0 1px var(--sodium); }
.chip { display: inline-block; font-family: var(--mono); font-size: .62rem; letter-spacing: .08em; text-transform: uppercase; padding: 2px 6px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip.bad { color: var(--danger); border-color: var(--danger); }
.chip.good { color: var(--ok); border-color: var(--ok); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.attr-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 14px; background: var(--panel); }
.attr-row .desc { font-size: .85rem; color: var(--muted); }
.stepper { display: flex; align-items: center; gap: 8px; }
.stepper .btn { width: 36px; padding: 6px 0; }
.big-num { font-size: 1.4rem; min-width: 1.6ch; text-align: center; }
.points { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border: 1px dashed var(--line); }
.badge { display: inline-block; min-width: 1.4em; padding: 0 4px; background: var(--sodium); color: #1a1208; font-family: var(--mono); font-size: .7rem; text-align: center; vertical-align: middle; }
.maps { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; }
.map-card { text-align: left; display: grid; gap: 6px; align-content: start; padding: 14px; border: 1px solid var(--line); background: var(--panel-2); position: relative; overflow: hidden; }
.map-card::before { content: ""; position: absolute; inset: 0 0 auto; height: 3px; background: var(--map, var(--sodium)); }
.map-card b { font-family: var(--display); font-size: 1.35rem; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.map-card .desc { font-size: .9rem; color: var(--muted); }
.map-card:disabled { opacity: .45; }
.theme-garrison { --map: #e8973a; } .theme-foundry { --map: #e0602a; } .theme-detention { --map: #73b6d4; } .theme-port { --map: #b9c2cc; }
.skills { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 520px) { .skills { grid-template-columns: minmax(0, 1fr); } }
.skill { display: grid; gap: 2px; text-align: left; border-color: #e8973a55; white-space: normal; }
.sk-name { font-family: var(--display); font-size: 1.1rem; text-transform: uppercase; letter-spacing: .04em; }
.sk-note { font-family: var(--mono); font-size: .62rem; letter-spacing: .06em; color: var(--muted); text-transform: uppercase; }
.options { display: grid; gap: 8px; max-width: 640px; }
.option { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; text-align: left; white-space: normal; padding: 12px 14px; }
.notice.win { border-color: var(--ok); background: #8db57d22; }
.notice.lose { border-color: var(--danger); background: var(--danger-dim); }
.spend-inline { display: grid; gap: 8px; padding: 12px; border: 1px dashed var(--sodium); }
.mech-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.mech { font-family: var(--mono); font-size: .72rem; letter-spacing: .06em; padding: 4px 8px; border: 1px solid var(--line); color: var(--fg); white-space: nowrap; }
.mech b { color: var(--sodium); font-weight: 500; text-transform: uppercase; letter-spacing: .1em; margin-right: 4px; }
.mech.hot { border-color: var(--danger); background: var(--danger-dim); }
.mech.hot b { color: var(--danger); }
.mech-line { font-size: .85rem; color: var(--fg); border-top: 1px dashed var(--line); padding-top: 6px; }
.mech-line b { color: var(--map, var(--sodium)); font-weight: 600; }
.pips.rooms i { width: 22px; height: 6px; }
.doors { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.door { text-align: left; display: grid; gap: 6px; align-content: start; padding: 18px; min-height: 150px; background: var(--panel-2); border: 1px solid var(--line); border-top: 4px solid var(--door, var(--line)); }
.door:hover { border-color: var(--sodium); border-top-color: var(--door, var(--sodium)); }
.door b { font-family: var(--display); font-size: 1.6rem; font-weight: 800; text-transform: uppercase; letter-spacing: .03em; }
.door .desc { color: var(--muted); font-size: .92rem; }
.door-fight { --door: var(--fg); } .door-elite { --door: var(--danger); } .door-boss { --door: var(--danger); background: var(--danger-dim); }
.door-event { --door: var(--ion); } .door-supply, .door-cargo { --door: var(--sodium); } .door-rest { --door: var(--ok); } .door-cells { --door: var(--ion); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<div class="wrap" id="app" aria-live="polite"></div>

<script type="module">
import * as D from './data.js';
import * as E from './engine.js';
import { portraitURL } from './portraits.js';
import { Stage, loadSheets, sheetStill } from './stage.js';

const SAVE_KEY = 'cinder-cell-save-v1';
const rng = Math.random;
const S = D.SETTING;
let state;
let confirmReset = false;

function load() {
  try { const raw = localStorage.getItem(SAVE_KEY); if (raw) return JSON.parse(raw); } catch (e) {}
  return null;
}
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {} }

const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const bar = (v, max, cls = '') => `<div class="bar ${cls} ${v / max < 0.3 ? 'low' : ''}"><i style="width:${Math.max(0, Math.min(100, (v / max) * 100))}%"></i></div>`;
const cr = (n) => `${n.toLocaleString()} ${S.cur}`;
const pct = (x) => `${Math.round(x * 100)}%`;
const SKILL_KEYS = ['q', 'w', 'e'];

function statusStrip() {
  const c = state.char;
  if (!c) return `<header class="status"><div class="brand">${esc(S.title)}</div><div class="stat"><span class="label">${esc(S.meta)}</span><span class="v" style="color:var(--sodium)">${state.meta.resolve}</span></div></header>`;
  const st = E.stats(state);
  return `<header class="status">
    <div class="brand">${esc(S.title)}</div>
    <div class="stat"><span class="label">Operative ${c.number}</span><span class="v">${esc(c.name)} \u00B7 Lv ${c.level}</span></div>
    <div class="stat hp"><span class="label">HP</span><span class="v">${Math.max(0, c.hp)} / ${st.maxHp}</span>${bar(c.hp, st.maxHp)}</div>
    <div class="stat"><span class="label">ATK \u00B7 DEF \u00B7 SPD</span><span class="v">${st.atk} \u00B7 ${st.def} \u00B7 ${st.spd}</span></div>
    <div class="stat"><span class="label">${Object.values(D.ATTRS).map((a) => a.short).join(' \u00B7 ')}</span><span class="v">${Object.keys(D.ATTRS).map((k) => E.attr(c, k)).join(' \u00B7 ')}</span></div>
    <div class="stat"><span class="label">${esc(S.currency)}</span><span class="v">${c.credits.toLocaleString()}</span></div>
    <div class="stat"><span class="label">${esc(S.meta)}</span><span class="v" style="color:var(--sodium)">${state.meta.resolve}</span></div>
  </header>`;
}

function logPanel() {
  const lines = state.log.slice(-30).map((l) => `<p class="${l.kind}">${esc(l.text)}</p>`).join('');
  return `<aside class="panel"><span class="label">Comms log</span><div class="log" id="log">${lines || '<p class="sys">Quiet on the channel.</p>'}</div></aside>`;
}
const notice = () => state.notice ? `<div class="notice">${esc(state.notice)}</div>` : '';

// ---------- screens ----------
function introScreen() {
  return `<section class="panel" style="padding:32px">
    <span class="label">${esc(S.town)} \u00B7 after curfew</span>
    <h1 class="big-title">${esc(S.title)}</h1>
    <div class="story">${S.intro.map((p) => `<p>${esc(p)}</p>`).join('')}</div>
    <div class="kv" style="max-width:560px">
      <dt>Death</dt><dd class="danger-text">Lose the operative: ${S.currency}, gear, implants, attributes, level</dd>
      <dt>Survives</dt><dd style="color:var(--sodium)">${S.meta}, training and cell upgrades bought with it</dd>
      <dt>Earn ${S.meta}</dt><dd>+1 per sector cleared, +3 per boss, more for brave choices</dd>
    </div>
    <div><button class="btn primary big" data-a="begin">Build your first operative</button></div>
  </section>`;
}

function createScreen() {
  const d = state.draft, bg = D.BACKGROUNDS.find((b) => b.id === d.background);
  const attrs = {};
  for (const k of Object.keys(D.ATTRS)) attrs[k] = E.draftAttr(d, k);
  // Preview stats with a throwaway character.
  const fake = { attrs, level: 1, weapon: state.meta.cell.includes('cache') ? 'carbine' : 'holdout', armor: 'none', upgrades: [], implants: [], background: d.background };
  const st = E.statsOf(state.meta, fake);
  const skills = E.skillsOf(fake);
  const bgCards = D.BACKGROUNDS.map((b) => `<button class="choice ${b.id === d.background ? 'on' : ''}" data-a="bg" data-v="${b.id}" aria-pressed="${b.id === d.background}">
      <b>${esc(b.name)}</b><span class="chip">+1 ${Object.keys(b.attrs).map((k) => D.ATTRS[k].short).join(', ')}</span>
      <span class="desc">${esc(b.desc)}</span><span class="perk">${esc(b.perk)}</span></button>`).join('');
  const attrRows = Object.entries(D.ATTRS).map(([k, a]) => `<div class="attr-row">
      <div><div class="name">${esc(a.label)} <span class="num muted">${a.short}</span></div><div class="desc">${esc(a.desc)}</div></div>
      <div class="stepper"><button class="btn" data-a="attr" data-v="${k}" data-k="-1" aria-label="Lower ${a.label}" ${d.attrs[k] <= D.ATTR_START ? 'disabled' : ''}>\u2212</button>
      <span class="num big-num">${attrs[k]}</span>
      <button class="btn" data-a="attr" data-v="${k}" data-k="1" aria-label="Raise ${a.label}" ${d.points <= 0 || attrs[k] >= D.ATTR_CREATE_MAX ? 'disabled' : ''}>+</button></div></div>`).join('');
  return `<section class="panel" style="padding:28px">
    <div style="display:grid;gap:4px"><span class="label">New operative \u00B7 #${state.meta.operatives + 1}</span><h2>Who walks through the gate?</h2></div>
    ${notice()}
    <div class="create-grid">
      <div style="display:grid;gap:16px;align-content:start;min-width:0">
        <label class="label" for="op-name">Name</label>
        <div class="btnrow"><input id="op-name" class="text" maxlength="24" value="${esc(d.name)}" autocomplete="off"><button class="btn" data-a="randname">Random</button></div>
        <span class="label">Background</span>
        <div class="choices">${bgCards}</div>
      </div>
      <div style="display:grid;gap:16px;align-content:start;min-width:0">
        <div class="points"><span class="label">Attribute points left</span><span class="num big-num" style="color:${d.points ? 'var(--sodium)' : 'var(--muted)'}">${d.points}</span></div>
        <div class="rows">${attrRows}</div>
        <dl class="kv"><dt>Max HP</dt><dd>${st.maxHp}</dd><dt>ATK \u00B7 DEF \u00B7 SPD</dt><dd>${st.atk} \u00B7 ${st.def} \u00B7 ${st.spd}</dd><dt>Implant slots</dt><dd>${st.slots}</dd>
          <dt>Skills</dt><dd>${skills.map((k) => D.SKILLS[k].name).join(', ')}</dd></dl>
        <p class="muted" style="font-size:.9rem">Higher attributes unlock skills: STR 5 Power Strike, INT 4 Overload, AGI 4 Suppressing Fire, CHA 4 Intimidate. You gain a point every level, and your choices in the field can raise or lower them.</p>
        <div><button class="btn primary big" data-a="create">${d.points ? `Start (keep ${d.points} point${d.points > 1 ? 's' : ''} for later)` : 'Start'}</button></div>
      </div>
    </div>
  </section>`;
}

function townScreen() {
  const c = state.char;
  const tabs = [['market', 'Black Market'], ['clinic', 'Clinic'], ['safehouse', 'Safehouse'], ['gate', 'Targets']];
  const body = { market, clinic, safehouse, gate }[state.tab] || gate;
  return `<section class="panel">
    <div style="display:grid;gap:4px"><span class="label">Town \u00B7 curfew in effect</span><h2>${esc(S.town)}</h2></div>
    ${notice()}
    <nav class="tabs" role="tablist">${tabs.map(([id, l]) => `<button class="tab" role="tab" aria-selected="${state.tab === id}" data-a="tab" data-v="${id}">${l}${id === 'safehouse' && c.attrPoints ? ` <span class="badge">${c.attrPoints}</span>` : ''}</button>`).join('')}</nav>
    ${body()}
  </section>`;
}

function buyBtn(a, v, k, cost, extraDisabled = false) {
  const p = E.price(state, cost);
  return `<button class="btn" data-a="${a}" data-v="${v}" ${k ? `data-k="${k}"` : ''} ${state.char.credits < p || extraDisabled ? 'disabled' : ''}>${cr(p)}</button>`;
}

function gearRows(kind, list) {
  const c = state.char, cur = list.find((x) => x.id === c[kind]);
  return list.slice(1).map((g) => {
    const owned = c[kind] === g.id, ok = E.meetsReq(c, g.req);
    const stat = kind === 'weapon' ? `+${g.atk} ATK \u00B7 ${g.type}` : `+${g.def} DEF`;
    const skill = kind === 'weapon' ? D.SKILLS[D.WEAPON_SKILL[g.type]] : null;
    const weaker = kind === 'weapon' ? g.atk <= cur.atk && g.type === cur.type : g.def <= cur.def;
    return `<div class="row ${owned ? 'owned' : ''}"><div><div class="name">${esc(g.name)} <span class="num muted" style="font-size:.8rem">${stat}</span>${g.req ? ` <span class="chip ${ok ? '' : 'bad'}">needs ${E.reqText(g.req)}</span>` : ''}</div>
      <div class="desc">${esc(g.desc)}${skill ? ` Skill: ${esc(skill.name)}.` : ''}</div></div>
      ${owned ? '<span></span>' : weaker ? '<span class="label">no upgrade</span>' : buyBtn('gear', g.id, kind, g.cost, !ok)}</div>`;
  }).join('');
}

function market() {
  const c = state.char, st = E.stats(state);
  const items = Object.entries(D.ITEMS).map(([id, it]) => `<div class="row"><div><div class="name">${esc(it.name)} <span class="num muted" style="font-size:.8rem">${c.items[id]}/${st.carry}</span></div><div class="desc">${esc(it.desc)}</div></div>
    ${buyBtn('item', id, '', it.cost, c.items[id] >= st.carry)}</div>`).join('');
  const ups = D.UPGRADES.map((u) => {
    const owned = c.upgrades.includes(u.id);
    return `<div class="row ${owned ? 'owned' : ''}"><div><div class="name">${esc(u.name)}</div><div class="desc">${esc(u.desc)}</div></div>${owned ? '<span></span>' : buyBtn('upgrade', u.id, '', u.cost)}</div>`;
  }).join('');
  const disc = 1 - E.price(state, 100) / 100;
  return `<p class="muted">Old Marrow\u2019s stall, behind the scrap scales. No receipts. Everything here is lost if you die.${disc > 0 ? ` Your Charisma gets you ${pct(disc)} off.` : ''}</p>
    <h3>Weapons</h3><div class="rows">${gearRows('weapon', D.WEAPONS)}</div>
    <h3>Armour</h3><div class="rows">${gearRows('armor', D.ARMOR)}</div>
    <h3>Supplies</h3><div class="rows">${items}</div>
    <h3>Contacts &amp; mods</h3><div class="rows">${ups}</div>`;
}

function clinic() {
  const c = state.char, st = E.stats(state), cost = E.healCost(state);
  const imps = D.IMPLANTS.map((u) => {
    const owned = c.implants.includes(u.id);
    return `<div class="row ${owned ? 'owned' : ''}"><div><div class="name">${esc(u.name)}</div><div class="desc">${esc(u.desc)}</div></div>
      ${owned ? `<button class="btn" data-a="unimplant" data-v="${u.id}">Remove</button>` : buyBtn('implant', u.id, '', u.cost, c.implants.length >= st.slots)}</div>`;
  }).join('');
  return `<p class="muted">Doc Ilse works out of a laundry back room. Stitches, and for the right price, hardware under the skin.</p>
    <h3>Treatment</h3>
    <div class="kv"><dt>Condition</dt><dd>${c.hp} / ${st.maxHp} HP</dd><dt>Cost</dt><dd>${cost > 0 ? cr(cost) : 'Not needed'}</dd></div>
    <div><button class="btn primary" data-a="heal" ${cost <= 0 || c.credits < cost ? 'disabled' : ''}>${cost > 0 ? `Patch me up \u00B7 ${cr(cost)}` : 'Fully healed'}</button></div>
    <h3>Implants <span class="num muted" style="font-size:.9rem">${c.implants.length} / ${st.slots} slots</span></h3>
    <p class="muted" style="font-size:.9rem">Slots: 2, plus one at INT 4 and another at INT 8. Removing an implant frees the slot but refunds nothing.</p>
    <div class="rows">${imps}</div>`;
}

function safehouse() {
  const m = state.meta, c = state.char;
  const attrRows = Object.entries(D.ATTRS).map(([k, a]) => `<div class="attr-row"><div><div class="name">${esc(a.label)} <span class="num muted">${a.short}</span></div><div class="desc">${esc(a.desc)}</div></div>
    <div class="stepper"><span class="num big-num">${E.attr(c, k)}</span>${c.attrPoints ? `<button class="btn" data-a="spend" data-v="${k}" aria-label="Raise ${a.label}" ${c.attrs[k] >= D.ATTR_MAX ? 'disabled' : ''}>+</button>` : ''}</div></div>`).join('');
  const skills = E.skillsOf(c).map((k) => `<div class="row"><div><div class="name">${esc(D.SKILLS[k].name)} <span class="num muted" style="font-size:.8rem">cooldown ${E.skillCd(c, k)}</span></div><div class="desc">${esc(D.SKILLS[k].desc)}</div></div><span class="label">${esc(D.SKILLS[k].from)}</span></div>`).join('');
  const history = c.history.length ? c.history.map((h) => `<div><span>${esc(h.text)}</span></div>`).join('') : '<p class="muted">Nothing yet. Your choices in the field will show up here.</p>';
  const rows = Object.entries(D.TRAINING).map(([k, t]) => {
    const lvl = m.training[k], cost = E.trainingCost(lvl), maxed = lvl >= t.max;
    return `<div class="row"><div><div class="name">${esc(t.label)} <span class="num muted" style="font-size:.8rem">+${t.per} ${t.stat} per rank</span></div>
      <div class="desc">${esc(t.note)}</div><div class="pips" aria-label="rank ${lvl} of ${t.max}">${Array.from({ length: t.max }, (_, i) => `<i class="${i < lvl ? 'on' : ''}"></i>`).join('')}</div></div>
      ${maxed ? '<span class="label">mastered</span>' : `<button class="btn" data-a="train" data-v="${k}" ${m.resolve < cost ? 'disabled' : ''}>${cost} ${esc(S.meta)}</button>`}</div>`;
  }).join('');
  const cell = D.CELL.map((u) => {
    const owned = m.cell.includes(u.id);
    return `<div class="row ${owned ? 'owned' : ''}"><div><div class="name">${esc(u.name)}</div><div class="desc">${esc(u.desc)}</div></div>${owned ? '<span></span>' : `<button class="btn" data-a="cell" data-v="${u.id}" ${m.resolve < u.cost ? 'disabled' : ''}>${u.cost} ${esc(S.meta)}</button>`}</div>`;
  }).join('');
  const wall = m.fallen.length ? m.fallen.map((f) => `<div><span>${esc(f.name)} <span class="muted">\u00B7 Lv ${f.level}</span></span><span class="muted">${esc(E.sectorName(f.sector, f.map))}, ${esc(f.killer)}</span></div>`).join('') : '<p class="muted">No names yet. Keep it that way.</p>';
  const bg = D.BACKGROUNDS.find((b) => b.id === c.background);
  return `<div class="two-col">
      <div style="display:grid;gap:14px;align-content:start;min-width:0">
        <h3>${esc(c.name)} <span class="num muted" style="font-size:.85rem">${esc(bg.name)} \u00B7 lost on death</span></h3>
        <p class="muted" style="font-size:.9rem">${esc(bg.perk)}${c.attrPoints ? ` <b style="color:var(--sodium)">${c.attrPoints} attribute point${c.attrPoints > 1 ? 's' : ''} to spend.</b>` : ' Level up to earn attribute points.'}</p>
        <div class="rows">${attrRows}</div>
        <span class="label">Skills</span><div class="rows">${skills}</div>
        <span class="label">Choices that changed you</span><div class="wall">${history}</div>
      </div>
      <div style="display:grid;gap:14px;align-content:start;min-width:0">
        <h3>The cell <span class="num muted" style="font-size:.85rem">permanent</span></h3>
        <div class="kv"><dt>${esc(S.meta)} banked</dt><dd style="color:var(--sodium)">${m.resolve}</dd><dt>Deepest sector</dt><dd>${m.bestSector || '\u2014'}</dd><dt>Operatives</dt><dd>${m.operatives}</dd></div>
        <span class="label">Training</span><div class="rows">${rows}</div>
        <span class="label">Cell upgrades</span><div class="rows">${cell}</div>
        <span class="label">The wall</span><div class="wall">${wall}</div>
        <div class="btnrow"><button class="btn" data-a="reset">${confirmReset ? 'Click again to wipe all progress' : 'Reset save'}</button></div>
      </div>
    </div>`;
}

function gate() {
  const c = state.char, st = E.stats(state);
  const sel = E.mapById(state.gateMap || 'garrison');
  const cards = D.MAPS.map((m) => {
    const open = E.mapUnlocked(state, m), prog = c.maps[m.id];
    const traits = [m.credits !== 1 ? `${m.credits > 1 ? '+' : ''}${pct(m.credits - 1)} credits` : null, m.level ? `enemies +${m.level} lv` : null, m.events > 0.3 ? 'more events' : null].filter(Boolean);
    return `<button class="map-card ${m.id === sel.id ? 'on' : ''} theme-${m.theme}" data-a="pickmap" data-v="${m.id}" ${open ? '' : 'disabled'} aria-pressed="${m.id === sel.id}">
      <span class="label">${open ? `Best: sector ${state.meta.bestByMap[m.id] || 0}` : `Locked \u00B7 reach sector ${m.unlock} anywhere`}</span>
      <b>${esc(m.name)}</b><span class="desc">${esc(m.desc)}</span>
      <span class="mech-line"><b>${esc(m.mechanic.name)}.</b> ${esc(m.mechanic.desc)}</span>
      <span class="label">Rooms: ${Object.keys(m.rooms).filter((k) => k !== 'fight').map((k) => esc(m.roomNames[k])).join(' \u00B7 ')}</span>
      ${traits.length ? `<span class="chips">${traits.map((t) => `<span class="chip">${t}</span>`).join('')}</span>` : ''}
      ${prog && prog.deepest ? `<span class="label">This operative: sector ${prog.deepest}</span>` : ''}</button>`;
  }).join('');
  const ins = [...(c.maps[sel.id]?.insertions || [1])].sort((a, b) => a - b);
  const warn = c.hp < st.maxHp * 0.6 ? `<p class="danger-text">You\u2019re going in at ${c.hp}/${st.maxHp} HP. The clinic is right there.</p>` : '';
  return `<p class="muted">Pick a target. Three fights per sector, a boss every fifth. After each sector: push deeper or slip out with what you\u2019re carrying.</p>
    <div class="maps">${cards}</div>
    <div class="kv"><dt>Carrying</dt><dd>${cr(c.credits)} \u00B7 ${Object.entries(c.items).filter(([, n]) => n).map(([k, n]) => `${n}\u00D7 ${D.ITEMS[k].name}`).join(', ') || 'no supplies'}</dd>
    <dt>If you die</dt><dd class="danger-text">All of it is gone, including level ${c.level}, your attributes and implants</dd></div>
    ${warn}
    <span class="label">Insertion point \u00B7 ${esc(sel.name)}</span>
    <div class="ins">${ins.map((n) => `<button class="btn ${n === ins[ins.length - 1] ? 'primary' : ''}" data-a="deploy" data-v="${n}">Sector ${n} \u00B7 ${esc(E.sectorName(n, sel.id))}</button>`).join('')}</div>
    ${ins.length === 1 ? '<p class="muted" style="font-size:.9rem">Beat a boss to unlock a deeper insertion point on that map for this operative.</p>' : ''}`;
}

function portraitImg(e, cls = '') {
  const src = e.portrait || sheetStill(e.id) || portraitURL(e.id);
  return src ? `<img class="portrait ${cls}" src="${src}" alt="Portrait of ${esc(e.name)}" width="160" height="160">` : '';
}

function combatScreen() {
  const r = state.run, e = r.enemy, c = state.char, st = E.stats(state);
  const intent = e.stun > 0 ? { label: `Stunned \u00B7 ${e.stun} turn${e.stun > 1 ? 's' : ''}`, tone: 'calm', tip: 'Free hits.' } : D.INTENTS[e.intent];
  const items = Object.entries(D.ITEMS).map(([id, it], i) => `<button class="btn" data-a="act" data-v="${id}" ${c.items[id] ? '' : 'disabled'}>${esc(it.name)} \u00D7${c.items[id]}<span class="k">${i + 1}</span></button>`).join('');
  const skills = E.skillsOf(c).slice(0, 3).map((k, i) => {
    const cd = r.cooldowns[k] || 0, sk = D.SKILLS[k];
    const note = k === 'intimidate' ? (cd ? 'used this sector' : e.tags.includes('human') ? `${pct(E.intimidateChance(state))} to break` : 'humans only') : cd ? `ready in ${cd} turn${cd > 1 ? 's' : ''}` : `cooldown ${E.skillCd(c, k)}`;
    return `<button class="btn skill" data-a="act" data-v="${k}" title="${esc(sk.desc)}" ${E.canUse(state, k) && !(k === 'intimidate' && !e.tags.includes('human')) ? '' : 'disabled'}>
      <span class="sk-name">${esc(sk.name)}<span class="k">${SKILL_KEYS[i].toUpperCase()}</span></span><span class="sk-note">${note}</span></button>`;
  }).join('');
  return `<div class="columns"><section class="panel">
    <div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px"><span class="label">${esc(E.mapById(r.map).name)} \u00B7 Sector ${r.sector} \u00B7 ${esc(E.sectorName(r.sector, r.map))}</span>${roomPips(r)}</div>
    <div id="stage-slot"></div>
    <div class="mech-row">${mechanicChip(r)}${r.enemy.elite ? '<span class="chip bad">elite</span>' : ''}</div>
    <div class="foe-info">
      <div class="title">${e.tags.map((t) => `<span class="tag ${t}">${t}</span>`).join('')}<div class="statline"><span>ATK <b>${e.atk}</b></span><span>DEF <b>${e.def}</b></span><span>SPD <b>${e.spd}</b></span><span>Run <b>${pct(E.runChance(state))}</b></span><span>Dodge <b>${pct(E.dodgeChance(st, e))}</b></span></div></div>
      <div class="intent ${intent.tone}"><span class="dot"></span><b>${esc(e.name)}: ${esc(intent.label)}</b><span class="tip">${esc(intent.tip)}</span></div>
    </div>
    ${r.ready ? '<div class="notice">Aim steadied: your next attack deals +50%.</div>' : ''}
    <div class="actions">
      <button class="btn primary" data-a="act" data-v="attack">Attack<span class="k">A</span></button>
      <button class="btn" data-a="act" data-v="defend">Defend<span class="k">D</span></button>
      <button class="btn" data-a="act" data-v="run">Run<span class="k">R</span></button>
      <button class="btn" data-a="act" data-v="stim" ${c.items.stim ? '' : 'disabled'}>Stim \u00D7${c.items.stim}<span class="k">S</span></button>
    </div>
    ${skills ? `<span class="label">Skills</span><div class="skills">${skills}</div>` : ''}
    <span class="label">Gear</span>
    <div class="items">${items}</div>
  </section>${logPanel()}</div>`;
}

const ROOM_LABEL = { fight: 'Fight', elite: 'Elite fight', event: 'Event', supply: 'Supplies', rest: 'Rest', cells: 'Prisoners', cargo: 'Cargo', boss: 'Boss' };
function mechanicChip(r) {
  const m = E.mapById(r.map).mechanic;
  let v = '';
  if (m.id === 'alarm') v = `${'\u25A0'.repeat(r.alert)}${'\u25A1'.repeat(5 - r.alert)} ${r.alert}/5`;
  if (m.id === 'vents') v = r.enemy ? (r.vent === 1 ? 'blast next turn' : `blast in ${r.vent} turns`) : 'every 3 turns';
  if (m.id === 'allies') v = `${r.allies}/2 with you`;
  if (m.id === 'snipers') v = '20% per turn';
  const hot = (m.id === 'vents' && r.enemy && r.vent === 1) || (m.id === 'alarm' && r.alert >= 3);
  return `<span class="mech ${hot ? 'hot' : ''}" title="${esc(m.desc)}"><b>${esc(m.name)}</b> ${v}</span>`;
}
function roomPips(r) {
  return `<span class="pips rooms" aria-label="room ${r.room} of ${E.FIGHTS_PER_SECTOR}">${Array.from({ length: E.FIGHTS_PER_SECTOR }, (_, i) => `<i class="${i < r.room ? 'on' : ''}"></i>`).join('')}</span>`;
}

function routeScreen() {
  const r = state.run, map = E.mapById(r.map), c = state.char, st = E.stats(state);
  const doors = r.choices.map((k, i) => `<button class="door door-${k}" data-a="room" data-v="${i}">
      <span class="label">${ROOM_LABEL[k]} <span class="k">${i + 1}</span></span>
      <b>${esc(E.roomName(r.map, k))}</b><span class="desc">${esc(D.ROOMS[k].desc)}</span></button>`).join('');
  const cds = Object.entries(r.cooldowns).filter(([, v]) => v > 0).map(([k, v]) => `${D.SKILLS[k].name} ${v >= 50 ? 'used' : `ready in ${v}`}`);
  return `<div class="columns"><section class="panel">
    <div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center"><span class="label">${esc(map.name)} \u00B7 Sector ${r.sector} \u00B7 ${esc(E.sectorName(r.sector, r.map))}</span>${roomPips(r)}</div>
    <h2>${r.choices[0] === 'boss' ? 'No way around it' : r.room === 0 ? 'Which way in?' : 'Two doors'}</h2>
    ${r.forced ? '<p class="muted" style="font-size:.9rem">Every sector takes at least two fights. Both doors are hot.</p>' : ''}
    <div class="mech-row">${mechanicChip(r)}<span class="muted" style="font-size:.9rem">${esc(map.mechanic.desc)}</span></div>
    <div class="doors">${doors}</div>
    <dl class="kv"><dt>Condition</dt><dd class="${c.hp < st.maxHp * 0.4 ? 'danger-text' : ''}">${c.hp} / ${st.maxHp} HP \u00B7 ${c.items.stim} stims</dd>
      <dt>Skills</dt><dd>${cds.length ? esc(cds.join(', ')) : 'All ready'}</dd></dl>
    <p class="muted" style="font-size:.85rem">Skill cooldowns carry over between fights in a sector and reset when you enter a new one.</p>
  </section>${logPanel()}</div>`;
}

function roomScreen() {
  const r = state.run, res = state.roomResult;
  return `<div class="columns"><section class="panel">
    <div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center"><span class="label">${ROOM_LABEL[res.kind]} \u00B7 ${esc(E.sectorName(r.sector, r.map))}</span>${roomPips(r)}</div>
    <h2>${esc(res.name)}</h2>
    <p style="font-size:1.1rem;max-width:58ch">${esc(res.text)}</p>
    ${res.notes.length ? `<div class="chips">${res.notes.map((n) => `<span class="chip ${/alerted/.test(n) ? 'bad' : 'good'}">${esc(n)}</span>`).join('')}</div>` : ''}
    <div><button class="btn primary big" data-a="roomDone">Move on<span class="k">\u21B5</span></button></div>
  </section>${logPanel()}</div>`;
}

function victoryScreen() {
  const o = state.outcome, c = state.char;
  return `<div class="columns"><section class="panel">
    <div class="killer">${o.id ? portraitImg({ id: o.id, name: o.enemy, portrait: o.portrait }, 'down') : ''}<div style="display:grid;gap:4px"><span class="label">${o.fled ? 'Target fled' : 'Target down'}</span><h2>${esc(o.enemy)}</h2></div></div>
    <dl class="kv"><dt>${esc(S.currency)}</dt><dd style="color:var(--sodium)">+${o.credits}</dd><dt>XP</dt><dd>+${o.xp}</dd>
    ${o.levelUps.length ? `<dt>Level up</dt><dd class="ok-text">Now level ${o.levelUps[o.levelUps.length - 1]} \u00B7 +${o.levelUps.length} attribute point${o.levelUps.length > 1 ? 's' : ''}</dd>` : ''}
    ${o.healed ? `<dt>Field medic</dt><dd class="ok-text">+${o.healed} HP</dd>` : ''}
    ${o.resolve ? `<dt>${esc(S.meta)}</dt><dd style="color:var(--sodium)">+${o.resolve}, and a deeper insertion point</dd>` : ''}</dl>
    ${c.attrPoints ? `<div class="spend-inline"><span class="label">Spend ${c.attrPoints} attribute point${c.attrPoints > 1 ? 's' : ''}</span><div class="btnrow">${Object.entries(D.ATTRS).map(([k, a]) => `<button class="btn" data-a="spend" data-v="${k}">${a.short} ${c.attrs[k]} \u2192 ${c.attrs[k] + 1}</button>`).join('')}</div></div>` : ''}
    <div><button class="btn primary big" data-a="continue">Keep moving<span class="k">\u21B5</span></button></div>
  </section>${logPanel()}</div>`;
}

function eventScreen() {
  const ev = E.eventById(state.event), res = state.eventResult;
  const opts = ev.options.map((o, i) => {
    const avail = E.optionAvailable(state, o);
    const check = o.check ? `<span class="chip">${D.ATTRS[o.check.attr].short} ${E.attr(state.char, o.check.attr)} \u00B7 ${pct(E.checkChance(state, o.check))}</span>` : '';
    const cost = o.cost ? `<span class="chip ${avail ? '' : 'bad'}">costs ${o.cost.credits ? cr(o.cost.credits) : `${o.cost.stim} stim`}</span>` : '';
    return `<button class="btn option" data-a="event" data-v="${i}" ${avail ? '' : 'disabled'}><span>${esc(o.label)}</span><span class="chips">${check}${cost}</span></button>`;
  }).join('');
  const result = res ? `<div class="notice ${res.check ? (res.success ? 'win' : 'lose') : ''}">${res.check ? `<b>${res.success ? 'Success.' : 'Failed.'}</b> ` : ''}${esc(res.text)}</div>
    ${res.notes.length ? `<div class="chips">${res.notes.map((n) => `<span class="chip ${/\u2212|alerted/.test(n) ? 'bad' : 'good'}">${esc(n)}</span>`).join('')}</div>` : ''}` : '';
  return `<div class="columns"><section class="panel">
    <span class="label">Something in the corridor \u00B7 ${esc(E.sectorName(state.run.sector, state.run.map))}</span>
    <p style="font-size:1.15rem;max-width:58ch">${esc(ev.text)}</p>
    ${res ? `${result}<div><button class="btn primary big" data-a="eventDone">Move on<span class="k">\u21B5</span></button></div>` : `<div class="options">${opts}</div>`}
  </section>${logPanel()}</div>`;
}

function sectorClearScreen() {
  const r = state.run, o = state.outcome, c = state.char, st = E.stats(state), next = r.sector + 1;
  return `<div class="columns"><section class="panel">
    <span class="label">Sector ${r.sector} secured \u00B7 ${esc(E.mapById(r.map).name)}</span><h2>${esc(E.sectorName(r.sector, r.map))}</h2>
    <dl class="kv"><dt>Sector haul</dt><dd style="color:var(--sodium)">+${cr(o.credits)}</dd><dt>Carrying</dt><dd>${cr(c.credits)}</dd><dt>Condition</dt><dd class="${c.hp < st.maxHp * 0.4 ? 'danger-text' : ''}">${c.hp} / ${st.maxHp} HP \u00B7 ${c.items.stim} stims</dd><dt>${esc(S.meta)}</dt><dd style="color:var(--sodium)">+1 (banked)</dd></dl>
    ${E.isBossSector(next) ? `<div class="notice" style="border-color:var(--danger);background:var(--danger-dim)">Sector ${next} is a boss sector. Something worse than troopers is waiting.</div>` : ''}
    <div class="btnrow">
      <button class="btn primary big" data-a="deeper">Push to sector ${next}</button>
      <button class="btn big" data-a="extract">Extract with ${cr(c.credits)}</button>
    </div>
  </section>${logPanel()}</div>`;
}

function deathScreen() {
  const o = state.outcome;
  return `<section class="panel" style="padding:32px">
    <span class="label">Signal lost \u00B7 ${esc(E.mapById(o.map).name)} \u00B7 Sector ${o.sector}</span>
    <h1 class="big-title" style="color:var(--danger)">${esc(o.name)}</h1>
    ${o.killerId ? `<div class="killer">${portraitImg({ id: o.killerId, name: o.killer, portrait: o.killerPortrait })}<span class="label">Last seen<br>engaging a ${esc(o.killer)}</span></div>` : ''}
    <p class="story">Operative ${o.number} went down in the ${esc(E.sectorName(o.sector, o.map))}, killed by a ${esc(o.killer)}. The ${o.credits.toLocaleString()} ${S.currency}, the gear, the implants and level ${o.level} went with them.</p>
    <dl class="kv"><dt>${esc(S.meta)} to spend</dt><dd style="color:var(--sodium)">${state.meta.resolve}</dd><dt>Deepest ever</dt><dd>Sector ${state.meta.bestSector}</dd></dl>
    <div><button class="btn primary big" data-a="recruit">Build the next operative</button></div>
  </section>`;
}

function render() {
  const screens = { route: routeScreen, room: roomScreen, intro: introScreen, create: createScreen, town: townScreen, combat: combatScreen, victory: victoryScreen, event: eventScreen, sectorClear: sectorClearScreen, death: deathScreen };
  // Recover from inconsistent saves instead of rendering a blank page.
  if (!state.char && !['intro', 'create'].includes(state.screen)) { state.screen = 'create'; if (!state.draft) state.draft = E.newDraft(state.meta, rng); }
  if (!state.run && ['combat', 'victory', 'event', 'sectorClear', 'route', 'room'].includes(state.screen)) state.screen = 'town';
  if (state.screen === 'route' && !(state.run.choices && state.run.choices.length)) E.offerRoute(state, rng);
  if (state.screen === 'room' && !state.roomResult) E.offerRoute(state, rng);
  if (state.screen === 'combat' && !state.run.enemy) E.offerRoute(state, rng);
  if (state.screen === 'event' && !E.eventById(state.event)) state.screen = 'combat';
  const showStatus = state.screen !== 'intro';
  document.getElementById('app').innerHTML = (showStatus ? statusStrip() : '') + screens[state.screen]();
  const slot = document.getElementById('stage-slot');
  if (slot) {
    slot.replaceWith(stage.el);
    const r = state.run, st = E.stats(state);
    stage.sync({ run: r, enemy: r.enemy, sector: r.sector, boss: r.enemy.boss, theme: E.mapById(r.map).theme, allies: r.allies, player: { name: state.char.name, level: state.char.level, hp: state.char.hp, maxHp: st.maxHp } });
  }
  const log = document.getElementById('log');
  if (log) log.scrollTop = log.scrollHeight;
  save();
}

// ---------- input ----------
const stage = new Stage();
let busy = false;

async function fight(v) {
  if (busy || !E.canUse(state, v)) return;
  busy = true;
  document.getElementById('app').classList.add('busy');
  state.events = [];
  E.playerAct(state, v, rng);
  const events = state.events;
  delete state.events;
  save();
  try { await stage.play(events); } finally {
    busy = false;
    document.getElementById('app').classList.remove('busy');
    render();
  }
}

function act(a, v, k) {
  if (busy) return;
  if (a === 'act') return fight(v);
  if (a !== 'reset') confirmReset = false;
  switch (a) {
    case 'begin': state.screen = 'create'; if (!state.draft) state.draft = E.newDraft(state.meta, rng); break;
    case 'bg': state.draft.background = v; { for (const key of Object.keys(D.ATTRS)) while (E.draftAttr(state.draft, key) > D.ATTR_CREATE_MAX) E.draftAdjust(state.draft, key, -1); } break;
    case 'attr': E.draftAdjust(state.draft, v, +k); break;
    case 'randname': state.draft.name = D.OPERATIVE_NAMES[Math.floor(rng() * D.OPERATIVE_NAMES.length)]; break;
    case 'create': E.createChar(state, rng); state.gateMap = 'garrison'; break;
    case 'tab': state.tab = v; state.notice = null; break;
    case 'gear': E.buyGear(state, k, v); break;
    case 'item': E.buyItem(state, v); break;
    case 'upgrade': E.buyUpgrade(state, v); break;
    case 'implant': E.installImplant(state, v); break;
    case 'unimplant': E.removeImplant(state, v); break;
    case 'heal': E.heal(state); break;
    case 'train': E.train(state, v); break;
    case 'cell': E.buyCell(state, v); break;
    case 'spend': E.spendAttr(state, v); break;
    case 'pickmap': state.gateMap = v; break;
    case 'deploy': E.deploy(state, state.gateMap || 'garrison', +v, rng); break;
    case 'continue': E.continueAfterVictory(state, rng); break;
    case 'room': E.enterRoom(state, +v, rng); break;
    case 'roomDone': E.offerRoute(state, rng); break;
    case 'event': E.resolveEvent(state, +v, rng); break;
    case 'eventDone': E.nextEncounter(state, rng); break;
    case 'deeper': E.pushDeeper(state, rng); break;
    case 'extract': E.endRun(state, 'extracted'); break;
    case 'recruit': E.recruit(state, rng); break;
    case 'reset':
      if (!confirmReset) { confirmReset = true; break; }
      confirmReset = false; state = E.newGame(rng); break;
  }
  render();
}

document.addEventListener('click', (ev) => {
  const b = ev.target.closest('button[data-a]');
  if (!b || b.disabled) return;
  act(b.dataset.a, b.dataset.v, b.dataset.k);
});
document.addEventListener('input', (ev) => {
  if (ev.target.id === 'op-name' && state.draft) { state.draft.name = ev.target.value; save(); }
});

document.addEventListener('keydown', (ev) => {
  if (ev.metaKey || ev.ctrlKey || ev.altKey || busy || ev.target.tagName === 'INPUT') return;
  const key = ev.key.toLowerCase();
  if (state.screen === 'combat') {
    const map = { a: 'attack', d: 'defend', r: 'run', s: 'stim', 1: 'stim', 2: 'thermal', 3: 'ion', 4: 'smoke' };
    E.skillsOf(state.char).slice(0, 3).forEach((sk, i) => { map[SKILL_KEYS[i]] = sk; });
    if (map[key] && E.canUse(state, map[key])) { ev.preventDefault(); act('act', map[key]); }
  } else if (state.screen === 'route' && (key === '1' || key === '2') && state.run.choices[+key - 1]) {
    ev.preventDefault(); act('room', String(+key - 1));
  } else if (key === 'enter') {
    if (state.screen === 'victory') { ev.preventDefault(); act('continue'); }
    else if (state.screen === 'room') { ev.preventDefault(); act('roomDone'); }
    else if (state.screen === 'event' && state.eventResult) { ev.preventDefault(); act('eventDone'); }
  }
});

function start(data) {
  state = E.migrate((data && data.state) || load(), rng);
  delete state.events;
  if (state.screen === 'create' && !state.draft) state.draft = E.newDraft(state.meta, rng);
  render();
  // PixelLab sheets, if any have been delivered. Re-render so the stage picks them up.
  loadSheets().then((n) => { if (n && ['combat', 'victory', 'death'].includes(state.screen)) { stage.enemyRef = null; stage.player = null; render(); } });
}
window.claude?.hot?.snapshot?.(() => ({ state }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
