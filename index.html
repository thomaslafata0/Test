        <span class="label">Skills \u00B7 from your weapons and attributes</span><div class="rows">${skills}</div>
        <span class="label">Marks \u00B7 ${(c.marks || []).length} / 5 \u00B7 earned in orbit</span>${(c.marks || []).length ? `<div class="perk-list">${c.marks.map((id) => { const mk = D.MARKS[id]; return `<div class="perk-mini rare">${ico(`mark:${id}`, 'sm2')}<div><b>${esc(mk.name)}</b><span>${esc(mk.desc)}</span></div></div>`; }).join('')}</div>` : '<p class="muted">None yet. Fly the shuttle (Orbit, after curfew) on the harder runs.</p>'}
        ${(() => { const fb = E.featBuffs(m), t = Object.entries(fb).filter(([k, v]) => k !== 'vs' && v > 0), vs = Object.keys(fb.vs).length; return `<span class="label">Feats \u00B7 the cell\u2019s permanent edges</span>${t.length || vs ? `<div class="chips">${t.map(([k, v]) => `<span class="chip good">+${(v * 100).toFixed(1).replace(/\.0$/, '')}% ${esc(E.BUFF_NAMES[k])}</span>`).join('')}${vs ? `<span class="chip good">bonus damage vs ${vs} enemy type${vs > 1 ? 's' : ''}</span>` : ''}<button class="btn" data-a="modal" data-v="feats" style="margin-left:4px">All feats</button></div>` : '<p class="muted">No tiers yet. Everything the cell does counts: see <button class="btn" data-a="modal" data-v="feats">Feats</button>.</p>'}`; })()}
        <span class="label">Contraband \u00B7 ${c.perks.length} / ${E.CONTRABAND_SLOTS} pockets</span>${c.perks.length ? `<div class="perk-list">${c.perks.map((id) => { const pk = E.perkById(id); return `<div class="perk-mini ${pk.rare ? 'rare' : ''}">${ico(`perk:${id}`, 'sm2')}<div><b>${esc(pk.name)}</b><span>${esc(pk.desc)}</span></div></div>`; }).join('')}</div>` : '<p class="muted">None yet. Elites and bosses carry it.</p>'}
      </div>
      <div style="display:grid;gap:14px;align-content:start;min-width:0">
        <span class="label">Choices that changed you</span><div class="wall">${history}</div>
        <span class="label">The wall \u00B7 ${m.operatives} operative${m.operatives === 1 ? '' : 's'} so far</span><div class="wall">${wall}</div>
      </div>
    </div>`;
}

function gate() {
  const c = state.char, st = E.stats(state), m = state.meta;
  const sel = E.mapById(state.gateMap || 'garrison');
  const cards = D.MAPS.map((mp) => {
    const open = E.mapUnlocked(state, mp), prog = c.maps[mp.id], lib = m.liberated[mp.id];
    const traits = [mp.credits !== 1 ? `${mp.credits > 1 ? '+' : ''}${pct(mp.credits - 1)} credits` : null, mp.level ? `enemies +${mp.level} lv` : null].filter(Boolean);
    return `<button class="map-card ${mp.id === sel.id ? 'on' : ''} theme-${mp.theme}" data-a="pickmap" data-v="${mp.id}" ${open ? '' : 'disabled'} aria-pressed="${mp.id === sel.id}">
      <span class="label">${!open ? `Locked \u00B7 reach sector ${mp.unlock} anywhere` : lib ? '<span class="lib">Liberated</span>' : `Best: sector ${m.bestByMap[mp.id] || 0} / 15`}</span>
      <b>${esc(mp.name)}</b><span class="desc">${esc(mp.desc)}</span>
      <span class="mech-line"><b>${esc(mp.mechanic.name)}.</b> ${esc(mp.mechanic.desc)}</span>
      ${traits.length ? `<span class="chips">${traits.map((t) => `<span class="chip">${t}</span>`).join('')}</span>` : ''}
      ${prog && prog.deepest ? `<span class="label">This operative: sector ${prog.deepest}</span>` : ''}</button>`;
  }).join('');
  const ins = [...(c.maps[sel.id]?.insertions || [1])].sort((a, b) => a - b);
  const warn = c.hp < st.maxHp * 0.6 ? `<p class="danger-text">You\u2019re going in at ${c.hp}/${st.maxHp} HP. The clinic is right there.</p>` : '';
  const mt = E.maxThreat(state);
  const threat = mt > 0 ? `<div class="threat"><span class="label">Threat level</span><div class="btnrow">${D.THREAT.slice(0, mt + 1).map((t, i) => `<button class="btn ${m.threat === i ? 'primary' : ''}" data-a="threat" data-v="${i}" title="${esc(t.desc)}">${esc(t.name)}</button>`).join('')}</div><p class="muted" style="font-size:.88rem">${esc(D.THREAT[m.threat].desc)}</p></div>` : '';
  const contracts = (m.contracts || []).map((k) => `<div class="contract ${k.done ? 'done' : ''}"><div><b>${esc(k.text)}</b><span class="muted"> ${k.done ? 'Complete' : `${Math.min(k.progress, k.n)} / ${k.n}`}</span></div><span class="chip ${k.done ? 'good' : ''}">+${k.resolve} ${esc(S.meta)} \u00B7 +${k.credits} ${S.cur}</span></div>`).join('');
  return `<div class="maps">${cards}</div>
    ${threat}
    <div class="deploy-row">
      <div style="display:grid;gap:8px;min-width:0">
        <span class="label">Insertion point \u00B7 ${esc(sel.name)}</span>
        ${isGuest() ? `<p class="muted" style="font-size:.9rem">The host picks the target. Tell them you\u2019re ready.</p><div><button class="btn ${state.guestReady ? 'primary' : ''}" data-a="coopready" aria-pressed="${!!state.guestReady}">${state.guestReady ? 'Ready \u00B7 waiting for the host' : 'Ready for the raid'}</button></div>`
        : `<div class="ins">${ins.map((n) => `<button class="btn ${n === ins[ins.length - 1] ? 'primary' : ''}" data-a="deploy" data-v="${n}" ${E.isCoop(state) && !state.guestReady ? 'disabled' : ''}>Sector ${n} \u00B7 ${esc(E.sectorName(n, sel.id))}</button>`).join('')}</div>${E.isCoop(state) ? `<p class="muted" style="font-size:.88rem">${state.guestReady ? `${esc(state.guestName || 'Your friend')} is ready.` : `Waiting for ${esc(state.guestName || 'your friend')} to press Ready at their terminal.`}</p>` : ''}`}
        ${ins.length === 1 ? '<p class="muted" style="font-size:.88rem">Beat a boss to unlock a deeper insertion point on that map for this operative.</p>' : ''}
        ${warn}
        ${c.wanted ? `<p class="muted" style="font-size:.88rem"><span class="wanted">Wanted ${c.wanted}</span>: the Directorate knows this face. Enemies +${Math.round(c.wanted * E.TUNE.wanted * 100)}% HP and ATK, credits +${Math.round(c.wanted * E.TUNE.wanted * 100)}%. Rises by 1 every raid you survive. <b>Lower it at the safehouse</b> (Character &amp; Resolve: Lie low).</p>` : ''}
      </div>
      <div style="display:grid;gap:8px;min-width:0"><span class="label">Contracts from the cell</span><div class="contracts">${contracts || '<p class="muted">No jobs right now.</p>'}</div></div>
    </div>`;
}

function portraitImg(e, cls = '') {
  const src = e.portrait || sheetStill(e.id) || portraitURL(e.id);
  return src ? `<img class="portrait ${cls}" src="${src}" alt="Portrait of ${esc(e.name)}" width="160" height="160">` : '';
}

function intentLabel(e, k) { return k === 'special' ? D.SPECIALS[e.id].name : D.INTENTS[k] ? D.INTENTS[k].label : k; }
function intentInfo(e) {
  if (e.stun > 0) return { label: `Stunned \u00B7 ${e.stun} turn${e.stun > 1 ? 's' : ''}`, tone: 'calm', tip: 'It can\u2019t act. Free hits.' };
  if (e.intent === 'special') { const sp = D.SPECIALS[e.id]; return { label: sp.name, tone: 'danger', tip: sp.tip }; }
  return D.INTENTS[e.intent];
}
function combatScreen() {
  const r = state.run, e = r.enemy, c = state.char, st = E.stats(state);
  const intent = intentInfo(e);
  const sr = E.attackRange(state, false), mr = E.attackRange(state, true);
  const coop = E.isCoop(state), mine = !coop || r.actor === myIdx();
  const party = coop ? `<div class="party">${[0, 1].map((i) => { const pc = E.charAt(state, i); if (!pc) return ''; const pst = E.statsOf(state.meta, pc); return `<div class="pm ${r.actor === i ? 'turn' : ''} ${i === myIdx() ? 'me' : ''}"><span class="label">${i === myIdx() ? 'You' : esc(pc.name)}${r.actor === i ? ' \u00B7 acting' : ''}${pc.downed ? ` \u00B7 <span class="danger-text">down, ${pc.downed} round${pc.downed > 1 ? 's' : ''} left</span>` : ''}</span><b>${Math.max(0, pc.hp)} / ${pst.maxHp}</b>${bar(pc.hp, pst.maxHp)}</div>`; }).join('')}</div>` : '';
  const waiting = coop && !mine ? `<div class="notice ${c.downed ? 'lose' : ''}">${c.downed ? `You\u2019re down, bleeding out: ${c.downed} round${c.downed > 1 ? 's' : ''} left. ${esc(E.charAt(state, 1 - myIdx()).name)} can get you up.` : `Waiting for ${esc(E.charAt(state, 1 - myIdx()).name)} to act\u2026`}</div>` : '';
  const downedMate = coop && mine ? E.partnerDown(state) : null;
  const reviveBtn = downedMate ? `<button class="btn primary big" data-a="act" data-v="revive" style="width:100%">Get ${esc(downedMate.name.split(' ')[0])} up \u00B7 ${downedMate.downed} round${downedMate.downed > 1 ? 's' : ''} left<span class="k">V</span></button>` : '';
  const confirmSmoke = state.confirmSmoke && c.items.smoke;
  const items = ['thermal', 'ion', 'smoke'].map((id, i) => `<button class="btn twoline ${id === 'smoke' && confirmSmoke ? 'confirm' : ''}" data-a="act" data-v="${id}" title="${esc(D.ITEMS[id].desc)}" ${c.items[id] ? '' : 'disabled'}>
      <span class="bt">${ico(`item:${id}`, 'sm')}${esc(D.ITEMS[id].name)} <span class="num">\u00D7${c.items[id]}</span><span class="k">${i + 2}</span></span>
      <span class="bs">${id === 'smoke' && confirmSmoke ? 'Tap again to leave the raid' : esc(D.ITEMS[id].short)}</span></button>`).join('');
  const skills = E.skillsOf(c).slice(0, 4).map((k, i) => {
    const cd = r.cooldowns[k] || 0, sk = D.SKILLS[k];
    const status = k === 'intimidate' ? (cd ? 'used this sector' : e.tags.includes('human') ? `${pct(E.intimidateChance(state))} chance` : 'humans only') : cd ? `ready in ${cd}` : 'ready';
    const note = `${esc(sk.short)} <span class="sk-status">${status}</span>`;
    return `<button class="btn skill ${cd ? '' : 'ready'}" data-a="act" data-v="${k}" title="${esc(sk.desc)}" ${E.canUse(state, k) && !(k === 'intimidate' && !e.tags.includes('human')) ? '' : 'disabled'}>
      <span class="sk-name">${ico(`skill:${k}`, 'sm')}${esc(sk.name)}<span class="k">${SKILL_KEYS[i].toUpperCase()}</span></span><span class="sk-note">${note}</span></button>`;
  }).join('');
  const meta = [...e.tags.filter((t) => t !== 'boss').map((t) => `<span class="tag ${t}">${t}</span>`),
    `<span>ATK <b>${e.atk}</b></span>`, `<span>DEF <b>${e.def}</b></span>`, `<span>SPD <b>${e.spd}</b></span>`,
    `<span>Dodge <b>${pct(E.dodgeChance(st, e))}</b></span>`, `<span>Run <b>${pct(E.runChance(state))}</b></span>`].join('');
  return `<div class="columns"><section class="panel combat">
    <div class="combat-head"><span class="label">${esc(E.mapById(r.map).name)} \u00B7 Sector ${r.sector} \u00B7 ${esc(E.sectorName(r.sector, r.map))}</span>${stage.auto ? '<span class="auto-note">Auto battle \u00B7 tap Manual to take over</span>' : ''}${roomPips(r)}</div>
    <div id="stage-slot"></div>
    <div class="intent ${intent.tone}"><span class="dot"></span><b>${esc(intent.label)}</b><span class="tip">${esc(intent.tip)}${st.scan && e.next ? ` <span class="next-intent">Scanner: then ${esc(intentLabel(e, e.next))}</span>` : ''}</span><span class="intent-side">${mechanicChip(r)}${r.ready ? `<span class="chip good">Aim +${E.hasPerk(c, 'steady') ? 100 : 50}%</span>` : ''}${r.momentum ? `<span class="chip good">Momentum +${Math.round(E.TUNE.momentum * 100)}%</span>` : ''}</span></div>
    <div class="statline">${meta}</div>
    ${e.quirk ? `<div class="quirk-line"><span class="chip quirk">${esc(E.quirkById(e.quirk).name)}</span><span>${esc(E.quirkById(e.quirk).desc)}</span></div>` : ''}
    ${D.MELEE_COUNTER[e.id] ? `<div class="quirk-line"><span class="chip bad">${esc(D.MELEE_COUNTER[e.id].name)}</span><span>${esc(D.MELEE_COUNTER[e.id].desc)}</span></div>` : ''}
    ${e.affix ? `<div class="quirk-line"><span class="chip bad">${esc(D.AFFIXES[e.affix].name)}</span><span>${esc(D.AFFIXES[e.affix].desc)}</span></div>` : ''}
    ${tip('combat')}
    ${party}${waiting}${reviveBtn}
    <div class="actions ${mine ? '' : 'locked'}">
      <button class="btn primary twoline atk" data-a="act" data-v="shoot" title="${esc(E.weaponOf(c).name)}: ${st.atk} ATK, ${pct(E.critChance(st, e))} crit. Steady damage; cover halves it. You keep your distance, so you take ${Math.round(E.TUNE.shootGuard * 100)}% less damage this turn."><span class="bt">Shoot<span class="k">A</span></span><span class="wpn">${esc(E.weaponOf(c).name)}</span><span class="bs"><b class="rng">${sr[0]}\u2013${sr[1]}</b> dmg${e.intent === 'guard' && !e.stun ? ' (cover)' : ''} \u00B7 take ${Math.round(E.TUNE.shootGuard * 100)}% less this turn</span></button>
      <button class="btn twoline atk ${D.MELEE_COUNTER[e.id] ? 'warn' : ''}" data-a="act" data-v="strike" title="${esc(E.meleeOf(c).name)}: ${st.atkM} ATK, ${pct(E.critChance(st, e, true))} crit. Swingy damage, ignores cover, and your next attack hits ${Math.round(E.TUNE.momentum * 100)}% harder."><span class="bt">Strike<span class="k">F</span></span><span class="wpn">${esc(E.meleeOf(c).name)}</span><span class="bs"><b class="rng">${mr[0]}\u2013${mr[1]}</b> dmg \u00B7 ${D.MELEE_COUNTER[e.id] ? 'it hits back!' : `next hit +${Math.round(E.TUNE.momentum * 100)}%${e.intent === 'guard' && !e.stun ? ', ignores cover' : ''}`}</span></button>
      <button class="btn twoline" data-a="act" data-v="defend"><span class="bt">Defend<span class="k">D</span></span><span class="bs">Halve damage, aim next shot</span></button>
      <button class="btn twoline" data-a="act" data-v="stim" ${c.items.stim ? '' : 'disabled'}><span class="bt">${ico('item:stim', 'sm')}Stim <span class="num">\u00D7${c.items.stim}</span><span class="k">S</span></span><span class="bs">${esc(D.ITEMS.stim.short)}</span></button>
      <button class="btn twoline" data-a="act" data-v="run"><span class="bt">Run<span class="k">R</span></span><span class="bs">${pct(E.runChance(state))} to escape, drop ${Math.round(E.hard(state).escape * 100)}% of loot</span></button>
    </div>
    ${skills ? `<div class="skills ${mine ? '' : 'locked'}">${skills}</div>` : ''}
    <div class="items">${items}</div>
  </section>${logPanel()}</div>`;
}

const ROOM_LABEL = { fight: 'Fight', elite: 'Elite fight', event: 'Event', supply: 'Supplies', rest: 'Rest', cells: 'Prisoners', cargo: 'Cargo', boss: 'Boss', bounty: 'Bounty fight', vault: 'Strongroom', medbay: 'Medic', locker: 'Gear', bench: 'Upgrade', fence: 'Contraband' };
function mechanicChip(r) {
  const m = E.mapById(r.map).mechanic;
  let v = '';
  if (m.id === 'alarm') v = `${'\u25A0'.repeat(r.alert)}${'\u25A1'.repeat(5 - r.alert)} ${r.alert}/5`;
  if (m.id === 'vents') v = r.enemy ? (r.vent === 1 ? 'blast next turn' : `blast in ${r.vent} turns`) : 'every 3 turns';
  if (m.id === 'allies') v = `${r.allies}/2 with you`;
  if (m.id === 'snipers') v = '20% per turn';
  const hot = (m.id === 'vents' && r.enemy && r.vent === 1) || (m.id === 'alarm' && r.alert >= 3);
  return `<span class="mech ${hot ? 'hot' : ''}" title="${esc(m.desc)}"><b>${esc(m.name)}</b> ${v}</span>`;
}
function bulletinBox(r) {
  const b = E.bulletinOf(r);
  if (b.id === 'quiet') return '';
  return `<div class="bulletin"><span class="label">Directorate bulletin</span><b>${esc(b.name)}</b><span>${esc(b.desc)}</span></div>`;
}
function roomPips(r) {
  return `<span class="pips rooms" aria-label="room ${r.room} of ${E.FIGHTS_PER_SECTOR}">${Array.from({ length: E.FIGHTS_PER_SECTOR }, (_, i) => `<i class="${i < r.room ? 'on' : ''}"></i>`).join('')}</span>`;
}

// v5: the floor condition for this sector, under the raid's bulletin.
function condBox(r) {
  const k = E.condOf(r);
  if (!r.cond || r.cond === 'none') return '';
  return `<div class="bulletin cond"><span class="label">This floor</span><b>${esc(k.name)}</b><span>${esc(k.desc)}</span></div>`;
}
function routeScreen() {
  const r = state.run, map = E.mapById(r.map), c = state.char, st = E.stats(state);
  const coopVote = E.isCoop(state) && net && net.peer, votes = (coopVote && r.votes) || {}, mate = E.charAt(state, 1 - myIdx());
  const voteChips = (i) => [votes[myIdx()] === i ? '<span class="chip good">Your vote</span>' : '', mate && votes[1 - myIdx()] === i ? `<span class="chip">${esc(mate.name.split(' ')[0])}\u2019s vote</span>` : ''].join('');
  const doors = r.choices.map((k, i) => `<button class="door door-${k}" data-a="room" data-v="${i}">${ico(`room:${k}`)}
      <span class="label">${ROOM_LABEL[k]} <span class="k">${i + 1}</span></span>${voteChips(i) ? `<span class="chips">${voteChips(i)}</span>` : ''}
      <b>${esc(E.roomName(r.map, k))}</b><span class="desc">${esc(D.ROOMS[k].desc)}</span></button>`).join('');
  const cds = Object.entries(r.cooldowns).filter(([, v]) => v > 0).map(([k, v]) => `${D.SKILLS[k].name} ${v >= 50 ? 'used' : `ready in ${v}`}`);
  return `<div class="columns"><section class="panel">
    <div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center"><span class="label">${esc(map.name)} \u00B7 Sector ${r.sector} \u00B7 ${esc(E.sectorName(r.sector, r.map))}</span>${roomPips(r)}</div>
    ${afterAction()}
    <h2>${r.choices[0] === 'boss' ? 'No way around it' : r.room === 0 ? 'Which way in?' : 'Two doors'}</h2>
    ${tip('route')}
    ${r.forced ? '<p class="muted" style="font-size:.9rem">Every sector takes at least two fights. Both doors are hot.</p>' : ''}
    <div class="mech-row">${mechanicChip(r)}<span class="muted" style="font-size:.9rem">${esc(map.mechanic.desc)}</span></div>
    ${bulletinBox(r)}
    ${condBox(r)}
    ${coopVote ? `<p class="muted" style="font-size:.9rem">Both of you pick a door. If you disagree, a coin decides.${votes[myIdx()] === undefined && mate && votes[1 - myIdx()] !== undefined ? ` <b>${esc(mate.name.split(' ')[0])} has voted.</b>` : ''}</p>` : ''}
    <div class="doors">${doors}</div>
    <dl class="kv"><dt>Condition</dt><dd class="${c.hp < st.maxHp * 0.4 ? 'danger-text' : ''}">${c.hp} / ${st.maxHp} HP \u00B7 ${c.items.stim} stims</dd>
      <dt>Skills</dt><dd>${cds.length ? esc(cds.join(', ')) : 'All ready'}</dd></dl>
    <p class="muted" style="font-size:.85rem">Skill cooldowns carry over between fights in a sector and reset when you enter a new one.</p>
  </section>${logPanel()}</div>`;
}

function roomScreen() {
  const r = state.run, res = state.roomResult;
  return `<div class="columns"><section class="panel">
    <div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center"><span class="label">${ROOM_LABEL[res.kind]} \u00B7 ${esc(E.sectorName(r.sector, r.map))}</span>${roomPips(r)}</div>
    <h2>${esc(res.name)}</h2>
    <p style="font-size:1.1rem;max-width:58ch">${esc(res.text)}</p>
    ${res.notes.length ? `<div class="chips">${res.notes.map((n) => `<span class="chip ${/alerted/.test(n) ? 'bad' : 'good'}">${esc(n)}</span>`).join('')}</div>` : ''}
    <div><button class="btn primary big" data-a="roomDone">Move on<span class="k">\u21B5</span></button></div>
  </section>${logPanel()}</div>`;
}

function victoryScreen() {
  const o = state.outcome, c = state.char, r = state.run;
  return `<div class="columns"><section class="panel">
    ${o.liberated ? `<div class="liberated"><span class="label">District liberated</span><b>${esc(o.liberated)}</b><span>The Directorate has lost its grip here. Threat levels are now available under Missions.</span></div>` : ''}
    <div class="killer">${o.id ? portraitImg({ id: o.id, name: o.enemy, portrait: o.portrait }, 'down') : ''}<div style="display:grid;gap:4px"><span class="label">${o.fled ? 'Target fled' : 'Target down'}</span><h2>${esc(o.enemy)}</h2></div></div>
    <dl class="kv"><dt>Credits</dt><dd style="color:var(--sodium)">+${o.credits}</dd><dt>XP</dt><dd>+${o.xp}</dd>
    ${o.levelUps.length ? `<dt>Level up</dt><dd class="ok-text">Now level ${o.levelUps[o.levelUps.length - 1]} \u00B7 +${o.levelUps.length} attribute point${o.levelUps.length > 1 ? 's' : ''}</dd>` : ''}
    ${o.healed ? `<dt>Field medic</dt><dd class="ok-text">+${o.healed} HP</dd>` : ''}
    ${o.items && o.items.length ? `<dt>Scavenged</dt><dd class="ok-text">${o.items.map(esc).join(', ')}</dd>` : ''}
    ${(o.notes || []).map((n) => `<dt>Note</dt><dd>${esc(n)}</dd>`).join('')}
    ${o.loot ? `<dt>Dropped</dt><dd class="ok-text">${esc(o.loot)}</dd>` : ''}
    ${o.resolve ? `<dt>${esc(S.meta)}</dt><dd style="color:var(--sodium)">+${o.resolve}, and a deeper insertion point</dd>` : ''}</dl>
    ${c.attrPoints ? `<div class="spend-inline"><span class="label">Spend ${c.attrPoints} attribute point${c.attrPoints > 1 ? 's' : ''}</span><div class="btnrow">${Object.entries(D.ATTRS).map(([k, a]) => `<button class="btn" data-a="spend" data-v="${k}" title="${esc(a.desc)}">${a.short} ${c.attrs[k]} \u2192 ${c.attrs[k] + 1}</button>`).join('')}</div></div>` : ''}
    <div><button class="btn primary big" data-a="continue">${r && r.lootOffer ? 'Check the drop' : r && r.perkOffer ? 'Search the body' : 'Keep moving'}<span class="k">\u21B5</span></button></div>
  </section>${logPanel()}</div>`;
}

// ---------- between fights: a slim raid view with popups on top ----------
function afterAction() {
  const o = state.lastResult, c = state.char;
  if (!o) return '';
  let main = '', chips = [];
  if (o.kind === 'fight') {
    main = `<b>${esc(o.enemy)}</b> ${o.fled ? 'fled' : 'down'}`;
    chips.push(`+${o.credits} ${S.cur}`, `+${o.xp} XP`);
    if (o.healed) chips.push(`+${o.healed} HP`);
    for (const it of o.items || []) chips.push(`found ${it}`);
    for (const n of o.notes || []) chips.push(n);
    if (o.loot) chips.push(`dropped ${o.loot}`);
    if (o.resolve) chips.push(`+${o.resolve} ${S.meta}`);
  } else {
    main = `<b>${esc(o.name)}</b> <span class="muted">${esc(o.text)}</span>`;
    chips = o.notes || [];
  }
  const feats = o.kind === 'fight' && o.feats && o.feats.length ? `<div class="aa-feats">${o.feats.slice(0, 4).map((p) => `<div class="aa-feat ${p.done ? 'done' : ''}" title="${esc(E.FEAT_DEFS[p.key].desc)}"><span class="num">${esc(p.name)} <b>${p.done ? 'IV' : `${p.count}/${p.next}`}</b></span>${featBar(p)}</div>`).join('')}</div>` : '';
  const lvl = o.kind === 'fight' && o.levelUps && o.levelUps.length ? `<span class="chip good">Level ${o.levelUps[o.levelUps.length - 1]}!</span>` : '';
  const spend = c.attrPoints ? `<div class="aa-spend"><span class="label">${c.attrPoints} point${c.attrPoints > 1 ? 's' : ''} to spend</span>${Object.entries(D.ATTRS).map(([k, a]) => `<button class="btn" data-a="spend" data-v="${k}" title="${esc(a.desc)}" ${c.attrs[k] >= D.ATTR_MAX ? 'disabled' : ''}>${a.short} ${c.attrs[k]}\u2192${c.attrs[k] + 1}</button>`).join('')}</div>` : '';
  return `${o.liberated ? `<div class="liberated"><span class="label">District liberated</span><b>${esc(o.liberated)}</b><span>Threat levels are now available under Missions.</span></div>` : ''}
    <div class="aa"><div class="aa-main">${main} ${lvl}<span class="chips">${chips.map((t) => `<span class="chip ${/\u2212|alerted|exploded/.test(t) ? 'bad' : 'good'}">${esc(t)}</span>`).join('')}</span></div>
    <button class="tool" data-a="dismissresult" aria-label="Hide">\u00D7</button>${feats}${spend}</div>`;
}
// The view behind loot, contraband and sector-clear popups.
function popupView(inner) {
  const r = state.run;
  return `<div class="columns"><section class="panel">
    <div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center"><span class="label">${esc(E.mapById(r.map).name)} \u00B7 Sector ${r.sector} \u00B7 ${esc(E.sectorName(r.sector, r.map))}</span>${roomPips(r)}</div>
    ${afterAction()}
    <p class="muted">The corridor goes quiet for a moment.</p>
  </section>${logPanel()}</div>
  <div class="popup-wrap"><div class="modal popup" role="dialog" aria-modal="true">${inner}</div></div>`;
}

function lootScreen() {
  const r = state.run, c = state.char, it = r.lootOffer, b = E.baseOf(it), old = c.gear[b.slot], ok = E.canEquip(c, it);
  return popupView(`
    <span class="label">Dropped \u00B7 ${esc(D.RARITY[it.rarity].name)} ${esc(SLOTS[b.slot].name.toLowerCase())}</span><h2>${b.unique ? 'Something with a name on it' : 'Something worth taking'}</h2>
    ${tip('loot')}
    <div class="loot">
      <div style="display:grid;gap:6px;align-content:start"><span class="label">The drop</span>${itemCard(it, { cls: 'new' })}</div>
      <div style="display:grid;gap:6px;align-content:start"><span class="label">What you\u2019re using</span>${old ? itemCard(old, { compare: false }) : '<p class="muted">Nothing in that slot.</p>'}</div>
    </div>
    <div class="btnrow">
      <button class="btn primary big" data-a="loottake" ${ok ? '' : 'disabled'}>${ok ? `Take it${old && E.baseOf(old).tier > 0 ? ' \u00B7 leave the old one' : ''}` : `Needs ${E.reqText(b.req)}`}<span class="k">1</span></button>
      <button class="btn big" data-a="lootsell">Leave it<span class="k">2 \u00B7 Esc</span></button>
    </div>
  `);
}

// Co-op rewards: each player sees only their own choice, then waits for the other.
function rewardScreen() {
  const r = state.run;
  if (r.lootOffer) return lootScreen();
  if (r.perkOffer) return perkScreen();
  const pc = E.charAt(state, 1 - myIdx());
  return popupView(`<span class="label">Spoils</span><h2>Picked over</h2><p>Waiting for ${esc(pc ? pc.name : 'your partner')} to choose what they\u2019re taking\u2026</p>`);
}
const rewardView = () => { const r = state.run; if (!r || !['loot', 'perk'].includes(state.screen)) return null; return r.lootOffer ? 'loot' : r.perkOffer ? 'perk' : null; };
function perkScreen() {
  const r = state.run, c = state.char, full = c.perks.length >= E.CONTRABAND_SLOTS, picked = state.perkPick;
  const cards = r.perkOffer.map((id, i) => { const pk = E.perkById(id); return `<button class="perk ${pk.rare ? 'rare' : ''} ${picked === id ? 'on' : ''}" data-a="perk" data-v="${id}" aria-pressed="${picked === id}">${ico(`perk:${id}`, 'lg')}<span class="label">${pk.rare ? 'Rare contraband' : 'Contraband'} <span class="k">${i + 1}</span></span><b>${esc(pk.name)}</b><span class="desc">${esc(pk.desc)}</span></button>`; }).join('');
  const swap = full && picked ? `<div class="swap"><span class="label">Pockets full \u00B7 drop one to take the ${esc(E.perkById(picked).name)}</span>
    <div class="perk-list">${c.perks.map((id) => { const pk = E.perkById(id); return `<button class="perk-mini drop ${pk.rare ? 'rare' : ''}" data-a="perkdrop" data-v="${id}">${ico(`perk:${id}`, 'sm2')}<div><b>Drop ${esc(pk.name)}</b><span>${esc(pk.desc)}</span></div></button>`; }).join('')}</div></div>` : '';
  return popupView(`
    <span class="label">Contraband \u00B7 pick one \u00B7 pockets ${c.perks.length} / ${E.CONTRABAND_SLOTS}</span><h2>What they were carrying</h2>
    ${tip('perk')}
    <div class="perks">${cards}</div>
    ${swap}
    ${full && !picked ? '<p class="muted">Your pockets are full. Pick a piece to see what you\u2019d have to drop for it.</p>' : ''}
    <div><button class="btn" data-a="perk" data-v="">${full ? 'Keep what I have' : 'Leave it all'}</button></div>
  `);
}

function endingScreen() {
  const m = state.meta;
  return `<section class="panel ending" style="padding:36px">
    <span class="label">${esc(S.town)} \u00B7 dawn</span>
    <h1 class="big-title">The yard rises</h1>
    <div class="story"><p>The garrison gate stands open. The furnaces are cold, the cells are empty, and the lift to orbit has stopped running. For the first time in three years, nobody in ${esc(S.town)} is working a Directorate shift.</p>
    <p>${m.operatives === 1 ? 'One operative' : `${m.operatives} operatives`} walked through the gate to get here. ${m.operatives === 1 ? 'Their name is' : 'Their names are'} on the wall in the safehouse.</p></div>
    <dl class="kv"><dt>Operatives</dt><dd>${m.operatives}</dd><dt>Raids</dt><dd>${m.stats.raids}</dd><dt>Enemies down</dt><dd>${m.stats.kills}</dd><dt>Bosses</dt><dd>${m.stats.bosses}</dd><dt>Resolve earned</dt><dd>${m.totalResolve}</dd></dl>
    <p class="muted">The Directorate will send more. Threat levels are open under Missions for anyone who wants to keep going.</p>
    <div><button class="btn primary big" data-a="ending">Back to the yard</button></div>
  </section>`;
}

function modalView() {
  if (!modal) return '';
  if (['bar', 'wheel', 'orbit', 'ventures'].includes(modal)) return downtimeView();
  const p = A.getPrefs();
  if (modal === 'board') return boardView();
  if (modal === 'feats') return featsView();
  const body = modal === 'manual' ? `
    <h2>Field manual</h2>
    <div class="manual">
      <section><h3>The goal</h3><p>Four districts are under Directorate control. Beat the boss at the end of sector 15 in each to liberate it. Operatives die; the cell remembers.</p></section>
      <section><h3>A raid</h3><p>Pick a target and an insertion point. Each sector is three rooms: you choose one of two doors each time, and at least two rooms will be fights. Every fifth sector ends in a boss. After a sector you push deeper or extract with what you\u2019re carrying.</p></section>
      <section><h3>Reading the enemy</h3><ul>
        <li><b>Taking aim</b>: a normal attack.</li>
        <li><b>Heavy strike</b>: x2.2 damage. Defend to take a quarter.</li>
        <li><b>Signature move</b>: every enemy has one, usually with a status effect. Defend halves it and blocks the status.</li>
        <li><b>Cover</b>: your attacks deal half. Heal or set up instead.</li>
        <li><b>Repair</b>: hit it hard before it heals.</li></ul></section>
      <section><h3>Shoot or Strike</h3><p><b>Shoot</b> uses your ranged weapon: steady damage, crit from Agility, and you take 15% less damage that turn because you keep your distance. <b>Strike</b> uses your melee weapon: swingier damage, adds your Strength, ignores cover and gives your next attack +15%, but some enemies hit back when you close in. Ranged skills use the ranged weapon; Power Strike uses the melee one.</p></section>
      <section><h3>Gear and loot</h3><p>Six slots: ranged, melee, helmet, chest, legs and a gadget. Pieces come in <span class="rname r-common">Common</span>, <span class="rname r-rare">Rare</span>, <span class="rname r-elite">Elite</span> and <span class="rname r-legendary">Legendary</span>, with random bonuses; bosses drop their own <span class="rname r-unique">Unique</span>. The Black Market restocks after every raid. Nobody buys old gear: a new piece replaces the old one. Upgrade pieces (+1 to +5) and reroll bonuses on the Gear tab. Death takes it all, unless the cell has the Heirloom upgrade.</p></section>
      <section><h3>Your turn</h3><p><b>Defend</b> also steadies your aim: your next shot deals +50%. <b>Skills</b> come from your weapon and high attributes; their cooldowns last for the whole sector, so choose your moment. <b>Stims</b> heal and stop bleeding and burning.</p></section>
      <section><h3>Status effects</h3><ul>${Object.values(D.STATUSES).map((x) => `<li><b>${esc(x.name)}</b>: ${esc(x.desc)}</li>`).join('')}</ul></section>
      <section><h3>Elites and bosses</h3><p>Elites (veterans) carry a modifier, such as Regenerating or Volatile. Bosses enrage at half health. Bosses always carry <b>contraband</b> and elites sometimes do: pick one of three perks that last until your operative dies. You have four pockets, so a fifth piece means dropping one.</p></section>
      <section><h3>Feats</h3><p>Everything the cell does is counted across every operative: enemies of each type put down, bosses, crits, shots, strikes, skills, dodges, stims, sectors, extractions, events, contraband, prisoners, credits, operatives lost, upgrades, lying low, orbit wins, spins and rounds. Each feat has four tiers (for enemy types: 1, 10, 50, 100). Every tier adds a small permanent edge, each a little smaller than the last, and the top tiers of the big ones pay Resolve. Progress shows after every fight; the full record is under <b>Feats</b>.</p></section>
      <section><h3>After curfew</h3><p>A second row of buttons in the yard. <b>The Lantern</b>: KEG-7 pours a round (+1 ATK, +4% crit next raid) and tells jokes; the regulars talk. <b>The Wheel</b>: roulette, one bet per spin, zero belongs to the house. <b>Orbit</b>: fly the cell\u2019s shuttle against the blockade. Wins pay credits and, on the harder runs, a permanent <b>Mark</b> (five exist). Lose the shuttle and the pilot dies. Refit the shuttle with credits; cell fittings cost Resolve and survive death. The odds shown are simulated for your current shuttle. <b>Ventures</b>: invest the cell\u2019s money; each venture ticks up or down once per raid and survives the operative.</p></section>
      <section><h3>Quirks and bulletins</h3><p>Regular enemies often have a <b>quirk</b>, like a Drunk trooper whose shots go wild or an Overclocked droid that cooks itself. Every raid also rolls a <b>Directorate bulletin</b>, such as Payday or Staff Party, that bends the rules until you leave.</p></section>
      <section><h3>Floors and rare doors</h3><p>Past the first sector, most floors roll a <b>condition</b> (Blackout, Coolant Leak, Double Patrols, Supply Depot, Hunter Squad, Derelict Wing, Sealed Bulkheads) shown on the route screen. Rare doors turn up on every map: a <b>Marked Officer</b> bounty, a <b>Strongroom</b> to crack with INT, a <b>Field Medic Station</b>, a <b>Weapons Locker</b>, a <b>Machinist\u2019s Bench</b> that upgrades your gear for free, and a <b>Smuggler\u2019s Stash</b> of contraband.</p></section>
      <section><h3>Downtime limits</h3><p>The shuttle flies <b>once per stay in town</b>: raid, come home, and it\u2019s ready again. Ventures hold capped balances (500 / 1,500 / 3,000); Marrow\u2019s consignment opens after sector 5, the smuggler\u2019s bond after sector 10. Deeper cells see better Black Market stock, often already upgraded.</p></section>
      <section><h3>Playing together</h3><p>Host from <b>Settings</b> and send your friend the invite link. You share the yard: walk up to your partner and press <b>E</b> to give credits or gear, or to offer a trade. The <b>Lockup</b> at the safehouse is a shared shelf for spare gear, and it survives an operative\u2019s death. On a raid you vote on doors (a split vote goes to a coin), agree on when to leave, and each choose your own loot and contraband. At 0 HP you go <b>down</b>: your partner has 3 rounds to spend a turn getting you up, and 2 the next time. A third time in one raid is fatal. If you bleed out, you die and the raid ends for both. If your partner falls while you\u2019re down, you die and they get out.</p></section>
      <section><h3>Wanted and escaping</h3><p>Every raid an operative survives raises their <b>Wanted</b> level: enemies get 2.5% tougher per level, and pay 2.5% more. Lower it by lying low at the safehouse. Extracting right after a boss keeps the whole haul; slipping out between bosses costs 45% of it in bribes, and escaping mid-fight with <b>Run</b> or <b>Smoke</b> costs 65%. Past sector 5 the Directorate tightens its grip: bribes rise to 50% and 70%, enemies get tougher and every price goes up 12%; past sector 10 it is 55%, 75% and 15%.</p></section>
      <section><h3>Getting stronger</h3><p><b>This operative</b>: levels (attribute points), gear, implants and contraband. All lost on death. <b>The cell</b>: Resolve buys permanent training and upgrades. Earn it from sectors (repeat clears pay only every other time), bosses, brave choices and contracts.</p></section>
      <section><h3>The yard</h3><p>Walk with the arrows or WASD, or tap where to go. Walk into a door to go inside; talk to the person there (<b>E</b>, Space or a tap) to open their menu. The freight terminal opens straight away. Most things in the yard can be poked at, and the noodle vendor sells a hot meal worth +5% XP for the next raid.</p></section>
      <section><h3>Controls</h3><p class="keys"><span><b>A</b> shoot</span><span><b>F</b> strike</span><span><b>D</b> defend</span><span><b>S</b> stim</span><span><b>R</b> run</span><span><b>Q W E T</b> skills</span><span><b>2 3 4</b> items</span><span><b>1 2</b> doors</span><span><b>Enter</b> continue</span><span><b>Esc</b> close any menu</span></p></section>
    </div>` : `
    <h2>Settings</h2>
    <div class="settings">
      <label class="set-row"><span>Sound effects</span><button class="btn" data-a="setpref" data-v="sfx" aria-pressed="${p.sfx}">${p.sfx ? 'On' : 'Off'}</button></label>
      <label class="set-row"><span>Music</span><button class="btn" data-a="setpref" data-v="music" aria-pressed="${p.music}">${p.music ? 'On' : 'Off'}</button></label>
      <label class="set-row" for="mvol"><span>Music volume</span><input id="mvol" type="range" min="0" max="1" step="0.05" value="${p.musicVolume}"></label>
      <label class="set-row"><span>Ambience (low drone)</span><button class="btn" data-a="setpref" data-v="ambience" aria-pressed="${p.ambience}">${p.ambience ? 'On' : 'Off'}</button></label>
      <label class="set-row"><span>Rain</span><button class="btn" data-a="setpref" data-v="rain" aria-pressed="${p.rain}">${p.rain ? 'On' : 'Off'}</button></label>
      <label class="set-row" for="vol"><span>Volume</span><input id="vol" type="range" min="0" max="1" step="0.05" value="${p.volume}"></label>
      <p class="muted" style="font-size:.88rem">Battle mode (Manual, Auto 1\u00D7 or Auto 2\u00D7) is in the corner of the battle scene. Auto fights for you with a fixed routine until the fight ends.</p>
      <h3>Co-op <span class="num muted" style="font-size:.85rem">play with a friend</span></h3>
      ${net ? `<div class="set-row"><span>${isHost() ? 'Hosting' : 'Joined'} room <b class="num">${net.code}</b> \u00B7 ${net.peer ? `connected to ${esc(net.peerName || (isHost() ? 'your friend' : 'the host'))}` : coopStatus === 'error' || coopStatus === 'closed' ? 'connection failed' : 'waiting for the other player\u2026'}</span><button class="btn" data-a="coopleave">Leave</button></div>
        ${isHost() ? `<div class="set-row"><span>Invite link <span class="muted">(your friend just opens it)</span></span><span class="btnrow" style="flex:1;justify-content:flex-end"><input class="text" readonly value="${esc(inviteLink())}" aria-label="Invite link" style="flex:1;min-width:140px"><button class="btn primary" data-a="coopinvite">Copy</button></span></div>` : ''}
        ${isHost() ? '<p class="muted" style="font-size:.88rem">Give your friend the room code. You pick the missions; they press Ready at their terminal. In fights you take turns, then the enemy acts. If one of you goes down, the other has a few rounds to get them up; if an operative dies, the raid is over for both.</p>' : '<p class="muted" style="font-size:.88rem">The host\u2019s save holds your operative while you play together. Leaving returns you to your own solo save.</p>'}`
      : `<div class="coop-form">
        <label class="set-row" for="coop-name"><span>Your name</span><input id="coop-name" class="text" maxlength="16" value="${esc(getCoopPrefs().name || (state.char ? state.char.name.split(' ')[0] : ''))}"></label>
        ${location.hostname.endsWith('.workers.dev') ? '' : `<label class="set-row" for="coop-relay"><span>Relay URL <span class="muted">(from the Cloudflare Worker; leave empty to test in two tabs of this browser)</span></span><input id="coop-relay" class="text" placeholder="https://cinder-cell-coop.yourname.workers.dev" value="${esc(getCoopPrefs().relay)}"></label>`}
        <div class="set-row"><span>Host a game${state.char ? '' : ' (build an operative first)'}</span><button class="btn primary" data-a="coophost" ${state.char ? '' : 'disabled'}>Host</button></div>
        <label class="set-row" for="coop-code"><span>Join with a code</span><span class="btnrow"><input id="coop-code" class="text" maxlength="8" placeholder="CODE" style="width:7ch;text-transform:uppercase"><button class="btn" data-a="coopjoin">Join</button></span></label>
      </div>`}
      <h3>Save <span class="num muted" style="font-size:.85rem">move your cell between devices</span></h3>
      <div class="set-row"><span>Copy a save code (also shown below) and paste it on the other device</span><button class="btn" data-a="savecode">Copy save code</button></div>

      <div class="set-row"><span>Run report: everything that happened, as text to paste into a chat for feedback (copied to the clipboard and shown below)</span><button class="btn" data-a="report">Copy run report</button></div>

    </div>`;
  return `<div class="modal-wrap" data-a="closemodal"><div class="modal" role="dialog" aria-modal="true" aria-label="${modal === 'manual' ? 'Field manual' : 'Settings'}">
    <button class="tool close" data-a="closemodal" aria-label="Close">Close</button>${body}</div></div>`;
}

// Feats: progress bars for every achievement and the buffs they add up to.
function featBar(p) {
  return `<div class="feat-bar" role="progressbar" aria-valuenow="${Math.round(p.pct * 100)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${Math.round(p.pct * 100)}%"></i></div>`;
}
function featsView() {
  const F = state.meta.feats || { counters: {}, tiers: {} }, fb = E.featBuffs(state.meta);
  const totals = Object.entries(fb).filter(([k, v]) => k !== 'vs' && v > 0).map(([k, v]) => `<span class="chip good">+${(v * 100).toFixed(1).replace(/\.0$/, '')}% ${esc(E.BUFF_NAMES[k])}</span>`);
  const vs = Object.entries(fb.vs).filter(([, v]) => v > 0).length;
  if (vs) totals.push(`<span class="chip good">bonus damage vs ${vs} enemy type${vs > 1 ? 's' : ''}</span>`);
  const groups = {};
  for (const def of Object.values(E.FEAT_DEFS)) (groups[def.group] = groups[def.group] || []).push(def);
  for (const g of ['Enemies', 'Bosses']) if (groups[g]) groups[g].sort((a, b) => ((F.tiers[b.id] || 0) - (F.tiers[a.id] || 0)) || ((F.counters[b.id] || 0) - (F.counters[a.id] || 0)));
  const row = (def) => {
    const c = F.counters[def.id] || 0, t = F.tiers[def.id] || 0, done = t >= def.tiers.length, next = def.tiers[Math.min(t, def.tiers.length - 1)], prev = t ? def.tiers[t - 1] : 0;
    const pct = done ? 1 : Math.min(1, (c - prev) / (next - prev));
    const nextText = done ? 'complete' : `${c.toLocaleString()} / ${next.toLocaleString()} \u00b7 next: ${esc(E.featBuffText(def, t))}${def.resolve && def.resolve[t] ? `, +${def.resolve[t]} ${esc(S.meta)}` : ''}`;
    return `<div class="feat ${t ? 'has' : ''} ${done ? 'done' : ''}"><div class="feat-head"><b>${esc(def.name)}</b><span class="pips">${def.tiers.map((_, i) => `<i class="${i < t ? 'on' : ''}"></i>`).join('')}</span></div>
      <div class="muted small">${esc(def.desc)} ${t ? `<span class="good">Now: +${(E.featTotal(def, t) * 100).toFixed(1).replace(/\.0$/, '')}% ${esc(def.buff === 'vs' ? 'damage' : E.BUFF_NAMES[def.buff])}.</span>` : ''}</div>
      ${featBar({ pct })}<div class="muted small num">${nextText}</div></div>`;
  };
  const order = ['Combat', 'Raids', 'The cell', 'After curfew', 'Enemies', 'Bosses'];
  return `<div class="modal-wrap" data-a="closemodal"><div class="modal board feats" role="dialog" aria-modal="true" aria-label="Feats">
    <button class="tool close" data-a="closemodal" aria-label="Close">Close</button>
    <h2>Feats <span class="num muted" style="font-size:.9rem">the cell\u2019s record</span></h2>
    <p class="muted" style="font-size:.9rem">Everything the cell does counts, across every operative. Each feat has four tiers; every tier adds a small permanent edge, and each tier adds a little less than the last. The top tiers of the big ones also pay ${esc(S.meta)}.</p>
    ${totals.length ? `<div class="chips">${totals.join('')}</div>` : '<p class="muted small">No tiers yet. Go and do something.</p>'}
    ${order.filter((g) => groups[g]).map((g) => `<h3>${esc(g)}</h3><div class="feat-grid">${groups[g].map(row).join('')}</div>`).join('')}
  </div></div>`;
}
// Top raids on this device. Bot raids from the simulator seed the board until real ones push them off.
function boardView() {
  const board = state.meta.board || [], me = state.char;
  const rows = board.map((e, i) => {
    const mine = !e.bot && me && e.name === me.name && e.number === me.number;

function orbitOdds(tier) {
  // A quick simulation of this tier with the current shuttle and a sensible pilot, for the odds line.
  const N = 120; let w = 0, j = 0;
  for (let i = 0; i < N; i++) {
    const r = E.seededRng(777 + i), c = { ...state.char, marks: [...(state.char.marks || [])], credits: 0, ejected: true };
    const t = { meta: { ...state.meta, journal: [], ship: { ...state.meta.ship, cell: [...state.meta.ship.cell] } }, char: c, run: null, screen: 'town', orbit: null };
    if (!E.orbitStart(t, tier, r)) return null;
    let n = 0;
    while (!t.orbit.over && n++ < 80) { const o = t.orbit; E.orbitAct(t, o.hull <= o.maxHull * 0.2 && o.eHull > o.eMaxHull * 0.5 ? 'jump' : (o.intent === 'volley' || o.intent === 'lock') ? 'evade' : o.intent === 'repair' ? 'overcharge' : 'fire', r); }
    if (t.orbit.over === 'won') w++; else if (t.orbit.over === 'jumped' || t.orbit.over === 'towed') j++;
  }
  return { win: Math.round(w / N * 100), jump: Math.round(j / N * 100), dead: Math.round((N - w - j) / N * 100) };
}

let busy = false;

async function fight(v, who = 0) {
  if (busy || awaitingHost || !state.run || !state.run.enemy) return;
  if (isGuest()) {
    if (!net.online || !net.peer) return;
    if (E.isCoop(state) && state.run.actor !== 1) return;
    if (!E.canUse(state, v)) return;
    if (v === 'smoke' && !state.confirmSmoke) { state.confirmSmoke = true; A.play('click'); render(); return; }
    state.confirmSmoke = false; setAwaiting(true); net.send({ t: 'fight', v }); return;
  }
  if (E.isCoop(state) && state.run.actor !== who) return;
  const can = E.withActor(state, who, () => E.canUse(state, v));
  if (!can) return;
  // Smoke ends the raid: ask for a second tap first (host only; the friend confirms on their own screen).
  if (who === 0 && v === 'smoke' && !state.confirmSmoke) { state.confirmSmoke = true; A.play('click'); render(); return; }

  state.events = [];

  const events = state.events;
  delete state.events;

  if (isHost() && net.peer) net.send({ t: 'fx', ev: events });

  try { await stage.play(events); } finally {
    busy = false;

    if (state.run && state.run.alert > alertBefore) A.play('alarm');
    if (state.screen === 'victory') { A.play(state.outcome.liberated ? 'liberate' : 'coin'); state.lastResult = { kind: 'fight', ...state.outcome }; E.continueAfterVictory(state, rng); }

}

      if (!res) { ok = false; break; }

      setTimeout(async () => { if (wheel) await wheel.spinTo(res.n); state.wheelResult = res; wheelBusy = false; sfx(res.win ? 'perk' : 'denied'); render(); }, 50);
      break;
    }
    case 'invest': { const n = Math.floor(+((document.getElementById(`inv-${v}`) || {}).value || 0)); ok = E.invest(state, v, n); break; }
    case 'withdraw': ok = E.withdraw(state, v); break;
    case 'shippart': ok = E.buyShipPart(state, v); break;
    case 'shipcell': ok = E.buyShipCell(state, v); if (ok) sfx('perk'); break;
    case 'orbitarm': orbitArm = v || null; sfx('click'); render(); return;
    case 'orbitgo': orbitArm = null; ok = E.orbitStart(state, v, rng); if (ok) sfx('door'); break;
    case 'orbitact': {
      ok = E.orbitAct(state, v, rng);
      if (ok && orbitScene) { const o = state.orbit; const ms = orbitScene.play(o.events); orbitBusy = true; save(); setTimeout(() => { orbitBusy = false; if (o.over === 'lost') { orbitScene.set(D.ORBIT_TIERS.find((x) => x.id === o.tier).ship, { me: true, enemy: false }); } render(); }, ms + 150); return; }
      break;
    }
    case 'orbitclose': ok = E.orbitClose(state); if (ok) { if (state.screen === 'death') { modal = null; sfx('death'); } else sfx('door'); } break;
    case 'sound': A.setPref('sfx', !A.getPrefs().sfx); sfx('click'); break;
    case 'setpref': A.setPref(v, !A.getPrefs()[v]); sfx('click'); break;
    case 'tip': state.meta.tips[v] = true; sfx('click'); break;
    case 'threat': state.meta.threat = +v; sfx('click'); break;
    case 'perk':
      if (v && state.char.perks.length >= E.CONTRABAND_SLOTS) { state.perkPick = state.perkPick === v ? null : v; sfx('click'); break; }
      E.choosePerk(state, v, rng, null, actingAs); state.perkPick = null; if (v) sfx('perk'); break;
    case 'perkdrop': if (E.choosePerk(state, state.perkPick, rng, v, actingAs)) { state.perkPick = null; sfx('perk'); } break;
    case 'ending': state.meta.endingSeen = true; state.screen = 'town'; break;
    case 'begin': state.screen = 'create'; if (!state.draft) state.draft = E.newDraft(state.meta, rng); break;
    case 'bg': state.draft.background = v; { for (const key of Object.keys(D.ATTRS)) while (E.draftAttr(state.draft, key) > D.ATTR_CREATE_MAX) E.draftAdjust(state.draft, key, -1); } break;
    case 'attr': E.draftAdjust(state.draft, v, +k); break;
    case 'randname': state.draft.name = D.OPERATIVE_NAMES[Math.floor(rng() * D.OPERATIVE_NAMES.length)]; break;
    case 'create': E.createChar(state, rng); state.gateMap = 'garrison'; state.popup = null; break;
    case 'tab': case 'popup': state.popup = v === 'gate' ? 'missions' : v === 'safehouse' ? 'character' : v; state.notice = null; break;
    case 'closepopup': state.popup = null; state.notice = null; state.compare = null; break;
    case 'compare': state.compare = +v; sfx('click'); break;
    case 'closecompare': state.compare = null; sfx('click'); break;
    case 'buygear': ok = E.buyGear(state, +v, k === 'stash'); state.compare = null; break;
    case 'lockupstore': ok = E.lockupStore(state, v); sfx(ok ? 'click' : 'denied'); break;
    case 'lockuptake': ok = E.lockupTake(state, +v, k); sfx(ok ? 'buy' : 'denied'); break;
    case 'lockupscrap': ok = E.lockupScrap(state, +v, k); sfx(ok ? 'click' : 'denied'); break;
    case 'givearm': giveArm = v; sfx('click'); break;
    case 'givecredits': ok = E.giveCredits(state, actingAs, +v); giveArm = null; sfx(ok ? 'buy' : 'denied'); break;
    case 'givegear': { const why = E.giveGear(state, actingAs, v); giveArm = null; if (why) state.notice = why; sfx(why ? 'denied' : 'buy'); break; }
    case 'tradeask': if (E.tradeAsk(state, actingAs)) state.popup = null; sfx('click'); break;
    case 'tradeanswer': E.tradeAnswer(state, actingAs, v === 'yes'); sfx('click'); break;
    case 'tradecancel': E.tradeCancel(state, actingAs); sfx('click'); break;
    case 'tradecredits': E.tradeCredits(state, actingAs, v === 'all' ? 'all' : +v); sfx('click'); break;
    case 'tradeslot': E.tradeSlot(state, actingAs, v); sfx('click'); break;
    case 'tradeok': E.tradeAccept(state, actingAs); sfx('click'); break;
    case 'gearslot': state.gearSlot = v; sfx('click'); break;
    case 'upgradegear': ok = E.upgradeItem(state, v); break;
    case 'reroll': ok = E.rerollBonus(state, v, +k, rng); break;
    case 'equipheirloom': ok = E.equipHeirloom(state); break;
    case 'heirloom': E.setHeirloom(state, v); sfx('click'); break;
    case 'loottake': if (E.takeLoot(state, rng, actingAs)) sfx('buy'); break;
    case 'lootsell': if (E.leaveLoot(state, rng)) sfx('click'); break;
    case 'lielow': ok = E.lieLow(state); break;
    case 'item': ok = E.buyItem(state, v); break;
    case 'upgrade': ok = E.buyUpgrade(state, v); break;
    case 'implant': ok = E.installImplant(state, v); break;
    case 'unimplant': E.removeImplant(state, v); break;
    case 'heal': ok = E.heal(state); break;
    case 'train': ok = E.train(state, v); break;
    case 'cell': ok = E.buyCell(state, v); break;
    case 'spend': ok = E.spendAttr(state, v); break;
    case 'respec': ok = E.respec(state); break;
    case 'pickmap': state.gateMap = v; break;
    case 'deploy': if (E.isCoop(state) && !state.guestReady) { ok = false; break; } state.trade = null; state.popup = null; state.lastResult = null; E.deploy(state, state.gateMap || 'garrison', +v, rng); break;
    case 'continue': E.continueAfterVictory(state, rng); break;
    case 'room': { if (E.isCoop(state) && net && net.peer) { if (!E.voteDoor(state, actingAs, +v, rng)) break; } else E.enterRoom(state, +v, rng); state.lastResult = null; } if (state.screen === 'room') { state.lastResult = { kind: 'room', ...state.roomResult }; E.continueAfterVictory(state, rng); } break;
    case 'dismissresult': state.lastResult = null; break;
    case 'roomDone': E.continueAfterVictory(state, rng); break;
    case 'event': E.resolveEvent(state, +v, rng, actingAs); break;
    case 'eventDone': state.lastResult = null; E.nextEncounter(state, rng); break;
    case 'deeper': if (E.isCoop(state) && net && net.peer && !E.voteExit(state, actingAs, 'deeper')) break; state.lastResult = null; E.pushDeeper(state, rng); break;
    case 'extract': if (E.isCoop(state) && net && net.peer && !E.voteExit(state, actingAs, 'extract')) break; E.endRun(state, 'extracted', rng); break;
    case 'recruit': E.recruit(state, rng); state.coopFallen = null; break;
    case 'report': {
      const text = E.runReport(state);
      state.report = text;
      try { navigator.clipboard.writeText(text).then(() => { toast = 'Run report copied. Paste it into the chat.'; render(); }).catch(() => {}); } catch (e) {}
      sfx('click'); break;
    }
    case 'reset':
      if (!confirmReset) { confirmReset = true; break; }
      confirmReset = false; modal = null; state = keepBoard(E.newGame(rng)); break;
  }
  if (BUY.has(a) && ok && state.notice) E.journal(state, state.notice, 'town');
  if (BUY.has(a)) sfx(ok ? 'buy' : 'denied');
  else if (['deploy', 'room', 'deeper'].includes(a)) sfx('door');
  else if (['step', 'look', 'tab', 'popup', 'closepopup', 'pickmap', 'continue', 'roomDone', 'eventDone', 'event', 'bg', 'attr', 'create', 'begin', 'recruit', 'extract'].includes(a)) sfx('click');
}

document.addEventListener('click', (ev) => {
  if (ev.target.classList && ev.target.classList.contains('modal-wrap')) { act('closemodal'); return; }
  if (ev.target.classList && ev.target.classList.contains('cmp-pop')) { act('closecompare'); return; }
  if (ev.target.classList && ev.target.classList.contains('town-pop')) { act('closepopup'); return; }
  const b = ev.target.closest('button[data-a]');
  if (!b || b.disabled) return;
  act(b.dataset.a, b.dataset.v, b.dataset.k);
});
document.addEventListener('input', (ev) => {
  if (ev.target.id === 'op-name' && state.draft) { state.draft.name = ev.target.value; save(); }
  if (ev.target.id === 'vol') A.setPref('volume', +ev.target.value);
  if (ev.target.id === 'mvol') A.setPref('musicVolume', +ev.target.value);
});
document.addEventListener('change', (ev) => { if (ev.target.id === 'vol') A.play('click'); });

document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape' && modal) { act('closemodal'); return; }
  if (ev.key === 'Escape' && state.trade && state.screen === 'town') { act('tradecancel'); return; }
  if (ev.key === 'Escape' && state.compare !== null && state.compare !== undefined && state.screen === 'town') { act('closecompare'); return; }
  if (modal === 'orbit' && state.orbit && !state.orbit.over && ['1', '2', '3', '4'].includes(ev.key)) { act('orbitact', ['fire', 'evade', 'overcharge', 'jump'][+ev.key - 1]); return; }
  if (ev.key === 'Escape' && state.popup && state.screen === 'town') { act('closepopup'); return; }
  if (ev.key === 'Escape' && state.screen === 'town' && globalThis.cinderTown && globalThis.cinderTown.interior && !globalThis.cinderTown.offer) { globalThis.cinderTown.exit(); return; }
  if (ev.key === 'Escape' && rewardView() === 'loot') { act('lootsell'); return; }
  if (ev.key === 'Escape' && rewardView() === 'perk') { act('perk', ''); return; }
  if (ev.metaKey || ev.ctrlKey || ev.altKey || busy || modal || ev.target.tagName === 'INPUT') return;
  A.unlock();
  const key = ev.key.toLowerCase();
  if (state.screen === 'combat') {
    const map = { a: 'shoot', f: 'strike', d: 'defend', r: 'run', s: 'stim', v: 'revive', 2: 'thermal', 3: 'ion', 4: 'smoke' };
    E.skillsOf(state.char).slice(0, 4).forEach((sk, i) => { map[SKILL_KEYS[i]] = sk; });
    if (map[key] && E.canUse(state, map[key]) && (!E.isCoop(state) || state.run.actor === myIdx())) { ev.preventDefault(); act('act', map[key]); }
  } else if (state.screen === 'route' && (key === '1' || key === '2') && state.run.choices[+key - 1]) {
    ev.preventDefault(); act('room', String(+key - 1));
  } else if (state.screen === 'sectorClear' && (key === '1' || key === '2')) {
    ev.preventDefault(); act(key === '1' ? 'deeper' : 'extract');
  } else if (rewardView() === 'loot' && (key === '1' || key === '2')) {
    ev.preventDefault(); act(key === '1' ? 'loottake' : 'lootsell');
  } else if (rewardView() === 'perk' && ['1', '2', '3'].includes(key) && state.run.perkOffer[+key - 1]) {
    ev.preventDefault(); act('perk', state.run.perkOffer[+key - 1]);
  } else if (key === 'enter') {
    if (state.screen === 'victory') { ev.preventDefault(); act('continue'); }
    else if (state.screen === 'room') { ev.preventDefault(); act('roomDone'); }
    else if (state.screen === 'event' && state.eventResult) { ev.preventDefault(); act('eventDone'); }
  }
});

// Composites the operative's look into town and battle sheets whenever the look, class or weapons change.
let lookKey = '';
function applyLook() {
  if (!hasLayers()) return;
  const c = state.char, p = E.isCoop(state) ? E.charAt(state, 1 - myIdx()) : null;
  const wp = (ch) => [weaponLayer(E.baseOf(ch.gear.ranged)), weaponLayer(E.baseOf(ch.gear.melee))];
  const key = JSON.stringify([c && [c.look, c.background, wp(c)], p && [p.look, p.background, wp(p)]]);
  if (key === lookKey) return;
  lookKey = key;
  const mine = c && c.look ? [c.look, c.background, ...wp(c)] : null, theirs = p && p.look ? [p.look, p.background, ...wp(p)] : null;
  town.setPlayerSheets(mine ? townSheets(mine[0], mine[1]) : null);
  town.setPartnerSheets(theirs ? townSheets(theirs[0], theirs[1]) : null);
  setLookSheets(mine ? battleSheet(...mine) : null, theirs ? battleSheet(...theirs) : null);
  stage.player = null; stage.partner = null;
}
// The leaderboard belongs to the device, not the cell: it survives New cell and Reset.
function keepBoard(fresh) { if (state && state.meta) { fresh.meta.board = state.meta.board || []; fresh.meta.boardSeeded = !!state.meta.boardSeeded; } return fresh; }
// Simulator raids fill the board until real raids push them off (board.json, built by sim-board.mjs).
function seedBoard() {
  if (state.meta.boardSeeded) return;
  fetch('board.json').then((r) => (r.ok ? r.json() : null)).then((bots) => {
    if (!bots || !state.meta || state.meta.boardSeeded) return;
    for (const e of bots) E.addToBoard(state.meta, { ...e, bot: true });
    state.meta.boardSeeded = true; save();
    if (modal === 'board') render();
  }).catch(() => {});
}
function start(data) {
  state = E.migrate((data && data.state) || load(), rng);
  delete state.events;
  if (state.screen === 'create' && !state.draft) state.draft = E.newDraft(state.meta, rng);
  titleOpen = !(data && data.state);
  // An invite link joins straight away; a reload goes back to the room this tab was in.
  const join = (new URLSearchParams(location.search).get('join') || '').trim().toUpperCase(), room = getRoom();
  if (/^[A-Z0-9]{4,8}$/.test(join)) { history.replaceState(null, '', location.pathname); titleOpen = false; startCoop('guest', join, !getCoopPrefs().relay); }
  else if (room && (room.role === 'guest' || state.char)) { titleOpen = false; startCoop(room.role, room.code, room.local); }
  else state.coop = false;
  render();
  if (!isGuest()) seedBoard();
  loadLayers().then((ok) => { if (ok) { lookKey = ''; render(); } });
  loadDowntimeArt().then((ok) => { if (ok && modal) render(); });
  // PixelLab sheets, if any have been delivered. Re-render so the stage picks them up.
  loadSheets().then((n) => { if (n && ['combat', 'victory', 'death'].includes(state.screen)) { stage.enemyRef = null; stage.player = null; render(); } });
}
window.claude?.hot?.snapshot?.(() => ({ state }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
