    if (t.from === me) return wrap(`<div class="pop-head"><h2>Trade</h2></div><p>Waiting for ${name} to answer\u2026</p><div class="btnrow"><button class="btn" data-a="tradecancel">Cancel</button></div>`);
    return wrap(`<div class="pop-head"><h2>Trade</h2></div><p><b>${name}</b> wants to trade.</p><div class="btnrow"><button class="btn primary" data-a="tradeanswer" data-v="yes">Open the trade</button><button class="btn" data-a="tradeanswer" data-v="no">Not now</button></div>`);
  }
  const mine = t.offers[me], theirs = t.offers[1 - me], why = E.tradeProblem(state, t.offers);
  const credits = [-100, -10, 10, 100].map((n) => `<button class="btn" data-a="tradecredits" data-v="${n}">${n > 0 ? '+' : '\u2212'}${Math.abs(n)}</button>`).join('');
  const slots = D.SLOT_ORDER.map((sl) => [sl, c.gear[sl]]).filter(([, it]) => it).map(([sl, it]) => { const on = mine.slots.includes(sl); return `<div class="set-row"><span><span class="label">${esc(SLOTS[sl].short)}</span> <b>${esc(E.itemName(it))}</b></span><button class="btn ${on ? 'primary' : ''}" data-a="tradeslot" data-v="${sl}" aria-pressed="${on}">${on ? 'Offered' : 'Offer'}</button></div>`; }).join('');
  const offered = theirs.slots.map((sl) => { const it = pc.gear[sl]; if (!it) return ''; const usable = E.canEquip(c, it); return `${itemCard(it)}${usable ? '' : '<p class="muted" style="font-size:.85rem">You can\u2019t use this yet: it would go to the Lockup.</p>'}`; }).join('');
  return wrap(`<div class="pop-head"><div style="display:grid;gap:2px"><span class="label">In the yard</span><h2>Trade with ${name}</h2></div><button class="tool" data-a="tradecancel" aria-label="Call off the trade">Call it off</button></div>
    <div class="loot">
      <div style="display:grid;gap:8px;align-content:start"><span class="label">You offer${mine.ok ? ' \u00B7 accepted' : ''}</span>
        <div><b class="num">${mine.credits.toLocaleString()}</b> <span class="muted">of ${c.credits.toLocaleString()} ${esc(S.cur)}</span></div>
        <div class="btnrow">${credits}<button class="btn" data-a="tradecredits" data-v="all">All</button></div>
        <div>${slots || '<p class="muted">You have nothing equipped.</p>'}</div></div>
      <div style="display:grid;gap:8px;align-content:start"><span class="label">${name} offers${theirs.ok ? ' \u00B7 accepted' : ''}</span>
        <div><b class="num">${theirs.credits.toLocaleString()}</b> <span class="muted">${esc(S.cur)}</span></div>
        ${offered || '<p class="muted">No gear yet.</p>'}</div>
    </div>
    ${why ? `<p class="notice lose">${esc(why)}</p>` : ''}
    <p class="muted" style="font-size:.88rem">What you receive goes on. Anything it replaces goes to the Lockup. Any change clears both acceptances.</p>
    <div class="btnrow"><button class="btn primary big" data-a="tradeok" ${why ? 'disabled' : ''}>${mine.ok ? 'Accepted \u00B7 waiting for them' : 'Accept this trade'}</button></div>`);
}
// Co-op, under the yard: where your partner is, whether they're ready, and something to say to them.
const EMOTES = ['Over here!', 'Ready?', 'Ready.', 'Let\u2019s go', 'Hold on', 'Nice.', 'Trade?', 'Ha!'];
function partnerWhere() {
  const m = town.partner;
  if (!m) return 'not in town yet';
  if (m.menu && POPUPS[m.menu]) return `in ${POPUPS[m.menu].label}`;
  if (m.scene && m.scene.startsWith('interior:')) { const sh = SHOPS[m.scene.slice(9)]; return sh ? `inside ${sh.name}` : 'indoors'; }
  return 'in the yard';
}
function coopBar() {
  if (!net || !net.peer) return '';
  const pc = E.charAt(state, 1 - myIdx()), name = pc ? pc.name.split(' ')[0] : (net.peerName || 'Your partner');
  const iReady = !!state.guestReady;
  const ready = isGuest()
    ? `<button class="btn ${iReady ? 'primary' : ''}" data-a="coopready" aria-pressed="${iReady}">${iReady ? 'Ready' : 'Mark ready'}</button>`
    : `<span class="chip ${iReady ? 'good' : ''}">${iReady ? 'Ready' : 'Not ready'}</span>`;
  return `<div class="coop-bar"><b>${esc(name)}</b> <span class="muted" id="coop-where">${esc(partnerWhere())}</span> ${ready}
    <span class="emotes" aria-label="Say something">${EMOTES.map((t, i) => `<button class="btn" data-a="emote" data-v="${i}">${esc(t)}</button>`).join('')}</span></div>`;
}
// Attribute points can be spent right here, no shop needed.
function townSpend() {
  const c = state.char;
  if (!c.attrPoints) return '';
  return `<div class="aa-spend town-spend"><b>${c.attrPoints} point${c.attrPoints > 1 ? 's' : ''} to spend</b>${Object.entries(D.ATTRS).map(([k, a]) => `<button class="btn" data-a="spend" data-v="${k}" title="${esc(a.desc)}" ${c.attrs[k] >= D.ATTR_MAX ? 'disabled' : ''}>${a.short} ${c.attrs[k]}\u2192${c.attrs[k] + 1}</button>`).join('')}</div>`;
}
// Side-by-side comparison of a market piece and what's equipped in its slot.
function compareView() {
  const c = state.char, it = c.market && c.market[state.compare];
  if (it === undefined || it === null) return '';
  const b = E.baseOf(it), old = c.gear[b.slot], net = E.netPrice(state, it), ok = E.canEquip(c, it);
  return `<div class="popup-wrap town-pop cmp-pop"><div class="modal popup" role="dialog" aria-modal="true" aria-label="Compare">
    <div class="pop-head"><div style="display:grid;gap:2px"><span class="label">${esc(D.SLOTS[b.slot].name)}</span><h2>Compare</h2></div><button class="tool" data-a="closecompare" aria-label="Close">Close</button></div>
    <div class="loot">
      <div style="display:grid;gap:6px;align-content:start"><span class="label">In the shop</span>${itemCard(it, { cls: 'new' })}</div>
      <div style="display:grid;gap:6px;align-content:start"><span class="label">What you\u2019re using</span>${old ? itemCard(old, { compare: false }) : '<p class="muted">Nothing in that slot.</p>'}</div>
    </div>
    <div class="btnrow"><button class="btn primary big" data-a="buygear" data-v="${state.compare}" ${!ok || c.credits < net ? 'disabled' : ''}>${ok ? `Buy \u00B7 ${cr(net)}` : `Needs ${E.reqText(b.req)}`}</button>${old && E.lockupFree(state) > 0 && ok && c.credits >= net ? `<button class="btn big" data-a="buygear" data-v="${state.compare}" data-k="stash">Buy and keep the old one</button>` : ''}<button class="btn big" data-a="closecompare">Back</button></div>
  </div></div>`;
}
function townPopup() {
  const id = state.popup, p = POPUPS[id];
  if (!p) return '';
  // The safehouse is one menu: Resolve, the operative, their record, gear and the Lockup, all on one row of tabs.
  const ct = state.charTab || 'resolve', c = state.char, safeTab = (pop, k, label) => `<button class="tab" aria-selected="${id === pop && (!k || ct === k)}" data-a="popup" data-v="${pop}" ${k ? `data-k="${k}"` : ''}>${label}</button>`;
  let body = p.body(), pair = id === 'character' || id === 'gear' || id === 'lockup' || id === 'hideout' ? `<nav class="tabs pop-tabs">${safeTab('character', 'resolve', `${esc(S.meta)} ${state.meta.resolve}${canSpendResolve() ? ' <span class="badge" title="You can spend Resolve here">+</span>' : ''}`)}${safeTab('character', 'operative', `Operative${c.attrPoints ? ` <span class="badge" title="Attribute points to spend">${c.attrPoints}</span>` : ''}`)}${safeTab('character', 'drone', `Drone${!c.drone || c.drone.damaged ? ' <span class="badge bad" title="Needs attention">!</span>' : ''}`)}${safeTab('character', 'record', 'Record')}${safeTab('gear', '', 'Gear')}${safeTab('lockup', '', 'Lockup')}${safeTab('hideout', '', 'Hideout')}</nav>` : '';
  // A menu's own tabs sit in its header when it has no other tabs there, so the list starts higher up.
  if (!pair) { const m = body.match(/^\s*(<nav class="tabs pop-tabs">[\s\S]*?<\/nav>)/); if (m) { pair = m[1]; body = body.slice(m[0].length); } }
  return `<div class="popup-wrap town-pop"><div class="modal popup wide" role="dialog" aria-modal="true" aria-label="${esc(p.label)}">
    <div class="pop-head"><div class="pop-title"><span class="label">${esc(p.where)}</span><h2>${esc(p.label)}</h2></div>${pair.replace('pop-tabs', 'pop-tabs head-tabs')}<button class="tool" data-a="closepopup" aria-label="Close">Close</button></div>
    ${notice()}${body}
  </div></div>${compareView()}`;
}

function buyBtn(a, v, k, cost, extraDisabled = false, label = '') {
  const p = E.price(state, cost);
  if (label) return `<button class="btn" disabled>${esc(label)}</button>`;
  return `<button class="btn" data-a="${a}" data-v="${v}" ${k ? `data-k="${k}"` : ''} ${state.char.credits < p || extraDisabled ? 'disabled' : ''}>${cr(p)}</button>`;
}

// ---------- gear ----------
const SLOTS = D.SLOTS;
function gearIco(it, cls = '') {
  if (!it) return `<span class="rf empty ${cls}"></span>`;
  return `<span class="rf r-${it.rarity} ${cls}">${ico(gearIconKey(it.base, E.baseOf(it)))}</span>`;
}
const signed = (v, unit = '') => `${v > 0 ? '+' : '\u2212'}${Math.abs(v)}${unit}`;
// Fixed stats of a piece: main stat, crit, speed, requirements.
function itemStatsLine(it) {
  const b = E.baseOf(it), ms = E.mainStat(it), c = state.char, out = [];
  if (ms) out.push(`<span>${ms.key === 'atk' ? 'ATK' : 'DEF'} <b>${ms.v}</b></span>`);
  if (b.type) out.push(`<span>${b.type === 'melee' ? 'melee' : b.type}</span>`);
  if (b.crit) out.push(`<span>crit <b>+${pct(b.crit)}</b></span>`);
  if (b.spd) out.push(`<span>SPD <b>${signed(b.spd)}</b></span>`);
  if (b.req) out.push(`<span class="chip ${E.meetsReq(c, b.req) ? '' : 'bad'}">needs ${E.reqText(b.req)}</span>`);
  const sk = b.slot === 'ranged' ? D.WEAPON_SKILL[b.type] : b.slot === 'melee' && !b.noSkill ? 'smash' : b.overload ? 'overload' : null;
  if (sk) out.push(`<span>skill <b>${esc(D.SKILLS[sk].name)}</b></span>`);
  return out.join('');
}
// A rough overall gain if this piece replaced what's in its slot, for marking upgrades.
function gearGain(it) {
  const c = state.char, slot = E.baseOf(it).slot, old = c.gear[slot];
  if (old === it) return 0;
  const a = E.stats(state);
  c.gear[slot] = it;
  const b = E.stats(state);
  c.gear[slot] = old;
  return (b.atk - a.atk) + (b.atkM - a.atkM) + 2 * (b.def - a.def) + (b.spd - a.spd) + (b.maxHp - a.maxHp) / 5 + 25 * ((b.crit - a.crit) + (b.critM - a.critM));
}
// What would change if this piece replaced what's in its slot.
function compareChips(it) {
  const c = state.char, slot = E.baseOf(it).slot, old = c.gear[slot];
  if (old === it) return '';
  const before = E.stats(state), skB = E.skillsOf(c);
  c.gear[slot] = it;
  const after = E.stats(state), skA = E.skillsOf(c);
  c.gear[slot] = old;
  const rows = [['atk', 'Shoot ATK'], ['atkM', 'Strike ATK'], ['def', 'DEF'], ['spd', 'SPD'], ['maxHp', 'HP'], ['crit', 'shoot crit', true], ['critM', 'strike crit', true], ['carry', 'carry']];
  const chips = rows.map(([k, l, isPct]) => {
    const d = after[k] - before[k];
    if (Math.abs(d) < (isPct ? 0.005 : 0.5)) return '';
    return `<span class="chip ${d > 0 ? 'good' : 'bad'}">${isPct ? signed(Math.round(d * 100), '%') : signed(Math.round(d))} ${l}</span>`;
  });
  for (const k of skA) if (!skB.includes(k)) chips.push(`<span class="chip good">+ ${esc(D.SKILLS[k].name)}</span>`);
  for (const k of skB) if (!skA.includes(k)) chips.push(`<span class="chip bad">\u2212 ${esc(D.SKILLS[k].name)}</span>`);
  const list = chips.join('');
  return `<div class="cmp"><span class="label" style="width:100%">vs your ${old ? esc(E.itemName(old)) : 'empty slot'}</span>${list || '<span class="chip">no stat change</span>'}</div>`;
}
function itemCard(it, { compare = true, actions = '', cls = '', flag = '' } = {}) {
  if (!it) return '';
  const b = E.baseOf(it), R = D.RARITY[it.rarity];
  const bonuses = it.bonuses.map((x) => `<li>${esc(E.bonusText(x))}</li>`).join('');
  const trait = it.trait ? `<li class="trait"><b>${esc(D.TRAITS[it.trait].name)}</b>: ${esc(D.TRAITS[it.trait].desc)}</li>` : '';
  const uq = b.unique ? `<li class="uq">${esc(b.desc)}</li>` : '';
  return `<div class="item r-${it.rarity} ${cls}">
    <div class="item-head">${gearIco(it)}<div style="display:grid;gap:2px;min-width:0"><span class="label">${esc(R.name)} \u00B7 ${esc(SLOTS[b.slot].name)}${flag ? ` <span class="chip good up-flag">${esc(flag)}</span>` : ''}</span><b>${esc(E.itemName(it))}</b></div></div>
    <div class="stats">${itemStatsLine(it)}</div>
    ${b.unique ? '' : `<p class="desc">${esc(b.desc)}</p>`}
    ${bonuses || trait || uq ? `<ul>${uq}${bonuses}${trait}</ul>` : ''}
    ${compare ? compareChips(it) : ''}
    ${actions ? `<div class="act">${actions}</div>` : ''}
  </div>`;
}

function gearTab() {
  const c = state.char, st = E.stats(state), sel = state.gearSlot && D.SLOT_ORDER.includes(state.gearSlot) ? state.gearSlot : 'ranged';
  const slotBtn = (slot) => {
    const it = c.gear[slot], ms = it && E.mainStat(it);
    return `<button class="slot ${sel === slot ? 'on' : ''} r-${it ? it.rarity : 'none'}" data-a="gearslot" data-v="${slot}" aria-pressed="${sel === slot}">${gearIco(it, 'sm')}
      <span class="label">${esc(SLOTS[slot].short)}</span><b>${it ? esc(E.itemName(it)) : 'Empty'}</b><span class="ms">${ms ? `${ms.key === 'atk' ? 'ATK' : 'DEF'} ${ms.v}` : it ? 'utility' : 'buy one at the market'}${it && it.bonuses.length ? ` \u00B7 ${it.bonuses.length} bonus${it.bonuses.length > 1 ? 'es' : ''}` : ''}</span></button>`;
  };
  const me = lookStill(c.look, c.background) || sheetStill('player') || portraitURL('player');
  const it = c.gear[sel];
  let actions = '';
  if (it) {
    if (E.canUpgrade(it, E.opThreat(state.char))) {
      const cost = E.price(state, E.upgradeCost(it)), ms = E.mainStat(it);
      actions += `<button class="btn primary" data-a="upgradegear" data-v="${sel}" ${c.credits < cost ? 'disabled' : ''}>Upgrade to +${it.level + 1} \u00B7 ${ms.key.toUpperCase()} ${ms.v} \u2192 ${ms.v + E.upgradeGain(it)} \u00B7 ${cr(cost)}</button>`;
    } else if (E.upgradeGain(it) > 0) actions += '<span class="note">Fully upgraded.</span>';
    if (E.canReroll(it)) it.bonuses.forEach((x, i) => { if (!x.fixed) actions += `<button class="btn" data-a="reroll" data-v="${sel}" data-k="${i}" ${c.credits < E.price(state, E.rerollCost(it)) ? 'disabled' : ''} title="Replace this bonus with a random different one">Reroll \u201C${esc(E.bonusText(x))}\u201D \u00B7 ${cr(E.price(state, E.rerollCost(it)))}</button>`; });

  }
  const heir = state.meta.heirloom;
  const locker = heir ? `<h3>Safehouse locker</h3><p class="muted" style="font-size:.9rem">Left behind by an earlier operative (Heirloom).</p>
    ${itemCard(heir, { actions: E.canEquip(c, heir) ? `<button class="btn primary" data-a="equipheirloom">Equip${E.heirloomWorthy(state.meta, c.gear[E.baseOf(heir).slot]) ? ' (your current piece goes in the locker)' : ''}</button>` : `<span class="note">You need ${E.reqText(E.baseOf(heir).req)} to use it.</span>` })}` : '';
  return `
    <div class="doll">
      <div class="col">${['ranged', 'melee', 'gadget'].map(slotBtn).join('')}</div>
      <div class="me">${me ? `<img src="${me}" alt="${esc(c.name)}" width="128" height="128">` : ''}<dl class="kv"><dt>Shoot</dt><dd>${st.atk} ATK \u00B7 ${pct(st.crit)} crit</dd><dt>Strike</dt><dd>${st.atkM} ATK \u00B7 ${pct(st.critM)} crit</dd><dt>DEF \u00B7 SPD</dt><dd>${st.def} \u00B7 ${st.spd}</dd><dt>HP</dt><dd>${c.hp} / ${st.maxHp}</dd></dl></div>
      <div class="col">${['head', 'chest', 'legs'].map(slotBtn).join('')}</div>
    </div>
    <span class="label">${esc(SLOTS[sel].name)} \u00B7 ${esc(SLOTS[sel].desc)}</span>
    ${it ? itemCard(it, { compare: false, actions }) : '<p class="muted">Nothing in this slot. Check the Black Market.</p>'}
    ${locker}`;
}

function marketGear() {
  const c = state.char, o = E.shopOdds(state.meta);
  // Upgrades you can use come first. Each button keeps the piece's place in the stock.
  const order = (c.market || []).map((it, i) => ({ it, i, up: E.canEquip(c, it) && gearGain(it) > 0 })).sort((a, b) => b.up - a.up || a.i - b.i);
  const cards = order.map(({ it, i, up }) => {
    const net = E.netPrice(state, it), ok = E.canEquip(c, it), short = net - c.credits;
    const btn = `<button class="btn primary" data-a="buygear" data-v="${i}" ${!ok || short > 0 ? 'disabled' : ''}>${!ok ? `Needs ${esc(E.reqText(E.baseOf(it).req))}` : short > 0 ? `${cr(short)} short` : `Buy \u00B7 ${cr(net)}`}</button>`;
    const cmp = `<button class="btn" data-a="compare" data-v="${i}" title="See this piece next to what you have in that slot">Compare</button>`;
    return itemCard(it, { actions: `${btn}${cmp}`, flag: up ? 'Upgrade' : '' });
  }).join('');
  return `<div class="odds"><span>Odds:</span>${['common', 'rare', 'elite', 'legendary'].map((k) => `<span class="rname r-${k}">${D.RARITY[k].name} ${Math.round(o[k] * 1000) / 10}%</span>`).join('')}</div>
    ${cards ? `<div class="item-grid">${cards}</div>` : '<p class="muted">Sold out. Marrow restocks after your next raid.</p>'}`;
}

function market() {
  const c = state.char, st = E.stats(state);
  const items = Object.entries(D.ITEMS).map(([id, it]) => `<div class="row i">${ico(`item:${id}`)}<div><div class="name">${esc(it.name)} <span class="num muted" style="font-size:.8rem">${c.items[id]}/${st.carry}</span></div><div class="desc">${esc(it.desc)}</div></div>
    ${buyBtn('item', id, '', E.itemCost(state, id), false, c.items[id] >= st.carry ? 'Full' : '')}</div>`).join('');
  const stimEach = E.price(state, E.itemCost(state, 'stim')), stimN = Math.min(st.carry - c.items.stim, Math.floor(c.credits / stimEach));
  const restock = c.items.stim < st.carry ? `<div class="row i restock">${ico('item:stim')}<div><div class="name">Restock Med Stims</div><div class="desc">Fill up in one tap.</div></div><button class="btn primary" data-a="restock" ${stimN ? '' : 'disabled'}>${stimN ? `Buy ${stimN} \u00B7 ${cr(stimN * stimEach)}` : 'Can\u2019t afford'}</button></div>` : '';
  const ups = D.UPGRADES.map((u) => {
    const owned = c.upgrades.includes(u.id);
    const modIco = ico(`upgrade:${u.id}`);
    return `<div class="row ${modIco ? 'i' : ''} ${owned ? 'owned' : ''}">${modIco}<div><div class="name">${esc(u.name)}</div><div class="desc">${esc(u.desc)}</div></div>${owned ? '<span></span>' : buyBtn('upgrade', u.id, '', E.modCost(c, u))}</div>`;
  }).join('');
  const disc = 1 - E.price(state, 100) / 100;
  const tab = state.marketTab || 'gear', tabBtn = (k, label) => `<button class="tab" aria-selected="${tab === k}" data-a="markettab" data-v="${k}">${label}</button>`;
  return `<nav class="tabs pop-tabs">${tabBtn('gear', 'Gear')}${tabBtn('supplies', 'Supplies')}${tabBtn('mods', `Mods ${c.upgrades.length}/${D.UPGRADES.length}`)}</nav>
    ${tab === 'gear' ? `<p class="muted pop-intro">New gear replaces the old for good. Restocks after every raid.${disc > 0 ? ` Charisma: ${pct(disc)} off.` : ''}</p>${marketGear()}` : ''}
    ${tab === 'supplies' ? `<div class="rows">${restock}${items}</div>` : ''}
    ${tab === 'mods' ? `<p class="muted">Each one you buy raises the price of the rest.</p><div class="rows">${ups}</div>` : ''}`;
}

function clinic() {
  const c = state.char, st = E.stats(state), cost = E.healCost(state);
  const imps = D.IMPLANTS.map((u) => {
    const owned = c.implants.includes(u.id);
    return `<div class="row i ${owned ? 'owned' : ''}">${ico(`implant:${u.id}`)}<div><div class="name">${esc(u.name)}</div><div class="desc">${esc(u.desc)}</div></div>
      ${owned ? `<button class="btn" data-a="unimplant" data-v="${u.id}">Remove</button>` : buyBtn('implant', u.id, '', E.implantCost(c, u), c.implants.length >= st.slots)}</div>`;
  }).join('');
  return `<p class="muted pop-intro">Doc Ilse works out of a laundry back room. Stitches, and for the right price, hardware under the skin.</p>
    <div class="clinic-treat"><h3>Treatment</h3>
    <div class="kv"><dt>Condition</dt><dd>${c.hp} / ${st.maxHp} HP</dd><dt>Cost</dt><dd>${cost > 0 ? cr(cost) : 'Not needed'}</dd></div>
    <div><button class="btn primary" data-a="heal" ${cost <= 0 || c.credits < cost ? 'disabled' : ''}>${cost > 0 ? `Patch me up \u00B7 ${cr(cost)}` : 'Fully healed'}</button></div></div>
    <h3>Implants <span class="num muted" style="font-size:.9rem">${c.implants.length} / ${st.slots} slots</span></h3>${c.implants.length ? `<p class="muted" style="font-size:.86rem">Your next implant costs ${Math.round(E.IMPLANT_STEP[Math.min(E.IMPLANT_STEP.length - 1, c.implants.length)] * 100)}% of the list price.</p>` : ''}
    <p class="muted" style="font-size:.9rem">More slots at INT 4 and 8. Removing one refunds nothing.</p>
    <div class="rows">${imps}</div>`;
}

// Cheapest thing Resolve can buy right now (training rank or cell upgrade), for the tab badge.

        <p class="muted" style="font-size:.9rem">${esc(bg.perk)}</p>

        <span class="label">Contraband \u00B7 ${c.perks.reduce((t, id) => t + E.perkStacks(c, id), 0)} carried \u00B7 up to ${E.perkCap(c)} of each</span>${E.perkCap(c) < E.PERK_CAP_MAX ? `<div class="set-row"><span class="muted small">Marrow can hide more on you: carry ${E.perkCap(c) + 1} of each.</span>${(() => { const way = E.capRaiseWay(state); return way && way.owe ? `<button class="btn" data-a="perkcap" data-v="borrow" title="Pay what you have and owe the rest. Everything you earn pays it off first.">Borrow ${cr(way.owe)}</button>` : `<button class="btn" data-a="perkcap" ${way ? '' : 'disabled'}>${cr(E.perkCapCost(state))}</button>`; })()}</div>${E.debtOf(c) ? `<p class="muted small">You owe Marrow ${cr(E.debtOf(c))}. Everything you earn pays this first, and he won\u2019t lend again until it\u2019s paid.</p>` : ''}` : ''}${c.perks.length ? `<div class="perk-list">${c.perks.map((id) => { const pk = { ...E.perkById(id), name: E.perkName(id, E.perkStacks(c, id)), desc: E.perkText(id, E.perkStacks(c, id)) }; return `<div class="perk-mini ${pk.rare ? 'rare' : ''}">${ico(`perk:${id}`, 'sm2')}<div><b>${esc(pk.name)}</b><span>${esc(pk.desc)}</span></div></div>`; }).join('')}</div>` : '<p class="muted">None yet. Bosses always carry it; other enemies sometimes do.</p>'}

function gate() {

  const sel = E.mapById(state.gateMap || 'garrison'), tab = state.missionTab || 'deploy';
  const open = D.MAPS.filter((mp) => E.mapUnlocked(state, mp)), locked = D.MAPS.filter((mp) => !E.mapUnlocked(state, mp));

    return `<button class="map-card ${mp.id === sel.id ? 'on' : ''} theme-${mp.theme}" data-a="pickmap" data-v="${mp.id}" aria-pressed="${mp.id === sel.id}"><b>${esc(mp.name)}</b><span class="label">${lib ? '<span class="lib">Liberated</span>' : `Cleared: ${best} / ${E.MAX_SECTOR}`}</span></button>`;
  }).join('');
  const traits = [sel.credits !== 1 ? `${sel.credits > 1 ? '+' : ''}${pct(sel.credits - 1)} credits` : null, sel.offset ? `starts as hard as Garrison sector ${sel.offset + 1}` : null].filter(Boolean);

  const stimEach = E.price(state, E.itemCost(state, 'stim')), stimN = Math.min(st.carry, Math.floor(c.credits / stimEach));
  const droneRow = !c.drone ? `<div class="gate-heal"><div class="gate-heal-text"><b>No drone yet</b><span>Every operative gets one, free.</span></div><button class="btn" data-a="popup" data-v="character" data-k="drone">Choose</button></div>`
    : c.drone.damaged ? `<div class="gate-heal"><div class="gate-heal-text"><b>${esc(D.DRONES[c.drone.type].name)} is offline</b><span>It won\u2019t help until it\u2019s repaired.</span></div><button class="btn" data-a="dronerepair" ${c.credits < E.droneRepairCost(state) ? 'disabled' : ''}>Repair \u00B7 ${cr(E.droneRepairCost(state))}</button></div>` : '';
  const noStim = c.items.stim ? '' : `<div class="gate-heal"><div class="gate-heal-text"><b>No stims packed</b><span>${stimN ? 'They heal you mid-fight, and stop bleeding.' : `A stim costs ${cr(stimEach)} and you have ${cr(c.credits)}.`}</span></div><button class="btn" data-a="restock" ${stimN ? '' : 'disabled'}>Restock${stimN ? ` ${stimN} \u00B7 ${cr(stimN * stimEach)}` : ''}</button></div>`;
  const warn = droneRow + noStim + (hurt ? `<div class="gate-heal ${c.hp < st.maxHp * 0.5 ? 'bad' : ''}"><div class="gate-heal-text"><b>You\u2019re hurt: ${c.hp} / ${st.maxHp} HP</b>${bar(c.hp, st.maxHp)}<span>${canHeal ? 'Patch up before you go in.' : `Doc wants ${cr(hc)} and you have ${cr(c.credits)}. Going in like this is a risk.`}</span></div><button class="btn primary" data-a="heal" ${canHeal ? '' : 'disabled'}>Patch up \u00B7 ${cr(hc)}</button></div>` : '');
  const mt = E.maxThreat(state);

  const contracts = (m.contracts || []).map((k) => `<div class="contract ${k.done ? 'done' : ''}"><div><b>${esc(k.text)}</b><span class="muted"> ${k.done ? 'Complete' : `${Math.min(k.progress, k.n)} / ${k.n}`}</span></div><span class="chip ${k.done ? 'good' : ''}">+${k.resolve} ${esc(S.meta)} \u00B7 +${k.credits} ${S.cur}</span></div>`).join('');

  const go = isGuest() ? `<div class="deploy-go">${prep}${warn}<span class="muted">The host picks the target.</span><button class="btn big ${state.guestReady ? 'primary' : ''}" data-a="coopready" aria-pressed="${!!state.guestReady}">${state.guestReady ? 'Ready \u00B7 waiting for the host' : 'Ready for the raid'}</button></div>`

      <div class="gate-maps"><div class="maps">${cards}</div>${locked.length ? `<p class="muted maps-locked">Locked: ${locked.map((mp) => `${esc(mp.name)} (${mp.power ? 'free the other four' : `clear ${Object.entries(mp.unlock).map(([id, n]) => `${esc(E.mapById(id).name)} ${n}`).join(', ')}`})`).join(', ')}</p>` : ''}</div>

function intentLabel(e, k) { if (k.startsWith('sig:')) return BOSS_MOVES[e.id][k.slice(4)].name; return k === 'special' ? D.SPECIALS[e.id].name : D.INTENTS[k] ? D.INTENTS[k].label : k; }
function intentInfo(e) {
  if (e.stun > 0) return { label: `Stunned \u00B7 ${e.stun} turn${e.stun > 1 ? 's' : ''}`, tone: 'calm', tip: 'It can\u2019t act. Free hits.' };
  if (e.boss && E.intentHidden(state)) return { label: 'Lights out', tone: 'danger', tip: 'You can\u2019t read her. Strike can\u2019t miss; shots miss 25% of the time.' };
  if (e.intent === 'sig') { const si = E.sigInfo(state); if (si && e.sig && e.sig.id === 'confiscate') { const c = state.char, it = c.items.stim > 0 ? 'stim' : ['thermal', 'ion', 'smoke'].find((k) => c.items[k] > 0); return { ...si, tip: it ? `Takes your ${D.ITEMS[it].name} (you have ${c.items[it]}). Strike stops him; using it now just means he takes the next one.` : 'Nothing left to take: he hits you instead.' }; } return si || { label: 'Thrown off', tone: 'calm', tip: 'You stopped the move. Its turn is wasted.' }; }
  if (e.intent === 'special') { const sp = D.SPECIALS[e.id]; return { label: sp.name, tone: 'danger', tip: sp.tip }; }
  return D.INTENTS[e.intent];
}

const ITEM_BRIEF = { thermal: 'Thermal', ion: 'Ion', smoke: 'Smoke' };
function combatScreen() {
  const r = state.run, e = r.enemy, c = state.char, st = E.stats(state);
  const intent = intentInfo(e);
  const sr = E.attackRange(state, false), mr = E.attackRange(state, true);
  const inc = E.incomingRange(state);
  const incChip = inc ? `<span class="chip ${inc.lethal ? 'lethal' : 'bad'}" title="If it connects. Defend to take ${inc.defMin}-${inc.defMax}.${inc.phaseMax ? ` If your hit takes it under half health it hits harder first: up to ${inc.phaseMax}.` : ''}">${inc.lethal ? 'Lethal ' : 'Hits '}${inc.min}-${inc.phaseMax || inc.max}${inc.phaseMax ? '!' : ''}</span>` : '';
  const coop = E.isCoop(state), mine = !coop || r.actor === myIdx();
  const party = coop ? `<div class="party">${[0, 1].map((i) => { const pc = E.charAt(state, i); if (!pc) return ''; const pst = E.statsOf(state.meta, pc); return `<div class="pm ${r.actor === i ? 'turn' : ''} ${i === myIdx() ? 'me' : ''}"><span class="label">${i === myIdx() ? 'You' : esc(pc.name)}${r.actor === i ? ' \u00B7 acting' : ''}${pc.downed ? ` \u00B7 <span class="danger-text">down, ${pc.downed} round${pc.downed > 1 ? 's' : ''} left</span>` : ''}</span><b>${Math.max(0, pc.hp)} / ${pst.maxHp} <span class="pm-stim" title="Stims left">${ico('item:stim', 'sm')}\u00D7${pc.items.stim}</span>${pc.medShield > 0 ? ` <span class="pm-shield" title="Field Shield">+${pc.medShield}</span>` : ''}</b>${bar(pc.hp, pst.maxHp)}</div>`; }).join('')}</div>` : '';
  const waiting = coop && !mine ? `<div class="notice ${c.downed || c.dead ? 'lose' : ''}">${c.dead ? `You\u2019re dead. ${esc(E.charAt(state, 1 - myIdx()).name)} is trying to get out alive.` : c.downed ? `You\u2019re down, bleeding out: ${c.downed} round${c.downed > 1 ? 's' : ''} left. ${esc(E.charAt(state, 1 - myIdx()).name)} can get you up.` : `Waiting for ${esc(E.charAt(state, 1 - myIdx()).name)} to act\u2026`}</div>` : '';
  const downedMate = coop && mine ? E.partnerDown(state) : null;
  const reviveBtn = downedMate ? `<button class="btn primary big" data-a="act" data-v="revive" style="width:100%">Get ${esc(downedMate.name.split(' ')[0])} up \u00B7 ${downedMate.downed} round${downedMate.downed > 1 ? 's' : ''} left<span class="k" aria-hidden="true">V</span></button>` : '';
  const confirmSmoke = state.confirmSmoke && c.items.smoke;
  const items = ['thermal', 'ion', 'smoke'].map((id, i) => !c.items[id] ? '' : `<button class="btn twoline ${id === 'smoke' && confirmSmoke ? 'confirm' : ''}" data-a="act" data-v="${id}" title="${esc(D.ITEMS[id].desc)}" ${c.items[id] ? '' : 'disabled'}>
      <span class="bt">${ico(`item:${id}`, 'sm')}<span class="it-full">${esc(D.ITEMS[id].name)}</span><span class="it-brief">${ITEM_BRIEF[id]}</span> <span class="num">\u00D7${c.items[id]}</span><span class="k" aria-hidden="true">${i + 2}</span></span>
      <span class="bs">${id === 'smoke' && confirmSmoke ? 'Tap again to try to escape' : esc(D.ITEMS[id].short)}</span></button>`).join('');
  const skills = E.skillsOf(c).slice(0, 4).map((k, i) => {
    const cd = r.cooldowns[k] || 0, sk = D.SKILLS[k];
    const status = k === 'rally' && r.rally > 0 ? `active, ${r.rally} round${r.rally > 1 ? 's' : ''}` : k === 'pickcard' && !cd ? `next: ${r.suit || 'hearts'} (${{ hearts: 'stun', spades: 'bleed', diamonds: 'steal' }[r.suit || 'hearts']})` : k === 'intimidate' ? (cd ? 'used this sector' : e.boss && e.tags.includes('human') ? 'shakes aim' : e.tags.includes('human') ? `${pct(E.intimidateChance(state))} chance` : 'humans only') : cd ? `ready in ${cd}` : 'ready';
    const note = `<span class="sk-full">${esc(sk.short)}</span><span class="sk-brief">${k === 'intimidate' ? status : SKILL_BRIEF[k] || esc(sk.short)}</span> <span class="sk-status">${status}</span>`;
    return `<button class="btn skill ${cd ? '' : 'ready'}" data-a="act" data-v="${k}" title="${esc(sk.desc)}" ${E.canUse(state, k) && !(k === 'intimidate' && !e.tags.includes('human')) ? '' : 'disabled'}>
      <span class="sk-name">${ico(`skill:${k}`, 'sm')}${esc(sk.name)}<span class="k" aria-hidden="true">${SKILL_KEYS[i].toUpperCase()}</span></span><span class="sk-note">${note}</span></button>`;
  }).join('');
  const fx = E.bossEffects(state), traits = [['quirk', e.quirk && E.quirkById(e.quirk)], ['bad', D.MELEE_COUNTER[e.id]], ['bad', e.affix && D.AFFIXES[e.affix]]].filter((x) => x[1]);
  const scanned = st.scan && e.next && !(e.boss && E.intentHidden(state)) ? intentLabel(e, e.next) : '';
  const aimChip = r.ready ? `Aim +${E.hasPerk(c, 'steady') ? 100 : 50}%` : '', pushChip = r.momentum ? `Momentum +${Math.round(E.TUNE.momentum * 100)}%` : '';
  const medChips = [c.medShield > 0 ? `<span class="chip ph good" data-tip="Field Shield: soaks the next ${c.medShield} damage.">Shield ${c.medShield}</span>` : '', r.rally > 0 ? `<span class="chip ph good" data-tip="Adrenal Shot: everyone hits harder for ${r.rally} more round${r.rally > 1 ? 's' : ''}.">Adrenal ${r.rally}</span>` : ''];
  // A phone has one row for all of it. In order of need; what doesn't fit drops whole, and a tap on the row gives the full list.
  const ventNow = E.mapById(r.map).mechanic.id === 'vents' && r.vent === 1 && e.stun === 0 ? { me: Math.round(st.maxHp * 0.08), them: Math.round(e.maxHp * (e.boss ? 0.04 : e.tags.includes('droid') ? 0.06 : 0.12)) } : null;
  const dot = E.dotDamage(state), pstChips = Object.entries(r.pst || {}).filter(([k, t]) => t > 0 && D.STATUSES[k]).map(([k, t]) => `<span class="chip ph bad" data-tip="${esc(`${D.STATUSES[k].name}, ${t} turn${t > 1 ? 's' : ''} left: ${D.STATUSES[k].desc}${k === 'bleed' || k === 'burn' ? ' A stim or a rest stops it.' : ''}`)}">${esc(D.STATUSES[k].short)} ${t}</span>`);
  const last = lastTurnChip();
  const phoneChips = [last, ...pstChips, (inc ? incChip.replace('class="chip', 'class="chip ph').replace(/(Hits|Lethal) ([0-9-]+)/, (m) => (dot ? `${m} +${dot} ${r.pst.bleed > 0 ? 'bleed' : 'burn'}` : m)) : ''),
    ...fx.map((x) => `<span class="chip ph bad" data-tip="${esc(x.tip)}">${esc(x.label)}</span>`),
    scanned ? `<span class="chip ph" data-tip="Scanner: the move after this one.">Then ${esc(scanned)}</span>` : '',
    mechanicBrief(r),
    aimChip ? `<span class="chip ph good">${aimChip}</span>` : '', pushChip ? `<span class="chip ph good">${pushChip}</span>` : '', ...medChips,
    ...traits.map(([cls, t]) => `<span class="chip ph ${cls}" data-tip="${esc(`${t.name}: ${t.desc}`)}">${esc(t.name)}</span>`)].join('');
  const rowTip = [`${e.name}.`, `ATK ${e.atk}, DEF ${e.def}, SPD ${e.spd}.`, `Your dodge ${pct(E.dodgeChance(st, e))}, run ${pct(E.runChance(state))}.`, ...traits.map(([, t]) => `${t.name}: ${t.desc}`), c.drone ? `${D.DRONES[c.drone.type].name} ${c.drone.damaged ? 'offline' : `rank ${c.drone.rank}`}.` : ''].join(' ');
  const intentTip = [`${intent.label}: ${intent.tip}`, scanned ? `Scanner: then ${scanned}.` : '', ...fx.map((x) => x.tip)].join(' ');
  const meta = [phoneChips, ...e.tags.filter((t) => t !== 'boss').map((t) => `<span class="tag ${t}">${t}</span>`),
    `<span class="s-atk">ATK <b>${e.atk}</b></span>`, `<span class="s-def">DEF <b>${e.def}</b></span>`, `<span class="s-spd">SPD <b>${e.spd}</b></span>`,
    `<span class="s-dodge">Dodge <b>${pct(E.dodgeChance(st, e))}</b></span>`, `<span class="s-run">Run <b>${pct(E.runChance(state))}</b></span>`,
    c.drone ? `<span class="s-drone ${c.drone.damaged ? 'danger-text' : ''}" title="${esc(`${D.DRONES[c.drone.type].name}, rank ${c.drone.rank}. ${c.drone.damaged ? 'Offline until repaired in town.' : D.DRONES[c.drone.type].effect(E.droneValue(c.drone))}`)}">${esc(D.DRONES[c.drone.type].name)} <b>${c.drone.damaged ? 'off' : `R${c.drone.rank}`}</b></span>` : ''].join('');
  return `<div class="columns fight"><section class="panel combat"><div class="c-left">
    <div class="combat-head"><span class="label">${esc(E.mapById(r.map).name)} \u00B7 Sector ${r.sector} \u00B7 ${esc(E.sectorName(r.sector, r.map))}</span>${stage.auto ? '<span class="auto-note">Auto battle \u00B7 change the mode to take over</span>' : ''}${roomPips(r)}</div>
    <div class="stage-box"><div id="stage-slot"></div>${coachView(e, mine)}</div>
    <div class="intent ${intent.tone} ${e.intent === 'sig' ? 'sigi' : ''} ${fx.length ? 'fx' : ''}" data-tip="${esc(intentTip)}"><span class="dot"></span><b>${esc(intent.label)}</b><span class="tip">${esc(intent.tip)}${st.scan && e.next && !(e.boss && E.intentHidden(state)) ? ` <span class="next-intent">Scanner: then ${esc(intentLabel(e, e.next))}</span>` : ''}</span><span class="intent-side">${incChip}${medChips.map((x) => x.replace('chip ph good', 'chip good')).join('')}${fx.map((x) => `<span class="chip bad" data-tip="${esc(x.tip)}" title="${esc(x.tip)}">${esc(x.label)}</span>`).join('')}${mechanicChip(r)}${r.ready ? `<span class="chip good">Aim +${E.hasPerk(c, 'steady') ? 100 : 50}%</span>` : ''}${r.momentum ? `<span class="chip good">Momentum +${Math.round(E.TUNE.momentum * 100)}%</span>` : ''}</span></div>
    <div class="statline" data-tip="${esc(rowTip)}">${meta}</div>
    ${(() => { const trait = (cls, t) => (t ? `<div class="quirk-line"><span class="chip ${cls}" data-tip="${esc(`${t.name}: ${t.desc}`)}">${esc(t.name)}</span><span>${esc(t.desc)}</span></div>` : ''); const all = trait('quirk', e.quirk && E.quirkById(e.quirk)) + trait('bad', D.MELEE_COUNTER[e.id]) + trait('bad', e.affix && D.AFFIXES[e.affix]); return all ? `<div class="quirk-row">${all}</div>` : ''; })()}
    </div><div class="c-right">
    ${tip('combat')}
    ${stage.auto && mine ? '<button class="btn primary big take-over" data-a="takeover">Take over<span class="bs">Stop auto battle now</span></button>' : ''}
    ${party}${waiting}${reviveBtn}
    <div class="actions ${mine ? '' : 'locked'}">
      <button class="btn primary twoline atk" data-a="act" data-v="shoot" title="${esc(E.weaponOf(c).name)}: ${st.atk} ATK, ${pct(E.critChance(st, e))} crit. Steady damage; cover halves it. You keep your distance, so you take ${Math.round(E.TUNE.shootGuard * 100)}% less damage this turn."><span class="bt">Shoot<span class="k" aria-hidden="true">A</span></span><span class="wpn">${esc(E.weaponOf(c).name)}</span><span class="bs"><b class="rng">${sr[0]}\u2013${sr[1]}</b> dmg${e.intent === 'guard' && !e.stun ? ' (cover)' : ''}</span></button>
      <button class="btn twoline atk ${D.MELEE_COUNTER[e.id] ? 'warn' : ''}" data-a="act" data-v="strike" title="${esc(E.meleeOf(c).name)}: ${st.atkM} ATK, ${pct(E.critChance(st, e, true))} crit. Hits harder than a shot but swingy, ignores cover, stops a repair, and your next attack hits ${Math.round(E.TUNE.momentum * 100)}% harder."><span class="bt">Strike<span class="k" aria-hidden="true">F</span></span><span class="wpn">${esc(E.meleeOf(c).name)}</span><span class="bs"><b class="rng">${mr[0]}\u2013${mr[1]}</b> dmg${D.MELEE_COUNTER[e.id] ? ' \u00B7 hits back!' : ''}</span></button>
      <button class="btn twoline" data-a="act" data-v="defend" title="Take 40% less damage (about 60% less from a heavy strike) and steady your next shot."><span class="bt">Defend<span class="k" aria-hidden="true">D</span></span><span class="bs">${ventNow ? `Blocks the vent (\u2212${ventNow.me})${inc ? ` \u00b7 take ${inc.defMin}-${inc.phaseDefMax || inc.defMax}` : ''}` : inc ? `Take ${inc.defMin}-${inc.phaseDefMax || inc.defMax}${dot ? ` +${dot}` : ''}` : 'Takes 60%'}</span></button>
      <button class="btn twoline" data-a="act" data-v="stim" title="${esc(D.ITEMS.stim.desc)}" ${c.items.stim ? '' : 'disabled'}><span class="bt">${ico('item:stim', 'sm')}Stim <span class="num">\u00D7${c.items.stim}</span><span class="k" aria-hidden="true">S</span></span><span class="bs">${esc(D.ITEMS.stim.short)}</span></button>
      <button class="btn twoline" data-a="act" data-v="run" ${E.canUse(state, 'run') ? '' : 'disabled'} title="Getting away drops ${Math.round(E.runShare(state) * 100)}% of unsecured credits and XP. Failing gives the enemy a free turn."><span class="bt">Run<span class="k" aria-hidden="true">R</span></span><span class="bs" title="Getting away drops ${Math.round(E.runShare(state) * 100)}% of unsecured credits and XP">${E.runBlocked(state) ? esc(E.runBlocked(state)) : `${pct(E.runChance(state))}, lose ${Math.round(E.runShare(state) * 100)}%`}</span></button>
    </div>
    ${skills ? `<div class="skills ${mine ? '' : 'locked'}">${skills}</div>` : ''}
    ${items.trim() ? `<div class="items">${items}</div>` : ''}
  </div></section>${logPanel()}</div>`;
}

const ROOM_LABEL = { fight: 'Fight', elite: 'Elite fight', event: 'Event', supply: 'Supplies', rest: 'Rest', cells: 'Prisoners', cargo: 'Cargo', boss: 'Boss', bounty: 'Bounty fight', vault: 'Strongroom', medbay: 'Medic', locker: 'Gear', bench: 'Upgrade', fence: 'Contraband' };
function mechanicChip(r) {
  const m = E.mapById(r.map).mechanic;
  let v = '';
  if (m.id === 'alarm') v = `${'\u25A0'.repeat(r.alert)}${'\u25A1'.repeat(5 - r.alert)} ${r.alert}/5`;
  if (m.id === 'vents') v = r.enemy ? (r.vent === 1 ? 'blast next turn' : `blast in ${r.vent} turns`) : 'every 3 turns';
  if (m.id === 'allies') v = `${r.allies}/2 with you`;
  if (m.id === 'snipers') v = `${Math.round(E.sniperChance(r) * 100)}% per turn`;
  if (m.id === 'storm') v = r.enemy ? ((r.storm || 4) === 1 ? 'storm next turn' : `storm in ${r.storm || 4} turns`) : 'every 4 rounds';
  const hot = (m.id === 'vents' && r.enemy && r.vent === 1) || (m.id === 'storm' && r.enemy && r.storm === 1) || (m.id === 'alarm' && r.alert >= 3);
  return `<span class="mech ${hot ? 'hot' : ''}" title="${esc(m.desc)}"><b>${esc(m.name)}</b> ${v}</span>`;
}
// The same, short enough for a phone's one row. The tap gives the rest.
function mechanicBrief(r) {
  const m = E.mapById(r.map).mechanic;
  const text = { alarm: `Alarm ${r.alert}/5`, vents: r.vent === 1 ? 'Vents next' : `Vents in ${r.vent}`, allies: `Allies ${r.allies}/2`, snipers: `Snipers ${Math.round(E.sniperChance(r) * 100)}%`, storm: (r.storm || 4) === 1 ? 'Storm next' : `Storm in ${r.storm || 4}` }[m.id];
  if (!text) return '';
  const hot = (m.id === 'vents' && r.vent === 1) || (m.id === 'storm' && r.storm === 1) || (m.id === 'alarm' && r.alert >= 3);
  return `<span class="chip ph ${hot ? 'bad' : ''}" data-tip="${esc(`${m.name}: ${m.desc}`)}">${text}</span>`;
}
function bulletinBox(r) {
  const b = E.bulletinOf(r);
  if (b.id === 'quiet') return '';
  return `<div class="bulletin" data-tip="${esc(`${b.name}: ${b.desc}`)}"><span class="label">Directorate bulletin</span><b>${esc(b.name)}</b><span>${esc(b.desc)}</span></div>`;
}
function roomPips(r) {
  return `<span class="pips rooms" aria-label="room ${r.room} of ${E.FIGHTS_PER_SECTOR}">${Array.from({ length: E.FIGHTS_PER_SECTOR }, (_, i) => `<i class="${i < r.room ? 'on' : ''}"></i>`).join('')}</span>`;
}

// v5: the floor condition for this sector, under the raid's bulletin.
function condBox(r) {
  const k = E.condOf(r);
  if (!r.cond || r.cond === 'none') return '';
  return `<div class="bulletin cond" data-tip="${esc(`${k.name}: ${k.desc}`)}"><span class="label">This floor</span><b>${esc(k.name)}</b><span>${esc(k.desc)}</span></div>`;
}
function routeScreen() {
  const r = state.run, map = E.mapById(r.map), c = state.char, st = E.stats(state);
  const coopVote = E.isCoop(state) && net && net.peer, votes = (coopVote && r.votes) || {}, mate = E.charAt(state, 1 - myIdx());
  const voteChips = (i) => [votes[myIdx()] === i ? '<span class="chip good">Your vote</span>' : '', mate && votes[1 - myIdx()] === i ? `<span class="chip">${esc(mate.name.split(' ')[0])}\u2019s vote</span>` : ''].join('');
  const doors = r.choices.map((k, i) => `<button class="door door-${k}" data-a="room" data-v="${i}">${ico(`room:${k}`)}
      <span class="label">${ROOM_LABEL[k]} <span class="k" aria-hidden="true">${i + 1}</span></span>${voteChips(i) ? `<span class="chips">${voteChips(i)}</span>` : ''}
      <b>${esc(E.roomName(r.map, k))}</b><span class="desc">${esc(k === 'rest' && r.cond === 'supplies' ? D.ROOMS[k].desc.replace('30%', '40%') : D.ROOMS[k].desc)}</span></button>`).join('');
  const cds = Object.entries(r.cooldowns).filter(([, v]) => v > 0).map(([k, v]) => `${D.SKILLS[k].name} ${v >= 50 ? 'used' : `ready in ${v}`}`);
  return `<div class="columns"><section class="panel screen-route">
    <div class="raid-where" style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center"><span class="label">${esc(map.name)} \u00B7 Sector ${r.sector} \u00B7 ${esc(E.sectorName(r.sector, r.map))}</span>${roomPips(r)}</div>
    ${afterAction()}
    ${r.areaLine && r.room === 0 && r.areaLine.sector === r.sector ? `<p class="area-line">${esc(r.areaLine.text)}</p>` : ''}
    <h2>${r.choices[0] === 'boss' ? 'No way around it' : r.room === 0 ? 'Which way in?' : 'Two doors'}</h2>
    ${tip('route')}
    <div class="mech-row">${mechanicChip(r)}<span class="route-status ${c.hp < st.maxHp * 0.4 ? 'danger-text' : ''}">${c.hp} / ${st.maxHp} HP \u00B7 ${c.items.stim} stims</span><span class="route-status muted">${cds.length ? esc(cds.join(', ')) : 'Skills ready'}</span></div>
    ${bulletinBox(r) || condBox(r) ? `<div class="route-notes">${bulletinBox(r)}${condBox(r)}</div>` : ''}
    ${coopVote ? `<p class="muted" style="font-size:.9rem">Split votes go to a coin.${votes[myIdx()] === undefined && mate && votes[1 - myIdx()] !== undefined ? ` <b>${esc(mate.name.split(' ')[0])} has voted.</b>` : ''}</p>` : ''}
    <div class="doors">${doors}</div>
  </section>${logPanel()}</div>`;
}

function roomScreen() {
  const r = state.run, res = state.roomResult;
  return `<div class="columns"><section class="panel screen-mid">
    <div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center"><span class="label">${ROOM_LABEL[res.kind]} \u00B7 ${esc(E.sectorName(r.sector, r.map))}</span>${roomPips(r)}</div>
    <h2>${esc(res.name)}</h2>
    <p style="font-size:1.1rem;max-width:58ch">${esc(res.text)}</p>
    ${res.notes.length ? `<div class="chips">${res.notes.map((n) => `<span class="chip ${/alerted/.test(n) ? 'bad' : 'good'}">${esc(n)}</span>`).join('')}</div>` : ''}
    <div><button class="btn primary big" data-a="roomDone">Move on<span class="k" aria-hidden="true">\u21B5</span></button></div>
  </section>${logPanel()}</div>`;
}

function victoryScreen() {
  const o = state.outcome, c = state.char, r = state.run;
  return `<div class="columns"><section class="panel screen-mid">
    ${o.liberated ? `<div class="liberated"><span class="label">District liberated</span><b>${esc(o.liberated)}</b><span>The Directorate has lost its grip here.${state.escape ? ' Every district is free. Get home: there\u2019s a way out.' : ' Free all five at this threat level to escape the Cell.'}</span></div>` : ''}
    <div class="killer">${o.id ? portraitImg({ id: o.id, name: o.enemy, portrait: o.portrait }, 'down') : ''}<div style="display:grid;gap:4px"><span class="label">${o.fled ? 'Target fled' : 'Target down'}</span><h2>${esc(o.enemy)}</h2></div></div>
    <dl class="kv"><dt>Credits</dt><dd style="color:var(--sodium)">+${o.credits}</dd><dt>XP</dt><dd>+${o.xp}</dd>
    ${o.levelUps.length ? `<dt>Level up</dt><dd class="ok-text">Now level ${o.levelUps[o.levelUps.length - 1]} \u00B7 +${o.levelUps.length} attribute point${o.levelUps.length > 1 ? 's' : ''}</dd>` : ''}
    ${o.healed ? `<dt>Field medic</dt><dd class="ok-text">+${o.healed} HP</dd>` : ''}
    ${o.items && o.items.length ? `<dt>Scavenged</dt><dd class="ok-text">${o.items.map(esc).join(', ')}</dd>` : ''}
    ${(o.notes || []).map((n) => `<dt>Note</dt><dd>${esc(n)}</dd>`).join('')}
    ${o.loot ? `<dt>Dropped</dt><dd class="ok-text">${esc(o.loot)}</dd>` : ''}
    ${o.resolve ? `<dt>${esc(S.meta)}</dt><dd style="color:var(--sodium)">+${o.resolve}, and a deeper insertion point</dd>` : ''}</dl>
    ${c.attrPoints ? `<div class="spend-inline"><span class="label">Spend ${c.attrPoints} attribute point${c.attrPoints > 1 ? 's' : ''}</span><div class="btnrow">${Object.entries(D.ATTRS).map(([k, a]) => `<button class="btn" data-a="spend" data-v="${k}" title="${esc(a.desc)}">${a.short} ${c.attrs[k]} \u2192 ${c.attrs[k] + 1}</button>`).join('')}</div></div>` : ''}
    <div><button class="btn primary big" data-a="continue">${r && r.lootOffer ? 'Check the drop' : r && r.perkOffer ? 'Search the body' : 'Keep moving'}<span class="k" aria-hidden="true">\u21B5</span></button></div>

function afterAction() {

    chips.push(`+${o.credits} ${S.cur}`, `+${o.xp} XP`);
    if (o.healed) chips.push(`+${o.healed} HP`);
    for (const it of o.items || []) chips.push(`found ${it}`);
    for (const n of o.notes || []) chips.push(n);
    if (o.loot) chips.push(`dropped ${o.loot}`);
    if (o.resolve) chips.push(`+${o.resolve} ${S.meta}`);
    if (o.defeatLine) main += ` <span class="muted">${esc(o.defeatLine)}</span>`;

    <div class="aa"><div class="aa-main">${main} ${lvl}<span class="chips">${chips.map((t) => `<span class="chip ${/\u2212|alerted|exploded/.test(t) ? 'bad' : 'good'}">${esc(t)}</span>`).join('')}</span></div>

}

const ORBIT_TIP = { fire: 'Fire away.', volley: 'Evade now: a broadside does x1.8.', lock: 'Evade now to line up a +50% shot; the locked shot that follows can\u2019t be dodged.', repair: 'Overcharge now while it patches up.' };
function orbitOdds(tier) {
  // A quick simulation of this tier with the current shuttle and a sensible pilot, for the odds line.
  const N = 120; let w = 0, j = 0;
  for (let i = 0; i < N; i++) {
    const r = E.seededRng(777 + i), c = { ...state.char, marks: [...(state.char.marks || [])], credits: 0, ejected: true };
    const t = { meta: { ...state.meta, journal: [], ship: { ...state.meta.ship, cell: [...state.meta.ship.cell] } }, char: c, run: null, screen: 'town', orbit: null };
    if (!E.orbitStart(t, tier, r)) return null;
    let n = 0;
    while (!t.orbit.over && n++ < 80) { const o = t.orbit; E.orbitAct(t, o.hull <= o.maxHull * 0.2 && o.eHull > o.eMaxHull * 0.5 ? 'jump' : (o.intent === 'volley' || o.intent === 'lock') ? 'evade' : o.intent === 'repair' ? 'overcharge' : 'fire', r); }
    if (t.orbit.over === 'won') w++; else if (t.orbit.over === 'jumped' || t.orbit.over === 'towed') j++;
  }
  return { win: Math.round(w / N * 100), jump: Math.round(j / N * 100), dead: Math.round((N - w - j) / N * 100) };
}
