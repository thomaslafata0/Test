      confirmReset = false; modal = null; state = keepBoard(E.newGame(rng)); break;
  }
  if (BUY.has(a) && ok && state.notice) E.journal(state, state.notice, 'town');
  if (BUY.has(a)) sfx(ok ? 'buy' : 'denied');
  else if (['deploy', 'room', 'deeper'].includes(a)) sfx('door');
  else if (['step', 'look', 'tab', 'popup', 'closepopup', 'pickmap', 'continue', 'roomDone', 'eventDone', 'event', 'bg', 'attr', 'create', 'begin', 'recruit', 'extract'].includes(a)) sfx('click');
}

// Every press answers at once with a sound that suits it. The click that follows doesn't repeat it (audio.js).
document.addEventListener('pointerdown', (ev) => {
  const b = ev.target.closest && ev.target.closest('button, [data-a]');
  if (!b || b.disabled) return;
  A.press(b.classList.contains('door') ? 'pressDoor' : b.classList.contains('tab') ? 'pressTab' : b.matches('.primary, .big, .actions .btn') ? 'pressBig' : 'press');
}, true);
// The death screen: a tap anywhere on it (not the header) goes straight to the end and does nothing else.
document.addEventListener('click', (ev) => {
  if (!deathReveal.playing || !ev.target.closest || ev.target.closest('.status, .modal-wrap')) return;
  ev.stopPropagation(); ev.preventDefault(); deathEnd();
}, true);
document.addEventListener('click', (ev) => {
  if (ev.target.classList && ev.target.classList.contains('modal-wrap')) { act('closemodal'); return; }
  if (ev.target.classList && ev.target.classList.contains('cmp-pop')) { act('closecompare'); return; }
  if (ev.target.classList && ev.target.classList.contains('town-pop')) { act('closepopup'); return; }
  const b = ev.target.closest('button[data-a]');
  // No hover on a touch screen: tapping something with a tooltip shows it.
  if (!b && ev.target.closest && matchMedia('(pointer: coarse)').matches) { const h = ev.target.closest('[title]'); if (h && !busy) { toast = h.title; render(); return; } }
  if (!b || b.disabled) return;
  act(b.dataset.a, b.dataset.v, b.dataset.k);
});
document.addEventListener('input', (ev) => {
  if (ev.target.id === 'op-name' && state.draft) { state.draft.name = ev.target.value; save(); }
  if (ev.target.id === 'vol') A.setPref('volume', +ev.target.value);
  if (ev.target.id === 'mvol') A.setPref('musicVolume', +ev.target.value);
});
document.addEventListener('change', (ev) => { if (ev.target.id === 'vol') A.play('click'); });

document.addEventListener('keydown', (ev) => {
  if (sceneLocal && !modal && !(titleOpen && !isGuest())) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); sceneNext(); } else if (ev.key === 'Escape') sceneEnd(); return; }
  if (deathReveal.playing && !modal && ['Enter', ' ', 'Escape'].includes(ev.key)) { ev.preventDefault(); deathEnd(); return; }
  if (ev.key === 'Escape' && modal) { act('closemodal'); return; }
  if (ev.key === 'Escape' && state.trade && state.screen === 'town') { act('tradecancel'); return; }
  if (state.char && state.char.payout && !modal && !titleOpen) { if (ev.key === 'Enter' || ev.key === 'Escape') act('payoutclose'); return; }
  if (ev.key === 'Escape' && state.compare !== null && state.compare !== undefined && state.screen === 'town') { act('closecompare'); return; }
  if (modal === 'orbit' && state.orbit && !state.orbit.over && ['1', '2', '3', '4'].includes(ev.key)) { act('orbitact', ['fire', 'evade', 'overcharge', 'jump'][+ev.key - 1]); return; }
  if (ev.key === 'Escape' && state.popup && state.screen === 'town') { act('closepopup'); return; }
  if (ev.key === 'Escape' && state.screen === 'town' && globalThis.cinderTown && globalThis.cinderTown.interior && !globalThis.cinderTown.offer) { globalThis.cinderTown.exit(); return; }
  if (ev.key === 'Escape' && rewardView() === 'loot') { act('lootsell'); return; }
  if (ev.key === 'Escape' && rewardView() === 'perk') { act('perk', ''); return; }
  if (ev.metaKey || ev.ctrlKey || ev.altKey || busy || modal || ev.target.tagName === 'INPUT') return;
  A.unlock();
  const key = ev.key.toLowerCase();
  if (key === 'o' && !titleOpen) { ev.preventDefault(); act('modal', 'settings'); return; }
  if (key === 'tab' && state.screen === 'combat' && !titleOpen) { ev.preventDefault(); stage.cycleMode(); return; }
  const townMenu = { m: 'missions', b: 'market', c: 'character', g: 'gear' }[key];
  if (townMenu && state.screen === 'town' && state.char && !state.popup && !state.trade && !titleOpen) { ev.preventDefault(); act('popup', townMenu); return; }
  if (state.screen === 'combat') {
    const map = { a: 'shoot', f: 'strike', d: 'defend', r: 'run', s: 'stim', v: 'revive', 2: 'thermal', 3: 'ion', 4: 'smoke' };
    E.skillsOf(state.char).slice(0, 4).forEach((sk, i) => { map[SKILL_KEYS[i]] = sk; });
    if (map[key] && E.canUse(state, map[key]) && (!E.isCoop(state) || state.run.actor === myIdx())) { ev.preventDefault(); act('act', map[key]); }
  } else if (state.screen === 'route' && (key === '1' || key === '2') && state.run.choices[+key - 1]) {

  } else if (rewardView() === 'loot' && ['1', '2', '3'].includes(key)) {

  } else if (rewardView() === 'perk' && ['1', '2', '3', '4'].includes(key) && state.run.perkOffer[+key - 1]) {

});

// Composites the operative's look into town and battle sheets whenever the look, class or weapons change.
let lookKey = '';
function applyLook() {
  if (!hasLayers()) return;
  const c = state.char, p = E.isCoop(state) ? E.charAt(state, 1 - myIdx()) : null;
  const wp = (ch) => [weaponLayer(E.baseOf(ch.gear.ranged)), weaponLayer(E.baseOf(ch.gear.melee))];
  const key = JSON.stringify([c && [c.look, c.background, wp(c)], p && [p.look, p.background, wp(p)]]);
  if (key === lookKey) return;
  lookKey = key;
  const mine = c && c.look ? [c.look, c.background, ...wp(c)] : null, theirs = p && p.look ? [p.look, p.background, ...wp(p)] : null;
  town.setPlayerSheets(mine ? townSheets(mine[0], mine[1]) : null, mine ? battleSheet(...mine) : null);
  town.setPartnerSheets(theirs ? townSheets(theirs[0], theirs[1]) : null, theirs ? battleSheet(...theirs) : null);
  setLookSheets(mine ? battleSheet(...mine) : null, theirs ? battleSheet(...theirs) : null);
  stage.player = null; stage.partner = null;
}
// This device's raids and any still waiting to be sent survive New cell and Reset.
function keepBoard(fresh) { if (state && state.meta) { fresh.meta.board = state.meta.board || []; fresh.meta.boardOut = state.meta.boardOut || []; fresh.meta.boardMine = state.meta.boardMine || []; } return fresh; }
async function start(data) {
  // Whichever is newer: this browser's copy or the cloud's. Never waits long: a bad connection falls back to what's here.
  let saved = (data && data.state) || load(), pulledToast = null;
  if (CLOUD_ON && cloud.code && !(data && data.state)) {
    try {
      const o = await Promise.race([cloudPull(cloud.code), new Promise((res) => setTimeout(() => res(undefined), 2500))]);
      if (o && o.at > ((saved && saved.savedAt) || 0)) { saved = JSON.parse(o.data); cloud.rev = o.rev; cloud.at = o.at; storeCloud(); try { localStorage.setItem(SAVE_KEY, o.data); } catch (e) {} pulledToast = 'Loaded your newer save from the cloud.'; }
      else if (o) { cloud.rev = o.rev; storeCloud(); }
    } catch (e) {}
  }
  applyUi();
  state = E.migrate(saved, rng);
  delete state.events;
  lastBody = bodyOf(state);
  if (pulledToast) toast = pulledToast;
  cloudStart();
  if (state.screen === 'create' && !state.draft) state.draft = E.newDraft(state.meta, rng);
  titleOpen = !(data && data.state);
  // An invite link joins straight away; a reload goes back to the room this tab was in.
  const join = (new URLSearchParams(location.search).get('join') || '').trim().toUpperCase(), room = getRoom();
  if (/^[A-Z0-9]{4,8}$/.test(join)) { history.replaceState(null, '', location.pathname); titleOpen = false; startCoop('guest', join, !getCoopPrefs().relay); }
  else if (room && (room.role === 'guest' || state.char)) { titleOpen = false; startCoop(room.role, room.code, room.local); }
  else state.coop = false;
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist().catch(() => {}); } catch (e) {}
  render();
  if (!isGuest()) E.syncCareer(state);
  flushBoard();
  loadLayers().then((ok) => { if (ok) { lookKey = ''; render(); } });
  loadDowntimeArt().then((ok) => { if (ok && modal) render(); });
  // PixelLab sheets, if any have been delivered. Re-render so the stage picks them up.
  loadSheets().then((n) => { setOpSheets(sheetOf('op_m'), sheetOf('op_f')); for (const id of D.DRONE_ORDER) setDroneArt(id, sheetOf(`drone_${id}`)); lookKey = ''; if (n) { stage.enemyRef = null; stage.player = null; stage.partner = null; render(); } });
}
window.claude?.hot?.snapshot?.(() => ({ state }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
