}

function modalView() {
  if (!modal) return '';
  const p = A.getPrefs();
  const body = modal === 'manual' ? `
    <h2>Field manual</h2>
    <div class="manual">
      <section><h3>The goal</h3><p>Four districts are under Directorate control. Beat the boss at the end of sector 15 in each to liberate it. Operatives die; the cell remembers.</p></section>
      <section><h3>A raid</h3><p>Pick a target and an insertion point. Each sector is three rooms: you choose one of two doors each time, and at least two rooms will be fights. Every fifth sector ends in a boss. After a sector you push deeper or extract with what you\u2019re carrying.</p></section>
      <section><h3>Reading the enemy</h3><ul>
        <li><b>Taking aim</b>: a normal attack.</li>
        <li><b>Heavy strike</b>: x2.2 damage. Defend to take a quarter.</li>
        <li><b>Signature move</b>: every enemy has one, usually with a status effect. Defend halves it and blocks the status.</li>
        <li><b>Cover</b>: your attacks deal half. Heal or set up instead.</li>
        <li><b>Repair</b>: hit it hard before it heals.</li></ul></section>
      <section><h3>Shoot or Strike</h3><p><b>Shoot</b> uses your ranged weapon: steady damage, crit from Agility, and you take 15% less damage that turn because you keep your distance. <b>Strike</b> uses your melee weapon: swingier damage, adds your Strength, ignores cover and gives your next attack +15%, but some enemies hit back when you close in. Ranged skills use the ranged weapon; Power Strike uses the melee one.</p></section>
      <section><h3>Gear and loot</h3><p>Six slots: ranged, melee, helmet, chest, legs and a gadget. Pieces come in <span class="rname r-common">Common</span>, <span class="rname r-rare">Rare</span>, <span class="rname r-elite">Elite</span> and <span class="rname r-legendary">Legendary</span>, with random bonuses; bosses drop their own <span class="rname r-unique">Unique</span>. The Black Market restocks after every raid. Nobody buys old gear: a new piece replaces the old one. Upgrade pieces (+1 to +5) and reroll bonuses on the Gear tab. Death takes it all, unless the cell has the Heirloom upgrade.</p></section>
      <section><h3>Your turn</h3><p><b>Defend</b> also steadies your aim: your next shot deals +50%. <b>Skills</b> come from your weapon and high attributes; their cooldowns last for the whole sector, so choose your moment. <b>Stims</b> heal and stop bleeding and burning.</p></section>
      <section><h3>Status effects</h3><ul>${Object.values(D.STATUSES).map((x) => `<li><b>${esc(x.name)}</b>: ${esc(x.desc)}</li>`).join('')}</ul></section>
      <section><h3>Elites and bosses</h3><p>Elites (veterans) carry a modifier, such as Regenerating or Volatile. Bosses enrage at half health. Bosses always carry <b>contraband</b> and elites sometimes do: pick one of three perks that last until your operative dies. You have four pockets, so a fifth piece means dropping one.</p></section>
      <section><h3>Quirks and bulletins</h3><p>Regular enemies often have a <b>quirk</b>, like a Drunk trooper whose shots go wild or an Overclocked droid that cooks itself. Every raid also rolls a <b>Directorate bulletin</b>, such as Payday or Staff Party, that bends the rules until you leave.</p></section>
      <section><h3>Wanted and escaping</h3><p>Every raid an operative survives raises their <b>Wanted</b> level: enemies get 2.5% tougher per level, and pay 2.5% more. Lower it by lying low at the safehouse. Extracting right after a boss keeps the whole haul; slipping out between bosses costs 30% of it in bribes, and escaping mid-fight with <b>Run</b> or <b>Smoke</b> costs half.</p></section>
      <section><h3>Getting stronger</h3><p><b>This operative</b>: levels (attribute points), gear, implants and contraband. All lost on death. <b>The cell</b>: Resolve buys permanent training and upgrades. Earn it from sectors (repeat clears pay only every other time), bosses, brave choices and contracts.</p></section>
      <section><h3>The yard</h3><p>Walk with the arrows or WASD, or tap where to go. Walk into a door to go inside; talk to the person there (<b>E</b>, Space or a tap) to open their menu. The freight terminal opens straight away. Most things in the yard can be poked at, and the noodle vendor sells a hot meal worth +5% XP for the next raid.</p></section>
      <section><h3>Controls</h3><p class="keys"><span><b>A</b> shoot</span><span><b>F</b> strike</span><span><b>D</b> defend</span><span><b>S</b> stim</span><span><b>R</b> run</span><span><b>Q W E T</b> skills</span><span><b>2 3 4</b> items</span><span><b>1 2</b> doors</span><span><b>Enter</b> continue</span><span><b>Esc</b> close any menu</span></p></section>
    </div>` : `
    <h2>Settings</h2>
    <div class="settings">
      <label class="set-row"><span>Sound effects</span><button class="btn" data-a="setpref" data-v="sfx" aria-pressed="${p.sfx}">${p.sfx ? 'On' : 'Off'}</button></label>
      <label class="set-row"><span>Music</span><button class="btn" data-a="setpref" data-v="music" aria-pressed="${p.music}">${p.music ? 'On' : 'Off'}</button></label>
      <label class="set-row" for="mvol"><span>Music volume</span><input id="mvol" type="range" min="0" max="1" step="0.05" value="${p.musicVolume}"></label>
      <label class="set-row"><span>Ambience (low drone)</span><button class="btn" data-a="setpref" data-v="ambience" aria-pressed="${p.ambience}">${p.ambience ? 'On' : 'Off'}</button></label>
      <label class="set-row"><span>Rain</span><button class="btn" data-a="setpref" data-v="rain" aria-pressed="${p.rain}">${p.rain ? 'On' : 'Off'}</button></label>
      <label class="set-row" for="vol"><span>Volume</span><input id="vol" type="range" min="0" max="1" step="0.05" value="${p.volume}"></label>
      <p class="muted" style="font-size:.88rem">Battle mode (Manual, Auto 1\u00D7 or Auto 2\u00D7) is in the corner of the battle scene. Auto fights for you with a fixed routine until the fight ends.</p>
      <h3>Co-op <span class="num muted" style="font-size:.85rem">play with a friend</span></h3>
      ${net ? `<div class="set-row"><span>${isHost() ? 'Hosting' : 'Joined'} room <b class="num">${net.code}</b> \u00B7 ${net.peer ? `connected to ${esc(net.peerName || (isHost() ? 'your friend' : 'the host'))}` : coopStatus === 'error' || coopStatus === 'closed' ? 'connection failed' : 'waiting for the other player\u2026'}</span><button class="btn" data-a="coopleave">Leave</button></div>
        ${isHost() ? '<p class="muted" style="font-size:.88rem">Give your friend the room code. You pick the missions; they press Ready at their terminal. In fights you take turns, then the enemy acts. If either of you goes down, the raid is over for both.</p>' : '<p class="muted" style="font-size:.88rem">The host\u2019s save holds your operative while you play together. Leaving returns you to your own solo save.</p>'}`
      : `<div class="coop-form">
        <label class="set-row" for="coop-name"><span>Your name</span><input id="coop-name" class="text" maxlength="16" value="${esc(getCoopPrefs().name || (state.char ? state.char.name.split(' ')[0] : ''))}"></label>
        <label class="set-row" for="coop-relay"><span>Relay URL <span class="muted">(from the Cloudflare Worker; leave empty to test in two tabs of this browser)</span></span><input id="coop-relay" class="text" placeholder="https://cinder-cell-coop.yourname.workers.dev" value="${esc(getCoopPrefs().relay)}"></label>
        <div class="set-row"><span>Host a game${state.char ? '' : ' (build an operative first)'}</span><button class="btn primary" data-a="coophost" ${state.char ? '' : 'disabled'}>Host</button></div>
        <label class="set-row" for="coop-code"><span>Join with a code</span><span class="btnrow"><input id="coop-code" class="text" maxlength="8" placeholder="CODE" style="width:7ch;text-transform:uppercase"><button class="btn" data-a="coopjoin">Join</button></span></label>
      </div>`}
      <h3>Save <span class="num muted" style="font-size:.85rem">move your cell between devices</span></h3>
      <div class="set-row"><span>Copy a save code (also shown below) and paste it on the other device</span><button class="btn" data-a="savecode">Copy save code</button></div>
      <div class="set-row"><span class="btnrow" style="flex:1"><input id="load-code" class="text" placeholder="Paste a save code" style="flex:1;min-width:120px"><button class="btn" data-a="loadcode">Load</button></span></div>
      <div class="set-row"><span>Run report: everything that happened, as text to paste into a chat for feedback (copied to the clipboard and shown below)</span><button class="btn" data-a="report">Copy run report</button></div>
      ${state.report ? `<textarea class="report" readonly aria-label="Run report">${esc(state.report)}</textarea>` : ''}
      <div class="set-row"><span>Erase all progress, including Resolve and training</span><button class="btn danger" data-a="reset">${confirmReset ? 'Click again to confirm' : 'Reset save'}</button></div>
    </div>`;
  return `<div class="modal-wrap" data-a="closemodal"><div class="modal" role="dialog" aria-modal="true" aria-label="${modal === 'manual' ? 'Field manual' : 'Settings'}">
    <button class="tool close" data-a="closemodal" aria-label="Close">Close</button>${body}</div></div>`;
}

function eventScreen() {
  const ev = E.eventById(state.event), res = state.eventResult;
  const opts = ev.options.map((o, i) => {
    const avail = E.optionAvailable(state, o);
    const check = o.check ? `<span class="chip">${D.ATTRS[o.check.attr].short} ${E.attr(state.char, o.check.attr)} \u00B7 ${pct(E.checkChance(state, o.check))}</span>` : '';
    const cost = o.cost ? `<span class="chip ${avail ? '' : 'bad'}">costs ${o.cost.credits ? cr(o.cost.credits) : `${o.cost.stim} stim`}</span>` : '';
    return `<button class="btn option" data-a="event" data-v="${i}" ${avail ? '' : 'disabled'}><span>${esc(o.label)}</span><span class="chips">${check}${cost}</span></button>`;
  }).join('');
  const result = res ? `<div class="notice ${res.check ? (res.success ? 'win' : 'lose') : ''}">${res.check ? `<b>${res.success ? 'Success.' : 'Failed.'}</b> ` : ''}${esc(res.text)}</div>
    ${res.notes.length ? `<div class="chips">${res.notes.map((n) => `<span class="chip ${/\u2212|alerted/.test(n) ? 'bad' : 'good'}">${esc(n)}</span>`).join('')}</div>` : ''}` : '';
  return `<div class="columns"><section class="panel">
    <span class="label">Something in the corridor \u00B7 ${esc(E.sectorName(state.run.sector, state.run.map))}</span>
    <p style="font-size:1.15rem;max-width:58ch">${esc(ev.text)}</p>
    ${res ? `${result}<div><button class="btn primary big" data-a="eventDone">Move on<span class="k">\u21B5</span></button></div>` : `<div class="options">${opts}</div>`}
  </section>${logPanel()}</div>`;
}

function sectorClearScreen() {
  const r = state.run, o = state.outcome, c = state.char, st = E.stats(state), next = r.sector + 1;
  return popupView(`
    <span class="label">Sector ${r.sector} secured \u00B7 ${esc(E.mapById(r.map).name)}</span><h2>${esc(E.sectorName(r.sector, r.map))}</h2>
    <dl class="kv"><dt>Sector haul</dt><dd style="color:var(--sodium)">+${cr(o.credits)}</dd><dt>Carrying</dt><dd>${cr(c.credits)}</dd><dt>Condition</dt><dd class="${c.hp < st.maxHp * 0.4 ? 'danger-text' : ''}">${c.hp} / ${st.maxHp} HP \u00B7 ${c.items.stim} stims</dd><dt>${esc(S.meta)}</dt><dd style="color:var(--sodium)">${o.resolve ? `+${o.resolve} (banked)` : '<span class="muted">none this time: repeat clears pay every other time</span>'}</dd></dl>
    ${E.isBossSector(next) ? `<div class="notice" style="border-color:var(--danger);background:var(--danger-dim)">Sector ${next} is a boss sector. Something worse than troopers is waiting.</div>` : ''}
    <div class="btnrow">
      <button class="btn primary big" data-a="deeper">Push to sector ${next}<span class="k">1</span></button>
      <button class="btn big" data-a="extract">Extract with ${cr(c.credits - E.extractLoss(state))}<span class="k">2</span></button>
    </div>
    <p class="muted" style="font-size:.88rem">${E.extractLoss(state) ? `Slipping out between bosses costs bribes at the gate: ${Math.round(E.TUNE.extractLoss * 100)}% of this raid\u2019s haul (${cr(E.extractLoss(state))}). Extract right after a boss and you keep it all.` : 'You\u2019ve just taken down a boss: the gate is in chaos and you can extract with everything.'}</p>
  `);
}

function heirloomPick() {
  const c = state.char;
  if (!c || !state.meta.cell.includes('heirloom')) return '';
  const pieces = D.SLOT_ORDER.map((sl) => [sl, c.gear[sl]]).filter(([, it]) => it && E.baseOf(it).tier > 0);
  if (!pieces.length) return '';
  const h = state.meta.heirloom;
  return `<div class="spend-inline"><span class="label">Heirloom \u00B7 pick one piece for the locker</span>
    <div class="btnrow">${pieces.map(([sl, it]) => `<button class="btn ${h && h.base === it.base && h.level === it.level ? 'primary' : ''}" data-a="heirloom" data-v="${sl}"><span class="rname r-${it.rarity}">${esc(E.itemName(it))}</span></button>`).join('')}</div>
    ${h ? `<p class="muted" style="font-size:.88rem">In the locker: <span class="rname r-${h.rarity}">${esc(E.itemName(h))}</span>.</p>` : ''}</div>`;
}

function deathScreen() {
  const o = state.outcome;
  return `<section class="panel" style="padding:32px">
    <span class="label">Signal lost \u00B7 ${esc(E.mapById(o.map).name)} \u00B7 Sector ${o.sector}</span>
    <h1 class="big-title" style="color:var(--danger)">${esc(o.name)}</h1>
    ${o.killerId ? `<div class="killer">${portraitImg({ id: o.killerId, name: o.killer, portrait: o.killerPortrait })}<span class="label">Last seen<br>engaging a ${esc(o.killer)}</span></div>` : ''}
    <p class="story">Operative ${o.number} went down in the ${esc(E.sectorName(o.sector, o.map))}${o.killerId ? `, killed by a ${esc(o.killer)}` : `, taken by ${esc(o.killer)}`}. The ${o.credits.toLocaleString()} ${S.currency}, the gear, ${o.perks ? `${o.perks} piece${o.perks > 1 ? 's' : ''} of contraband, ` : ''}the implants and level ${o.level} went with them.</p>
    <dl class="kv"><dt>${esc(S.meta)} to spend</dt><dd style="color:var(--sodium)">${state.meta.resolve}</dd><dt>Deepest ever</dt><dd>Sector ${state.meta.bestSector}</dd></dl>
    ${heirloomPick()}
    <p class="muted">Spend the Resolve at the safehouse (Character & Resolve) once your next operative is in town. Training and cell upgrades carry over.</p>
    <div><button class="btn primary big" data-a="recruit">Build the next operative</button></div>
  </section>`;
}

function render() {
  const screens = { route: routeScreen, room: roomScreen, intro: introScreen, create: createScreen, town: townScreen, combat: combatScreen, victory: victoryScreen, event: eventScreen, sectorClear: sectorClearScreen, death: deathScreen, perk: perkScreen, loot: lootScreen, ending: endingScreen };
  if (isGuest()) {
    // The friend's view: their own death and creation screens, the shared raid otherwise.
    if (!state.char) state.screen = state.coopFallen && state.coopFallen.idx === 1 && !state.guestSawDeath ? 'death' : 'create';
    else if (['death', 'create', 'intro'].includes(state.screen)) state.screen = 'town';
    if (state.screen === 'death') state.outcome = state.coopFallen.record;
    if (state.screen === 'create' && !state.draft) state.draft = localDraft || (localDraft = E.newDraft(state.meta, rng));
    if (!state.run && ['combat', 'victory', 'event', 'sectorClear', 'route', 'room', 'perk', 'loot'].includes(state.screen)) state.screen = 'town';
  } else {
  // Recover from inconsistent saves instead of rendering a blank page.
  if (!state.char && !['intro', 'create'].includes(state.screen)) { state.screen = 'create'; if (!state.draft) state.draft = E.newDraft(state.meta, rng); }
  if (!state.run && ['combat', 'victory', 'event', 'sectorClear', 'route', 'room', 'perk', 'loot'].includes(state.screen)) state.screen = 'town';
  if (state.screen === 'route' && !(state.run.choices && state.run.choices.length)) E.offerRoute(state, rng);
  if (state.screen === 'room' && !state.roomResult) E.offerRoute(state, rng);
  if (state.screen === 'combat' && !state.run.enemy) E.offerRoute(state, rng);
  if (state.screen === 'perk' && !state.run.perkOffer) E.offerRoute(state, rng);
  if (state.screen === 'loot' && !state.run.lootOffer) E.continueAfterVictory(state, rng);
  if (state.screen === 'victory' && state.run) { state.lastResult = { kind: 'fight', ...state.outcome }; E.continueAfterVictory(state, rng); }
  if (state.screen === 'room' && state.run && state.roomResult) { state.lastResult = { kind: 'room', ...state.roomResult }; E.offerRoute(state, rng); }
  if (state.screen === 'event' && !E.eventById(state.event)) state.screen = 'combat';
  if (state.coopFallen && state.coopFallen.idx === 0 && state.screen !== 'death') state.coopFallen = null;
  }
  const showStatus = state.screen !== 'intro' && !titleOpen;
  if (state.contractDone) { toast = `Contract complete: ${state.contractDone}`; state.contractDone = null; A.play('perk'); }
  // Keep the page where it was: scroll positions of menus and the page, and the focused button, survive the rebuild.
  const app = document.getElementById('app');
  const kept = [...app.querySelectorAll('.modal, .log')].map((el) => ({ cls: el.className, top: el.scrollTop })).filter((k) => k.top > 0);
  const pageY = window.scrollY, fo = document.activeElement, foKey = fo && fo.dataset && fo.dataset.a ? [fo.dataset.a, fo.dataset.v || '', fo.dataset.k || ''].join('|') : null;
  const sameView = lastView === [state.screen, state.popup || '', modal || '', state.compare == null ? '' : state.compare].join('|');
  app.innerHTML = (titleOpen && !isGuest() ? titleScreen() : (showStatus ? statusStrip() : '') + screens[state.screen]()) + modalView() +
    (toast ? `<div class="toast" role="status">${esc(toast)}</div>` : '');
  toast = null;
  lastView = [state.screen, state.popup || '', modal || '', state.compare == null ? '' : state.compare].join('|');
  if (sameView) {
    app.classList.add('still');
    const seen = {};
    for (const el of app.querySelectorAll('.modal, .log')) { const k = kept.find((x) => x.cls === el.className && !seen[x.cls]); if (k) { seen[k.cls] = true; el.scrollTop = k.top; } }
    if (foKey) { const b = [...app.querySelectorAll('button[data-a]')].find((x) => [x.dataset.a, x.dataset.v || '', x.dataset.k || ''].join('|') === foKey); if (b && !b.disabled) b.focus({ preventScroll: true }); }
  } else app.classList.remove('still');
  A.setAmbience(state.run ? E.mapById(state.run.map).theme : 'town');
  A.setMusic(state.run ? 'raid' : 'town');
  const tslot = document.getElementById('town-slot');
  if (tslot) {
    tslot.replaceWith(town.el);
    if (lastScreen !== 'town') town.spawnAt(['create', 'intro', 'death'].includes(lastScreen) || !lastScreen ? 'safehouse' : lastScreen === 'ending' ? 'safehouse' : 'terminal');
    town.setBlocked(!!state.popup || !!modal);
  }
  if (state.screen !== 'town') state.popup = null;
  lastScreen = state.screen;
  const slot = document.getElementById('stage-slot');
  if (slot) {
    slot.replaceWith(stage.el);
    const r = state.run, st = E.stats(state), map = E.mapById(r.map);
    const res = stage.sync({ run: r, enemy: r.enemy, sector: r.sector, boss: r.enemy.boss, theme: map.theme, allies: r.allies,
      pst: r.pst, est: r.enemy.st, affix: r.enemy.affix ? D.AFFIXES[r.enemy.affix].name : null, quirk: r.enemy.quirk ? E.quirkById(r.enemy.quirk).name : null,
      player: { name: state.char.name, level: state.char.level, hp: state.char.hp, maxHp: st.maxHp },
      partner: E.isCoop(state) && E.charAt(state, 1 - myIdx()) ? (() => { const pc = E.charAt(state, 1 - myIdx()); return { idx: 1 - myIdx(), name: pc.name, hp: pc.hp, maxHp: E.statsOf(state.meta, pc).maxHp, acting: r.actor === 1 - myIdx() }; })() : null });
    if (res && res.isNewBoss) {
      busy = true; document.getElementById('app').classList.add('busy');
      const info = D.BOSS_INFO[r.enemy.id] || {};
      stage.bossIntro({ name: r.enemy.name, epithet: info.epithet, label: `${map.name} \u00B7 Sector ${r.sector}` }).then(() => { busy = false; document.getElementById('app').classList.remove('busy'); scheduleAuto(); });
    }
  }
  if (sameView && pageY) window.scrollTo(0, pageY);
  const log = document.getElementById('log');
  if (log) log.scrollTop = log.scrollHeight;
  save();
  if (isHost()) { broadcast(lastEvents); lastEvents = null; }
  scheduleAuto();
}

// Auto battle: when the stage is in Auto mode, play the engine's fixed routine one move at a time.
let autoTimer = null;
function scheduleAuto() {
  if (autoTimer || !stage.auto || busy || modal || !state || state.screen !== 'combat' || !state.run || !state.run.enemy) return;
  autoTimer = setTimeout(() => {
    autoTimer = null;
    if (stage.auto && !busy && !modal && state.screen === 'combat' && state.run && state.run.enemy && (!E.isCoop(state) || state.run.actor === myIdx())) fight(E.autoAction(state), isGuest() ? 1 : 0);
  }, 350);
}
document.addEventListener('automode', () => { A.play('click'); if (state.screen === 'combat') render(); });

// ---------- input ----------
const stage = new Stage();
const town = new Town();
globalThis.cinderTown = town; // handy for debugging in the console
let lastScreen = null, lastView = '';
// Walking into a building (or talking to its NPC) opens that building's menu.
town.onOpen = (id) => { if (state.screen !== 'town' || modal) return; state.popup = id; state.notice = null; A.play('click'); render(); };
// Things in the yard that touch the game: noodles, the vending terminal, doors with no inside.
town.onAction = (id) => {
  const c = state.char;
  if (!c || state.screen !== 'town') return null;
  if (id === 'noodles:can') return c.fed ? { ok: false, text: 'You\u2019ve eaten. Go on, before it gets cold out there.' } : c.credits < E.NOODLE_COST ? { ok: false, text: `Two credits. You\u2019ve got ${c.credits}. Come back when you\u2019ve robbed someone.` } : { ok: true, text: `${E.NOODLE_COST} ${S.cur}. Hot broth, +5% XP until you\u2019re next back in the yard.` };
  if (id === 'noodles') { const ok = E.buyNoodles(state); save(); render(); return { text: ok ? 'Yum. That\u2019ll keep you warm. +5% XP this raid.' : 'No sale.' }; }
  if (id === 'vending') {
    if (c.credits < 1) return { text: 'The terminal wants 1 credit. You have none. It plays a sad little tune.', sfx: 'denied' };
    c.credits -= 1; save(); render();
    return { text: ['A can of Directorate Fizz. It tastes like compliance.', 'It eats your credit and dispenses a leaflet about quotas.', 'A protein bar from before the occupation. Still fine. Probably.', 'The terminal thanks you for your loyalty and gives you nothing.'][Math.floor(rng() * 4)], sfx: 'coin' };
  }
  if (id === 'tenement_a') { if (E.tenementGift(state)) { save(); render(); return { text: 'The door opens a crack. An old woman presses a med stim into your hand. \u201CFor the floor. Don\u2019t come back.\u201D', sfx: 'heal' }; } return { text: ['Nobody answers. You hear a chair being pushed against the door.', 'A kid\u2019s voice: \u201CGran says we don\u2019t know you.\u201D', 'The slot opens, then shuts. Fair enough.'][Math.floor(rng() * 3)] }; }
  if (id === 'barracks') return { text: c.wanted >= 3 ? 'The guard at the hatch squints at you, then at a poster, then at you. You walk on before he finishes the thought.' : ['A voice from the hatch: \u201CDeliveries round the back. Everything else, go away.\u201D', 'Snoring. The Directorate\u2019s finest.', 'You knock. Something heavy falls over inside, and someone swears in three languages.'][Math.floor(rng() * 3)] };
  return null;
};
let busy = false;

async function fight(v, who = 0) {
  if (busy || !state.run || !state.run.enemy) return;
  if (isGuest()) {
    if (E.isCoop(state) && state.run.actor !== 1) return;
    if (!E.canUse(state, v)) return;
    if (v === 'smoke' && !state.confirmSmoke) { state.confirmSmoke = true; A.play('click'); render(); return; }
    state.confirmSmoke = false; net.send({ t: 'fight', v }); return;
  }
  if (E.isCoop(state) && state.run.actor !== who) return;
  const can = E.withActor(state, who, () => E.canUse(state, v));
  if (!can) return;
  // Smoke ends the raid: ask for a second tap first (host only; the friend confirms on their own screen).
  if (who === 0 && v === 'smoke' && !state.confirmSmoke) { state.confirmSmoke = true; A.play('click'); render(); return; }
  state.confirmSmoke = false;
  busy = true;
  document.getElementById('app').classList.add('busy');
  const alertBefore = state.run.alert;
  state.events = [];
  E.playerAct(state, v, rng, who);
  const events = state.events;
  delete state.events;
  lastEvents = events;
  save();
  try { await stage.play(events); } finally {
    busy = false;
    document.getElementById('app').classList.remove('busy');
    if (state.run && state.run.alert > alertBefore) A.play('alarm');
    if (state.screen === 'victory') { A.play(state.outcome.liberated ? 'liberate' : 'coin'); state.lastResult = { kind: 'fight', ...state.outcome }; E.continueAfterVictory(state, rng); }
    render();
  }
}

const BUY = new Set(['respec', 'buygear', 'upgradegear', 'reroll', 'item', 'upgrade', 'implant', 'heal', 'train', 'cell', 'spend', 'equipheirloom']);
function act(a, v, k) {
  A.unlock();
  if (a === 'closemodal') { modal = null; confirmReset = false; state.report = null; render(); return; }
  if (busy && !modal) return;
  if (a === 'act') return fight(v);
  // The friend's game actions run on the host; a few need a different message.
  if (isGuest() && !LOCAL.has(a)) {
    if (a === 'create') { net.send({ t: 'create', draft: state.draft }); localDraft = null; A.play('click'); return; }
    if (a === 'recruit') { net.send({ t: 'recruit' }); state.coopFallen = null; A.play('click'); return; }
    if (a === 'deploy' || a === 'reset' || a === 'threat') { A.play('denied'); return; }
    net.send({ t: 'act', a, v, k }); A.play('click'); return;
  }
  applyAct(a, v, k);
  render();
}
function applyAct(a, v, k) {
  state.confirmSmoke = false;
  if (a !== 'reset') confirmReset = false;
  let ok = true;
  switch (a) {
    case 'continue-title': titleOpen = false; if (state.screen === 'intro') state.screen = 'intro'; A.play('door'); break;
    case 'newcell': if (!confirmReset) { confirmReset = true; break; } confirmReset = false; state = E.newGame(rng); titleOpen = false; break;
    case 'step': state.draft.step = +v; A.play('click'); break;
    case 'look': state.draft.look = state.draft.look || defaultLook(); state.draft.look[v] = v === 'skin' || v === 'hairColor' ? +k : k; A.play('click'); break;
    case 'savecode': { const code = E.exportSave(state); state.report = code; try { navigator.clipboard.writeText(code).then(() => { toast = 'Save code copied.'; render(); }).catch(() => {}); } catch (e) {} A.play('click'); break; }
    case 'loadcode': { const t = (document.getElementById('load-code') || {}).value || ''; const loaded = E.importSave(t, rng); if (loaded) { state = loaded; modal = null; titleOpen = false; toast = 'Save loaded.'; A.play('perk'); } else { toast = 'That is not a Cinder Cell save code.'; A.play('denied'); } break; }
    case 'coophost': { setCoopPrefs({ name: (document.getElementById('coop-name') || {}).value || '', relay: ((document.getElementById('coop-relay') || {}).value || '').trim() }); const code = makeCode(); startCoop('host', code, !getCoopPrefs().relay); break; }
    case 'coopjoin': { setCoopPrefs({ name: (document.getElementById('coop-name') || {}).value || '', relay: ((document.getElementById('coop-relay') || {}).value || '').trim() }); const code = ((document.getElementById('coop-code') || {}).value || '').trim().toUpperCase(); if (code.length >= 4) startCoop('guest', code, !getCoopPrefs().relay); else toast = 'Enter the room code.'; break; }
    case 'coopleave': leaveCoop(); return;
    case 'coopready': state.guestReady = !state.guestReady; if (net) net.send({ t: 'ready', on: state.guestReady }); A.play('click'); break;
    case 'modal': modal = v; A.play('click'); break;
    case 'sound': A.setPref('sfx', !A.getPrefs().sfx); A.play('click'); break;
    case 'setpref': A.setPref(v, !A.getPrefs()[v]); A.play('click'); break;
    case 'tip': state.meta.tips[v] = true; A.play('click'); break;
    case 'threat': state.meta.threat = +v; A.play('click'); break;
    case 'perk':
      if (v && state.char.perks.length >= E.CONTRABAND_SLOTS) { state.perkPick = state.perkPick === v ? null : v; A.play('click'); break; }
      E.choosePerk(state, v, rng, null, actingAs); state.perkPick = null; if (v) A.play('perk'); break;
    case 'perkdrop': if (E.choosePerk(state, state.perkPick, rng, v, actingAs)) { state.perkPick = null; A.play('perk'); } break;
    case 'ending': state.meta.endingSeen = true; state.screen = 'town'; break;
    case 'begin': state.screen = 'create'; if (!state.draft) state.draft = E.newDraft(state.meta, rng); break;
    case 'bg': state.draft.background = v; { for (const key of Object.keys(D.ATTRS)) while (E.draftAttr(state.draft, key) > D.ATTR_CREATE_MAX) E.draftAdjust(state.draft, key, -1); } break;
    case 'attr': E.draftAdjust(state.draft, v, +k); break;
    case 'randname': state.draft.name = D.OPERATIVE_NAMES[Math.floor(rng() * D.OPERATIVE_NAMES.length)]; break;
    case 'create': E.createChar(state, rng); state.gateMap = 'garrison'; state.popup = null; break;
    case 'tab': case 'popup': state.popup = v === 'gate' ? 'missions' : v === 'safehouse' ? 'character' : v; state.notice = null; break;
    case 'closepopup': state.popup = null; state.notice = null; state.compare = null; break;
    case 'compare': state.compare = +v; A.play('click'); break;
    case 'closecompare': state.compare = null; A.play('click'); break;
    case 'buygear': ok = E.buyGear(state, +v); state.compare = null; break;
    case 'gearslot': state.gearSlot = v; A.play('click'); break;
    case 'upgradegear': ok = E.upgradeItem(state, v); break;
    case 'reroll': ok = E.rerollBonus(state, v, +k, rng); break;
    case 'equipheirloom': ok = E.equipHeirloom(state); break;
    case 'heirloom': E.setHeirloom(state, v); A.play('click'); break;
    case 'loottake': if (E.takeLoot(state, rng, actingAs)) A.play('buy'); break;
    case 'lootsell': if (E.leaveLoot(state, rng)) A.play('click'); break;
    case 'lielow': ok = E.lieLow(state); break;
    case 'item': ok = E.buyItem(state, v); break;
    case 'upgrade': ok = E.buyUpgrade(state, v); break;
    case 'implant': ok = E.installImplant(state, v); break;
    case 'unimplant': E.removeImplant(state, v); break;
    case 'heal': ok = E.heal(state); break;
    case 'train': ok = E.train(state, v); break;
    case 'cell': ok = E.buyCell(state, v); break;
    case 'spend': ok = E.spendAttr(state, v); break;
    case 'respec': ok = E.respec(state); break;
    case 'pickmap': state.gateMap = v; break;
    case 'deploy': if (E.isCoop(state) && !state.guestReady) { ok = false; break; } state.popup = null; state.lastResult = null; E.deploy(state, state.gateMap || 'garrison', +v, rng); break;
    case 'continue': E.continueAfterVictory(state, rng); break;
    case 'room': state.lastResult = null; E.enterRoom(state, +v, rng); if (state.screen === 'room') { state.lastResult = { kind: 'room', ...state.roomResult }; E.offerRoute(state, rng); } break;
    case 'dismissresult': state.lastResult = null; break;
    case 'roomDone': E.offerRoute(state, rng); break;
    case 'event': E.resolveEvent(state, +v, rng, actingAs); break;
    case 'eventDone': state.lastResult = null; E.nextEncounter(state, rng); break;
    case 'deeper': state.lastResult = null; E.pushDeeper(state, rng); break;
    case 'extract': E.endRun(state, 'extracted', rng); break;
    case 'recruit': E.recruit(state, rng); state.coopFallen = null; break;
    case 'report': {
      const text = E.runReport(state);
      state.report = text;
      try { navigator.clipboard.writeText(text).then(() => { toast = 'Run report copied. Paste it into the chat.'; render(); }).catch(() => {}); } catch (e) {}
      A.play('click'); break;
    }
    case 'reset':
      if (!confirmReset) { confirmReset = true; break; }
      confirmReset = false; modal = null; state = E.newGame(rng); break;
  }
  if (BUY.has(a) && ok && state.notice) E.journal(state, state.notice, 'town');
  if (BUY.has(a)) A.play(ok ? 'buy' : 'denied');
  else if (['deploy', 'room', 'deeper'].includes(a)) A.play('door');
  else if (['step', 'look', 'tab', 'popup', 'closepopup', 'pickmap', 'continue', 'roomDone', 'eventDone', 'event', 'bg', 'attr', 'create', 'begin', 'recruit', 'extract'].includes(a)) A.play('click');
}

document.addEventListener('click', (ev) => {
  if (ev.target.classList && ev.target.classList.contains('modal-wrap')) { act('closemodal'); return; }
  if (ev.target.classList && ev.target.classList.contains('cmp-pop')) { act('closecompare'); return; }
  if (ev.target.classList && ev.target.classList.contains('town-pop')) { act('closepopup'); return; }
  const b = ev.target.closest('button[data-a]');
  if (!b || b.disabled) return;
  act(b.dataset.a, b.dataset.v, b.dataset.k);
});
document.addEventListener('input', (ev) => {
  if (ev.target.id === 'op-name' && state.draft) { state.draft.name = ev.target.value; save(); }
  if (ev.target.id === 'vol') A.setPref('volume', +ev.target.value);
  if (ev.target.id === 'mvol') A.setPref('musicVolume', +ev.target.value);
});
document.addEventListener('change', (ev) => { if (ev.target.id === 'vol') A.play('click'); });

document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape' && modal) { act('closemodal'); return; }
  if (ev.key === 'Escape' && state.compare !== null && state.compare !== undefined && state.screen === 'town') { act('closecompare'); return; }
  if (ev.key === 'Escape' && state.popup && state.screen === 'town') { act('closepopup'); return; }
  if (ev.key === 'Escape' && state.screen === 'town' && globalThis.cinderTown && globalThis.cinderTown.interior && !globalThis.cinderTown.offer) { globalThis.cinderTown.exit(); return; }
  if (ev.key === 'Escape' && state.screen === 'loot') { act('lootsell'); return; }
  if (ev.key === 'Escape' && state.screen === 'perk') { act('perk', ''); return; }
  if (ev.metaKey || ev.ctrlKey || ev.altKey || busy || modal || ev.target.tagName === 'INPUT') return;
  A.unlock();
  const key = ev.key.toLowerCase();
  if (state.screen === 'combat') {
    const map = { a: 'shoot', f: 'strike', d: 'defend', r: 'run', s: 'stim', 2: 'thermal', 3: 'ion', 4: 'smoke' };
    E.skillsOf(state.char).slice(0, 4).forEach((sk, i) => { map[SKILL_KEYS[i]] = sk; });
    if (map[key] && E.canUse(state, map[key]) && (!E.isCoop(state) || state.run.actor === myIdx())) { ev.preventDefault(); act('act', map[key]); }
  } else if (state.screen === 'route' && (key === '1' || key === '2') && state.run.choices[+key - 1]) {
    ev.preventDefault(); act('room', String(+key - 1));
  } else if (state.screen === 'sectorClear' && (key === '1' || key === '2')) {
    ev.preventDefault(); act(key === '1' ? 'deeper' : 'extract');
  } else if (state.screen === 'loot' && (key === '1' || key === '2')) {
    ev.preventDefault(); act(key === '1' ? 'loottake' : 'lootsell');
  } else if (state.screen === 'perk' && ['1', '2', '3'].includes(key) && state.run.perkOffer[+key - 1]) {
    ev.preventDefault(); act('perk', state.run.perkOffer[+key - 1]);
  } else if (key === 'enter') {
    if (state.screen === 'victory') { ev.preventDefault(); act('continue'); }
    else if (state.screen === 'room') { ev.preventDefault(); act('roomDone'); }
    else if (state.screen === 'event' && state.eventResult) { ev.preventDefault(); act('eventDone'); }
  }
});

function start(data) {
  state = E.migrate((data && data.state) || load(), rng);
  delete state.events;
  if (state.screen === 'create' && !state.draft) state.draft = E.newDraft(state.meta, rng);
  titleOpen = !(data && data.state);
  render();
  loadLayers().then((ok) => { if (ok && state.screen === 'create') render(); });
  // PixelLab sheets, if any have been delivered. Re-render so the stage picks them up.
  loadSheets().then((n) => { if (n && ['combat', 'victory', 'death'].includes(state.screen)) { stage.enemyRef = null; stage.player = null; render(); } });
}
window.claude?.hot?.snapshot?.(() => ({ state }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
