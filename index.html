<style>
/* Layout: a single occupied-town terminal. Status strip on top, one working panel, combat log beside it on wide screens.
   Single deliberate dark look: night curfew under sodium lamps. */
:root {
  color-scheme: dark;
  --bg: #121518;          /* curfew night, cold steel */
  --panel: #1a1f23;
  --panel-2: #222930;
  --line: #2f383f;
  --fg: #ddd6c6;          /* sodium-lit paper */
  --muted: #8d918b;
  --sodium: #e8973a;      /* accent: sodium street lamp */
  --sodium-dim: #e8973a33;
  --danger: #d4483a;
  --danger-dim: #d4483a2a;
  --ok: #8db57d;
  --ion: #73b6d4;
  --display: 'Big Shoulders Stencil Display', 'Impact', 'Arial Narrow', sans-serif;
  --body: 'Barlow Semi Condensed', 'Arial Narrow', system-ui, sans-serif;
  --mono: 'Martian Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.5 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 40px;
  background-image:
    radial-gradient(ellipse 60% 40% at 15% 0%, #e8973a14, transparent 70%),
    repeating-linear-gradient(0deg, #ffffff04 0 1px, transparent 1px 3px);
}
.wrap { max-width: 1080px; margin: 0 auto; display: grid; gap: 16px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--sodium); outline-offset: 2px; }
button:disabled { cursor: not-allowed; opacity: .4; }
h1, h2, h3 { font-family: var(--display); font-weight: 800; letter-spacing: .02em; text-wrap: balance; margin: 0; line-height: 1.05; }
h2 { font-size: 2.2rem; text-transform: uppercase; }
h3 { font-size: 1.3rem; text-transform: uppercase; font-weight: 600; letter-spacing: .04em; }
p { margin: 0; }
.muted { color: var(--muted); }
.label { font-family: var(--mono); font-size: .68rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* status strip */
.status { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding-block: 4px 12px; border-bottom: 1px solid var(--line); }
.brand { font-family: var(--display); font-weight: 800; font-size: 1.9rem; letter-spacing: .06em; color: var(--sodium); text-transform: uppercase; margin-right: auto; }
.stat { display: grid; gap: 2px; }
.stat .v { font-family: var(--mono); font-size: .9rem; font-variant-numeric: tabular-nums; }
.hp { width: 150px; }
.bar { height: 6px; background: var(--panel-2); position: relative; overflow: hidden; }
.bar > i { position: absolute; inset: 0 auto 0 0; background: var(--ok); transition: width .3s ease; }
.bar.low > i { background: var(--danger); }
.bar.enemy > i { background: var(--danger); }

/* panels */
.panel { background: var(--panel); border: 1px solid var(--line); padding: 20px; display: grid; gap: 16px; align-content: start; min-width: 0; }
.notice { border-left: 3px solid var(--sodium); padding: 8px 12px; background: var(--sodium-dim); font-size: .95rem; }

.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); }
.tab { background: none; border: 0; padding: 10px 14px; font-family: var(--display); font-weight: 600; font-size: 1.15rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--sodium); }

.rows { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); }
.row { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; align-items: center; padding: 10px 14px; background: var(--panel); }
.row .name { font-weight: 600; }
.row .desc { font-size: .9rem; color: var(--muted); }
.row.owned .name::after { content: ' \00B7  equipped'; font-family: var(--mono); font-size: .65rem; color: var(--ok); letter-spacing: .08em; text-transform: uppercase; }

.btn { background: var(--panel-2); border: 1px solid var(--line); padding: 8px 14px; font-weight: 600; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--sodium); }
.btn.primary { background: var(--sodium); color: #1a1208; border-color: var(--sodium); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.1); }
.btn.big { padding: 14px 22px; font-family: var(--display); font-size: 1.35rem; text-transform: uppercase; letter-spacing: .06em; }
.btn .k { font-family: var(--mono); font-size: .65rem; opacity: .6; margin-left: 6px; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; }

.columns { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
@media (max-width: 820px) { .columns { grid-template-columns: minmax(0, 1fr); } }

/* combat */
.stage { position: relative; border: 1px solid var(--line); background: #0b0e11; overflow: hidden; }
.stage canvas { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; image-rendering: pixelated; }
.hud { position: absolute; display: grid; gap: 3px; min-width: 0; width: 42%; max-width: 260px; padding: 6px 10px 7px; background: #121518e6; border: 1px solid var(--line); }
.hud-enemy { left: 3%; top: 5%; }
.hud-player { right: 3%; bottom: 6%; border-color: #e8973a66; }
.hud-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; min-width: 0; }
.hud-name { font-family: var(--display); font-weight: 600; font-size: clamp(.85rem, 2.4vw, 1.15rem); line-height: 1.1; text-transform: uppercase; letter-spacing: .04em; overflow: hidden; min-width: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.hud-name.long { font-size: clamp(.72rem, 2vw, .95rem); letter-spacing: .02em; }
.hud-tag { font-family: var(--mono); font-size: .6rem; letter-spacing: .1em; color: var(--muted); white-space: nowrap; }
.hud-hp { font-size: .68rem; color: var(--muted); justify-self: end; }
.hud .bar i { transition: width .35s ease; }
.pops { position: absolute; inset: 0; pointer-events: none; }
.pop { position: absolute; transform: translate(-50%, 0); font-family: var(--display); font-weight: 800; font-size: clamp(1.3rem, 4.2vw, 2.3rem); color: #fff; text-shadow: 0 2px 0 #000, 0 0 8px #000; animation: pop 1s linear forwards; white-space: nowrap; }
.pop.crit { color: #fff1c9; font-size: clamp(2rem, 6.6vw, 3.6rem); -webkit-text-stroke: 1px #b8451f; text-shadow: 0 3px 0 #000, 0 0 16px #ff8a3c, 0 0 5px #000; animation-name: popCrit; z-index: 2; }
.pop.heavy { color: #ff7a64; font-size: clamp(1.6rem, 5vw, 2.8rem); }
.pop.heal { color: var(--ok); }
.pop.ion { color: var(--ion); }
.pop.info { font-family: var(--mono); font-weight: 500; font-size: clamp(.65rem, 1.8vw, .85rem); letter-spacing: .08em; text-transform: uppercase; color: var(--fg); }
.pop.tag { font-family: var(--mono); font-size: clamp(.7rem, 1.8vw, .9rem); letter-spacing: .24em; color: #ffd27a; margin-top: 3.8em; animation-name: pop; }
.pop.level { color: #f1d98a; letter-spacing: .08em; }
/* Pop and settle, hold so it can be read, then drift away. */
@keyframes pop { 0% { opacity: 0; transform: translate(-50%, 10px) scale(.4); } 8% { opacity: 1; transform: translate(-50%, -3px) scale(1.28); } 16% { transform: translate(-50%, 0) scale(.94); } 24% { transform: translate(-50%, 0) scale(1); } 66% { opacity: 1; transform: translate(-50%, -6px) scale(1); } 100% { opacity: 0; transform: translate(-50%, -30px) scale(.97); } }
@keyframes popCrit { 0% { opacity: 0; transform: translate(-50%, 6px) scale(.25) rotate(var(--tilt, 0deg)); } 6% { opacity: 1; transform: translate(-50%, -6px) scale(1.65) rotate(var(--tilt, 0deg)); } 14% { transform: translate(-50%, 0) scale(.9) rotate(calc(var(--tilt, 0deg) * -.4)); } 22% { transform: translate(-50%, 0) scale(1.1) rotate(0deg); } 30% { transform: translate(-50%, 0) scale(1) rotate(0deg); } 72% { opacity: 1; transform: translate(-50%, -5px) scale(1); } 100% { opacity: 0; transform: translate(-50%, -26px) scale(1.03); } }
.speed { position: absolute; right: 2%; top: 4%; display: flex; gap: 2px; }
.speed button { background: #121518cc; border: 1px solid var(--line); color: var(--muted); font-family: var(--mono); font-size: .62rem; padding: 3px 6px; }
.speed button[aria-pressed="true"] { color: var(--sodium); border-color: var(--sodium); }
@media (max-width: 560px) {
  .stage { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1px; background: var(--line); }
  .stage canvas { grid-column: 1 / -1; }
  .hud { position: static; width: auto; max-width: none; border: 0; background: var(--panel-2); }
  .hud-player { order: 2; }
  .hud-enemy { order: 3; }
}
.busy .actions .btn, .busy .items .btn, .busy .skills .btn { opacity: .45; pointer-events: none; }
.foe-info { display: grid; gap: 10px; }
.foe-info .title { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.foe { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; padding: 18px; background: var(--panel-2); border: 1px solid var(--line); align-items: start; }
.foe-info { display: grid; gap: 10px; min-width: 0; }
.portrait { width: 160px; aspect-ratio: 1; max-width: 100%; image-rendering: pixelated; background: radial-gradient(circle at 50% 35%, #e8973a26, transparent 65%), var(--panel); border: 1px solid var(--line); display: block; }
.foe.boss .portrait { background: radial-gradient(circle at 50% 35%, #d4483a33, transparent 65%), var(--panel); border-color: var(--danger); }
.portrait.hit { animation: hit .35s steps(2) 1; }
.portrait.down { filter: grayscale(1) brightness(.5); }
@keyframes hit { 0% { transform: translateX(-4px); filter: brightness(2.2) saturate(0); } 50% { transform: translateX(4px); } 100% { transform: none; filter: none; } }
.killer { display: flex; gap: 16px; align-items: center; }
.killer img { width: 96px; height: 96px; image-rendering: pixelated; border: 1px solid var(--danger); background: var(--panel-2); }
@media (max-width: 520px) { .foe { grid-template-columns: minmax(0, 1fr); } .portrait { width: 128px; } }
.foe.boss { border-color: var(--danger); box-shadow: inset 0 0 0 1px var(--danger-dim); }
.foe .title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
.foe h2 { font-size: 2rem; }
.tag { font-family: var(--mono); font-size: .62rem; letter-spacing: .1em; text-transform: uppercase; padding: 2px 6px; border: 1px solid var(--line); color: var(--muted); }
.tag.boss { color: var(--danger); border-color: var(--danger); }
.tag.droid { color: var(--ion); border-color: var(--ion); }
.intent { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); }
.intent b { font-family: var(--display); font-size: 1.2rem; text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
.intent .tip { grid-column: 2; font-size: .88rem; color: var(--muted); }
.intent .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--sodium); grid-row: span 2; align-self: start; margin-top: 7px; }
.intent.danger { border-color: var(--danger); background: var(--danger-dim); }
.intent.danger .dot { background: var(--danger); animation: pulse 0.9s ease-in-out infinite; }
.intent.calm .dot { background: var(--ion); }
@keyframes pulse { 50% { opacity: .25; } }
.statline { display: flex; flex-wrap: wrap; gap: 16px; font-family: var(--mono); font-size: .78rem; color: var(--muted); }
.statline b { color: var(--fg); font-weight: 500; }
.actions { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.actions .btn { padding: 14px 8px; font-family: var(--display); font-size: 1.25rem; text-transform: uppercase; letter-spacing: .04em; white-space: normal; }
.items { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.items .btn { font-size: .9rem; white-space: normal; padding: 8px 6px; }
@media (max-width: 520px) { .actions, .items { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.log { font-family: var(--mono); font-size: .74rem; line-height: 1.6; display: grid; gap: 4px; max-height: 460px; overflow-y: auto; align-content: start; }
.log p { padding-left: 10px; border-left: 2px solid var(--line); }
.log .hit { border-color: var(--fg); }
.log .crit { border-color: var(--sodium); color: var(--sodium); }
.log .hurt { border-color: var(--danger); }
.log .bad { border-color: var(--danger); color: var(--danger); }
.log .good { border-color: var(--ok); color: var(--ok); }
.log .reward { border-color: var(--sodium); }
.log .sys, .log .boss { color: var(--muted); font-style: italic; }
.log .boss { color: var(--danger); }
.log p:last-child { background: #ffffff06; }

.big-title { font-size: clamp(2.6rem, 8vw, 4.6rem); color: var(--sodium); text-transform: uppercase; }
.story { display: grid; gap: 12px; max-width: 62ch; font-size: 1.08rem; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; font-family: var(--mono); font-size: .85rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-variant-numeric: tabular-nums; }
.pips { display: inline-flex; gap: 3px; flex-wrap: wrap; }
.pips i { width: 8px; height: 8px; background: var(--panel-2); border: 1px solid var(--line); }
.pips i.on { background: var(--sodium); border-color: var(--sodium); }
.wall { display: grid; gap: 6px; font-size: .9rem; }
.wall div { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px dashed var(--line); padding-bottom: 4px; }
.danger-text { color: var(--danger); }
.ok-text { color: var(--ok); }
.ins { display: flex; flex-wrap: wrap; gap: 8px; }

/* character creation, map board, skills, events */
.create-grid, .two-col { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px; }
@media (max-width: 820px) { .create-grid, .two-col { grid-template-columns: minmax(0, 1fr); } }
input.text { flex: 1 1 200px; min-width: 0; background: var(--panel-2); border: 1px solid var(--line); color: var(--fg); font: 600 1.1rem var(--body); padding: 8px 12px; }
input.text:focus-visible { outline: 2px solid var(--sodium); outline-offset: 1px; }
.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 520px) { .choices { grid-template-columns: minmax(0, 1fr); } }
.choice { text-align: left; display: grid; gap: 4px; align-content: start; padding: 12px; background: var(--panel-2); border: 1px solid var(--line); }
.choice b { font-family: var(--display); font-size: 1.2rem; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.choice .face { width: 64px; height: 64px; image-rendering: pixelated; border: 1px solid var(--line); background: var(--panel); justify-self: start; }
.choice .desc { font-size: .88rem; color: var(--muted); }
.choice .bg-perk { font-size: .85rem; color: var(--sodium); }
.choice.on, .map-card.on { border-color: var(--sodium); box-shadow: inset 0 0 0 1px var(--sodium); }
.chip { display: inline-block; font-family: var(--mono); font-size: .62rem; letter-spacing: .08em; text-transform: uppercase; padding: 2px 6px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip.bad { color: var(--danger); border-color: var(--danger); }
.chip.good { color: var(--ok); border-color: var(--ok); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.attr-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 14px; background: var(--panel); }
.attr-row .desc { font-size: .85rem; color: var(--muted); }
.stepper { display: flex; align-items: center; gap: 8px; }
.stepper .btn { width: 36px; padding: 6px 0; }
.big-num { font-size: 1.4rem; min-width: 1.6ch; text-align: center; }
.points { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border: 1px dashed var(--line); }
.badge { display: inline-block; min-width: 1.4em; padding: 0 4px; background: var(--sodium); color: #1a1208; font-family: var(--mono); font-size: .7rem; text-align: center; vertical-align: middle; }
.maps { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; }
.map-card { text-align: left; display: grid; gap: 6px; align-content: start; padding: 14px; border: 1px solid var(--line); background: var(--panel-2); position: relative; overflow: hidden; }
.map-card::before { content: ""; position: absolute; inset: 0 0 auto; height: 3px; background: var(--map, var(--sodium)); }
.map-card b { font-family: var(--display); font-size: 1.35rem; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.map-card .desc { font-size: .9rem; color: var(--muted); }
.map-card:disabled { opacity: .45; }
.theme-garrison { --map: #e8973a; } .theme-foundry { --map: #e0602a; } .theme-detention { --map: #73b6d4; } .theme-port { --map: #b9c2cc; }
.skills { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 520px) { .skills { grid-template-columns: minmax(0, 1fr); } }
.skill { display: grid; gap: 2px; text-align: left; border-color: #e8973a55; white-space: normal; }
.sk-name { font-family: var(--display); font-size: 1.1rem; text-transform: uppercase; letter-spacing: .04em; }
.sk-note { font-family: var(--mono); font-size: .62rem; letter-spacing: .06em; color: var(--muted); text-transform: uppercase; }
.options { display: grid; gap: 8px; max-width: 640px; }
.option { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; text-align: left; white-space: normal; padding: 12px 14px; }
.notice.win { border-color: var(--ok); background: #8db57d22; }
.notice.lose { border-color: var(--danger); background: var(--danger-dim); }
.spend-inline { display: grid; gap: 8px; padding: 12px; border: 1px dashed var(--sodium); }
.mech-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.mech { font-family: var(--mono); font-size: .72rem; letter-spacing: .06em; padding: 4px 8px; border: 1px solid var(--line); color: var(--fg); white-space: nowrap; }
.mech b { color: var(--sodium); font-weight: 500; text-transform: uppercase; letter-spacing: .1em; margin-right: 4px; }
.mech.hot { border-color: var(--danger); background: var(--danger-dim); }
.mech.hot b { color: var(--danger); }
.mech-line { font-size: .85rem; color: var(--fg); border-top: 1px dashed var(--line); padding-top: 6px; }
.mech-line b { color: var(--map, var(--sodium)); font-weight: 600; }
.pips.rooms i { width: 22px; height: 6px; }
.doors { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.door { text-align: left; display: grid; gap: 6px; align-content: start; padding: 18px; min-height: 150px; background: var(--panel-2); border: 1px solid var(--line); border-top: 4px solid var(--door, var(--line)); }
.door:hover { border-color: var(--sodium); border-top-color: var(--door, var(--sodium)); }
.door b { font-family: var(--display); font-size: 1.6rem; font-weight: 800; text-transform: uppercase; letter-spacing: .03em; }
.door .desc { color: var(--muted); font-size: .92rem; }
.door-fight { --door: var(--fg); } .door-elite { --door: var(--danger); } .door-boss { --door: var(--danger); background: var(--danger-dim); }
.door-event { --door: var(--ion); } .door-bounty { --door: var(--danger); } .door-vault, .door-locker, .door-fence { --door: #b77be8; } .door-medbay { --door: var(--ok); } .door-bench { --door: var(--sodium); } .door-supply, .door-cargo { --door: var(--sodium); } .door-rest { --door: var(--ok); } .door-cells { --door: var(--ion); }

/* ---------- overhaul: header tools, dialogs, tips ---------- */
.status { display: grid; gap: 10px; }
.head-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.head-stats { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 28px; }
.tools { display: flex; gap: 4px; flex-wrap: wrap; }
.stage:has(.cine.on:not(.out)) .hud, .stage:has(.cine.on:not(.out)) .speed { opacity: 0; transition: opacity .3s; }
.status .brand { margin-right: 8px; }
.tool { background: none; border: 1px solid var(--line); color: var(--muted); font-family: var(--mono); font-size: .64rem; letter-spacing: .1em; text-transform: uppercase; padding: 6px 9px; }
.tool:hover { color: var(--fg); border-color: var(--sodium); }
.tool[aria-pressed="false"] { color: #6b6f6a; text-decoration: line-through; }
.tipbox { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 14px; align-items: center; padding: 10px 14px; border: 1px dashed #73b6d466; background: #73b6d40f; }
.tipbox .label { grid-column: 1 / -1; color: var(--ion); }

.modal { position: relative; width: min(760px, 100%); max-height: 86vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--sodium); padding: 24px; display: grid; gap: 16px; }

.toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 40; background: var(--panel-2); border: 1px solid var(--ok); color: var(--fg); padding: 10px 16px; font-size: .92rem; max-width: calc(100% - 32px); animation: toast 4s ease forwards; }

/* ---------- combat ---------- */
.combat-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }

@media (max-width: 560px) { .combat .intent { grid-template-columns: auto minmax(0, 1fr); } .intent-side { grid-column: 1 / -1; grid-row: auto; justify-content: flex-start; } }
.statline { font-size: .74rem; gap: 6px 14px; align-items: center; }

.items .btn .num, .actions .btn .num { font-size: .8em; opacity: .8; }
.items { grid-template-columns: repeat(3, minmax(0, 1fr)); }

.pop.st-bleed { color: #ff7a64; } .pop.st-burn { color: #ff9a55; } .pop.st-shaken { color: #c6ccd2; } .pop.st-exposed { color: #f0de78; }
.pop.st-bleed, .pop.st-burn, .pop.st-shaken, .pop.st-exposed { font-family: var(--mono); font-size: clamp(.7rem, 2vw, .95rem); letter-spacing: .12em; margin-top: 1.6em; }

/* boss intro */
.cine { position: absolute; inset: 0; pointer-events: auto; overflow: hidden; z-index: 5; cursor: pointer; }
.cine i { position: absolute; left: 0; right: 0; height: 0; background: #000; transition: height .45s ease; }
.cine .bar-top { top: 0; } .cine .bar-bot { bottom: 0; }
.cine.on i { height: 13%; }
.cine.out i { height: 0; }
.cine-card { position: absolute; left: 4%; bottom: 17%; display: grid; gap: 2px; opacity: 0; transform: translateX(-30px); transition: opacity .35s ease, transform .35s ease; border-left: 3px solid var(--danger); padding: 4px 0 4px 12px; background: linear-gradient(90deg, #000000b0, transparent); max-width: 70%; }

.cine-epithet { font-family: var(--body); font-style: italic; font-size: clamp(.75rem, 2vw, 1rem); color: var(--fg); }
.cine-skip { position: absolute; right: 2%; bottom: 3%; font-family: var(--mono); font-size: .55rem; letter-spacing: .1em; color: #ffffff77; text-transform: uppercase; z-index: 2; }

/* a boss talking in the fight: over the stage, never in the way of a tap */
.bsay { position: absolute; left: 2%; right: 47%; bottom: 6%; z-index: 4; display: grid; gap: 2px; padding: 5px 10px; pointer-events: none; background: #000000d0; border-left: 3px solid var(--danger); opacity: 0; transform: translateY(4px); transition: opacity .18s ease, transform .18s ease; }

.area-line { margin: 0; padding: 2px 0 2px 10px; border-left: 2px solid var(--sodium); font-style: italic; font-size: .95rem; line-height: 1.3; color: var(--fg); max-width: 72ch; }

/* scenes: the fallen line, a boss's first defeat */
.scene-wrap { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: #040507ee; cursor: pointer; }

/* contraband */

/* ---------- icons ---------- */
.ico { flex: none; display: block; }

.row.i { grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 14px; }

@media (max-width: 520px) { .row.i { grid-template-columns: auto minmax(0, 1fr); } .row.i > .btn, .row.i > .label:last-child, .row.i > span:last-child { grid-column: 2; justify-self: start; } .coop-form .set-row { flex-wrap: wrap; } .coop-form .set-row > span:first-child { flex: 1 1 100%; } .coop-form .text { max-width: none; } .row.i > .ico { width: 32px; height: 32px; } .door b, .door .desc { padding-right: 0; } .door > .ico { width: 36px; height: 36px; } }

.quirk-line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: .85rem; color: var(--muted); }

.perk.on { border-color: var(--sodium); box-shadow: inset 0 0 0 1px var(--sodium); }

.btn.twoline { display: grid; gap: 2px; justify-items: center; align-content: center; text-align: center; }

/* ---------- gear: rarity frames, item cards, paper doll, loot ---------- */
.r-common { --rar: #a3a7a4; } .r-rare { --rar: #5ea6e8; } .r-elite { --rar: #b77be8; } .r-legendary { --rar: #e8b23a; } .r-unique { --rar: #e8673a; } .r-none { --rar: var(--line); }
.rf { display: inline-grid; place-items: center; flex: none; padding: 4px; background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--rar) 22%, transparent), var(--panel-2) 70%); border: 2px solid var(--rar); }
.rf .ico { width: 40px; height: 40px; }

.rf.empty { width: 52px; height: 52px; border-style: dashed; background: var(--panel-2); }
.rname { color: var(--rar); font-weight: 600; }
/* Icon frames: a recessed plate tinted by rarity, brighter corners, and a glow on the best gear. */
.rf:not(.empty) { position: relative; background: radial-gradient(circle at 50% 42%, color-mix(in srgb, var(--rar) 26%, #1a2026) 0%, #12161a 78%); border: 1px solid color-mix(in srgb, var(--rar) 62%, #0b0d0f); box-shadow: inset 0 0 0 1px #0a0c0e, inset 0 1px 0 1px #ffffff12, inset 0 -6px 10px #0000005c; }
.rf:not(.empty)::before, .rf:not(.empty)::after { content: ''; position: absolute; width: 6px; height: 6px; pointer-events: none; border: 1px solid var(--rar); }
.rf:not(.empty)::before { left: -1px; top: -1px; border-right: 0; border-bottom: 0; }
.rf:not(.empty)::after { right: -1px; bottom: -1px; border-left: 0; border-top: 0; }
.rf.r-elite { box-shadow: inset 0 0 0 1px #0a0c0e, inset 0 1px 0 1px #ffffff12, inset 0 -6px 10px #0000005c, 0 0 7px #b77be855; }
.rf.r-legendary { box-shadow: inset 0 0 0 1px #0a0c0e, inset 0 1px 0 1px #ffffff1a, inset 0 -6px 10px #0000005c, 0 0 10px #e8b23a77; }
.rf.r-unique { box-shadow: inset 0 0 0 1px #0a0c0e, inset 0 1px 0 1px #ffffff1a, inset 0 -6px 10px #0000005c, 0 0 10px #e8673a77; }
.row.i > .ico { background: radial-gradient(circle at 50% 40%, #2a333a 0%, #14191d 80%); box-shadow: inset 0 0 0 1px #0a0c0e, inset 0 1px 0 1px #ffffff10; }
.item { background: linear-gradient(180deg, color-mix(in srgb, var(--rar) 7%, var(--panel-2)) 0%, var(--panel-2) 42%); }
.item-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); gap: 10px; }
.item { display: grid; gap: 8px; align-content: start; padding: 12px 14px; background: var(--panel-2); border: 1px solid var(--line); border-top: 3px solid var(--rar); min-width: 0; }
.item-head { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; align-items: center; }
.item-head b { font-family: var(--display); font-size: 1.25rem; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; color: var(--rar); line-height: 1.1; }
.item .desc { font-size: .88rem; color: var(--muted); }
.item ul { margin: 0; padding-left: 1.1em; font-size: .88rem; display: grid; gap: 2px; }
.item ul .trait { color: var(--rar); list-style: '\2605  '; }
.item ul .uq { color: var(--rar); list-style: '\25C6  '; }
.item .stats { display: flex; flex-wrap: wrap; gap: 4px 12px; font-family: var(--mono); font-size: .74rem; }
.item .stats b { color: var(--fg); font-weight: 500; }
.item .cmp { display: flex; flex-wrap: wrap; gap: 4px; }
.item .act { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.item .act .note { font-size: .8rem; color: var(--muted); }
.doll { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 240px) minmax(0, 1fr); gap: 10px; align-items: start; }
.doll .col { display: grid; gap: 8px; }
.slot { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: auto auto auto; column-gap: 10px; align-items: center; text-align: left; padding: 8px 10px; background: var(--panel-2); border: 1px solid var(--line); border-left: 3px solid var(--rar); min-width: 0; }
.slot > .rf { grid-row: 1 / span 3; }

.slot .ms { font-family: var(--mono); font-size: .7rem; color: var(--muted); }
.slot.on { box-shadow: inset 0 0 0 1px var(--sodium); border-color: var(--sodium); border-left-color: var(--rar); }
.doll .me { display: grid; gap: 10px; justify-items: center; padding: 10px; border: 1px dashed var(--line); }
.doll .me img { width: 128px; height: 128px; image-rendering: pixelated; }
.doll .me .kv { font-size: .78rem; width: 100%; }
@media (max-width: 760px) { .doll { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .doll .me { grid-column: 1 / -1; grid-row: 1; grid-template-columns: auto minmax(0, 1fr); align-items: center; justify-items: start; } .doll .me img { width: 88px; height: 88px; } }
.loot { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
@media (max-width: 640px) { .loot { grid-template-columns: minmax(0, 1fr); } }

  /* Town: the yard on the left, a column of big buttons on the right that never moves while you walk. */
  #app > .town-panel { display: grid; grid-template-columns: minmax(0, 1fr) clamp(196px, 28%, 250px); grid-template-rows: minmax(0, 1fr); gap: 6px; overflow: hidden; padding: 5px 6px; }

  /* Building an operative: every step fills the screen, with Next always in the same corner. */
  #app > .create-panel { display: flex; flex-direction: column; gap: 6px; padding: 4px 10px 6px; position: relative; overflow: hidden; height: 100%; }

  /* Menus are full-screen sheets: title, tabs and Close on one line, the list underneath. */
  .popup-wrap, .modal-wrap { padding: max(4px, env(safe-area-inset-top, 0px)) max(8px, env(safe-area-inset-right, 0px)) max(4px, calc(env(safe-area-inset-bottom, 0px) * .4)) max(8px, env(safe-area-inset-left, 0px)); }

  /* Missions: districts and what to expect on the left, where to start on the right. */
  .gate { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: 'maps go' 'brief go'; grid-template-rows: auto minmax(0, 1fr); gap: 8px 14px; align-items: start; }

  /* A fight: the scene on the left, the console on the right. Both use the full height. */

  .c-left { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); grid-auto-rows: auto; gap: 2px 8px; min-width: 0; min-height: 0; }

// Numbers in the strip count to their new value. The strip is rebuilt on every render and always carries the true value in data-val; the
// counter only overwrites what's shown while it runs, and its last step reads the truth back from the page.
const cntSpan = (k, v) => `<span data-cnt="${k}" data-val="${v}">${v.toLocaleString()}</span>`;
const counts = { recs: {}, owner: null, raf: 0 };
function syncCounts() {
  const owner = state.char ? `${state.char.number}|${state.char.name}` : null, now = performance.now(), seen = {};
  if (owner !== counts.owner) { counts.owner = owner; counts.recs = {}; }
  for (const el of document.querySelectorAll('[data-cnt]')) {
    const k = el.dataset.cnt, to = +el.dataset.val;
    seen[k] = true;
    let rec = counts.recs[k];
    if (!rec) rec = counts.recs[k] = { v: to, from: to, to, t0: 0, dur: 0 };
    if (to !== rec.to) {
      if (calmNow() || document.hidden) { rec.v = rec.from = rec.to = to; rec.dur = 0; }
      else { rec.from = rec.v; rec.to = to; rec.t0 = now; rec.dur = Math.min(750, 300 + Math.abs(to - rec.v) * 4); }
    }
    if (rec.v !== rec.to) { el.textContent = Math.round(rec.v).toLocaleString(); el.classList.add('counting'); }
  }
  for (const k of Object.keys(counts.recs)) if (!seen[k]) delete counts.recs[k];
  if (!counts.raf && Object.values(counts.recs).some((r) => r.v !== r.to)) counts.raf = requestAnimationFrame(tickCounts);
}
function tickCounts(now) {
  counts.raf = 0;
  let more = false;
  for (const [k, rec] of Object.entries(counts.recs)) {
    if (rec.v === rec.to) continue;
    const p = rec.dur ? Math.min(1, Math.max(0, now - rec.t0) / rec.dur) : 1;
    rec.v = p >= 1 ? rec.to : rec.from + (rec.to - rec.from) * (1 - Math.pow(1 - p, 2));
    for (const el of document.querySelectorAll(`[data-cnt="${k}"]`)) {
      if (p >= 1) { el.textContent = (+el.dataset.val).toLocaleString(); el.classList.remove('counting'); }
      else { el.textContent = Math.round(rec.v).toLocaleString(); el.classList.add('counting'); }
    }
    if (p < 1) more = true;
  }
  if (more) counts.raf = requestAnimationFrame(tickCounts);
}

function animatePayout() {

  playedPayout = p.id;

  if (!root) return;
  const wrap = root.closest('.payout-wrap'), bar = root.querySelector('.payout-bar i'), lab = root.querySelector('.payout-level .label'), upEl = root.querySelector('.payout-up');
  const seq = [...root.querySelectorAll('[data-tally]')].map((el) => ({ el, to: +el.dataset.tally, fmt: (v) => v.toLocaleString(), dur: 320 }))
    .concat([...root.querySelectorAll('[data-count]')].map((el) => ({ el, to: +el.dataset.count, fmt: (v) => `+${v.toLocaleString()}`, dur: 480, coin: true })));

    root.classList.add('lvup'); wrap.classList.add('lvup');

    for (const s of seq) { s.el.textContent = s.fmt(s.to); const row = s.el.closest('.tally > div'); if (row) { row.classList.remove('on'); row.classList.add('done'); } }
    root.classList.add('settled');

    if (bar) bar.style.width = `${Math.round(p.toPct * 100)}%`;
    if (upEl && p.toLevel > p.fromLevel) upEl.hidden = false;
    root.removeEventListener('click', skip);
  };
  const finish = () => { if (done) return; done = true; clearTimeout(timer); cancelAnimationFrame(raf); settle(); };
  const skip = (ev) => {
    if (ev.target.closest('button')) return;
    const leveled = !upEl || upEl.hidden ? p.toLevel > p.fromLevel : false;
    if (!done) { if (leveled) levelFlash(); A.play('tallyDone'); }
    finish();
  };
  if (calmNow()) { A.play('coin'); if (p.toLevel > p.fromLevel) A.play('levelBurst'); settle(); return; }
  root.addEventListener('click', skip);
  const live = () => root.isConnected && !done;

  const levels = () => {
    let level = p.fromLevel;

      } else { bar.style.width = `${Math.round(p.toPct * 100)}%`; timer = setTimeout(() => { if (live()) finish(); }, 500); }
    };
    step();
  };
  const run = (i) => {
    if (!live()) return;

    const s = seq[i], row = s.el.closest('.tally > div'), dur = s.to ? s.dur : 110;
    if (row) row.classList.add('on');
    if (s.coin && s.to) A.play('coin');
    const t0 = performance.now();
    let lastTick = 0;
    const tick = (now) => {
      if (!live()) return;
      const k = Math.min(1, Math.max(0, now - t0) / dur), e = 1 - Math.pow(1 - k, 2);
      s.el.textContent = s.fmt(k >= 1 ? s.to : Math.round(s.to * e));

      if (k < 1) { raf = requestAnimationFrame(tick); return; }

    };

}

  if (b.spd) out.push(`<span>SPD <b>${signed(b.spd)}</b></span>`);
  if (b.req) out.push(`<span class="chip ${E.meetsReq(c, b.req) ? '' : 'bad'}">needs ${E.reqText(b.req)}</span>`);
  const sk = b.slot === 'ranged' ? D.WEAPON_SKILL[b.type] : b.slot === 'melee' && !b.noSkill ? 'smash' : b.overload ? 'overload' : null;
  if (sk) out.push(`<span>skill <b>${esc(D.SKILLS[sk].name)}</b></span>`);
  return out.join('');
}
// A rough overall gain if this piece replaced what's in its slot, for marking upgrades.
function gearGain(it) {
  const c = state.char, slot = E.baseOf(it).slot, old = c.gear[slot];
  if (old === it) return 0;
  const a = E.stats(state);
  c.gear[slot] = it;
  const b = E.stats(state);
  c.gear[slot] = old;
  return (b.atk - a.atk) + (b.atkM - a.atkM) + 2 * (b.def - a.def) + (b.spd - a.spd) + (b.maxHp - a.maxHp) / 5 + 25 * ((b.crit - a.crit) + (b.critM - a.critM));
}
// What would change if this piece replaced what's in its slot.
function compareChips(it) {
  const c = state.char, slot = E.baseOf(it).slot, old = c.gear[slot];
  if (old === it) return '';
  const before = E.stats(state), skB = E.skillsOf(c);
  c.gear[slot] = it;
  const after = E.stats(state), skA = E.skillsOf(c);
  c.gear[slot] = old;
  const rows = [['atk', 'Shoot ATK'], ['atkM', 'Strike ATK'], ['def', 'DEF'], ['spd', 'SPD'], ['maxHp', 'HP'], ['crit', 'shoot crit', true], ['critM', 'strike crit', true], ['carry', 'carry']];
  const chips = rows.map(([k, l, isPct]) => {
    const d = after[k] - before[k];
    if (Math.abs(d) < (isPct ? 0.005 : 0.5)) return '';
    return `<span class="chip ${d > 0 ? 'good' : 'bad'}">${isPct ? signed(Math.round(d * 100), '%') : signed(Math.round(d))} ${l}</span>`;
  });
  for (const k of skA) if (!skB.includes(k)) chips.push(`<span class="chip good">+ ${esc(D.SKILLS[k].name)}</span>`);
  for (const k of skB) if (!skA.includes(k)) chips.push(`<span class="chip bad">\u2212 ${esc(D.SKILLS[k].name)}</span>`);
  const list = chips.join('');
  return `<div class="cmp"><span class="label" style="width:100%">vs your ${old ? esc(E.itemName(old)) : 'empty slot'}</span>${list || '<span class="chip">no stat change</span>'}</div>`;
}
function itemCard(it, { compare = true, actions = '', cls = '', flag = '' } = {}) {
  if (!it) return '';
  const b = E.baseOf(it), R = D.RARITY[it.rarity];
  const bonuses = it.bonuses.map((x) => `<li>${esc(E.bonusText(x))}</li>`).join('');
  const trait = it.trait ? `<li class="trait"><b>${esc(D.TRAITS[it.trait].name)}</b>: ${esc(D.TRAITS[it.trait].desc)}</li>` : '';
  const uq = b.unique ? `<li class="uq">${esc(b.desc)}</li>` : '';
  return `<div class="item r-${it.rarity} ${cls}">
    <div class="item-head">${gearIco(it)}<div style="display:grid;gap:2px;min-width:0"><span class="label">${esc(R.name)} \u00B7 ${esc(SLOTS[b.slot].name)}${flag ? ` <span class="chip good up-flag">${esc(flag)}</span>` : ''}</span><b>${esc(E.itemName(it))}</b></div></div>
    <div class="stats">${itemStatsLine(it)}</div>
    ${b.unique ? '' : `<p class="desc">${esc(b.desc)}</p>`}
    ${bonuses || trait || uq ? `<ul>${uq}${bonuses}${trait}</ul>` : ''}
    ${compare ? compareChips(it) : ''}
    ${actions ? `<div class="act">${actions}</div>` : ''}
  </div>`;
}

function gearTab() {

  const slotBtn = (slot) => {

    return `<button class="slot ${sel === slot ? 'on' : ''} r-${it ? it.rarity : 'none'}" data-a="gearslot" data-v="${slot}" aria-pressed="${sel === slot}">${gearIco(it, 'sm')}
      <span class="label">${esc(SLOTS[slot].short)}</span><b>${it ? esc(E.itemName(it)) : 'Empty'}</b><span class="ms">${ms ? `${ms.key === 'atk' ? 'ATK' : 'DEF'} ${ms.v}` : it ? 'utility' : 'buy one at the market'}${it && it.bonuses.length ? ` \u00B7 ${it.bonuses.length} bonus${it.bonuses.length > 1 ? 'es' : ''}` : ''}</span></button>`;
  };
  const me = lookStill(c.look, c.background) || sheetStill('player') || portraitURL('player');
  const it = c.gear[sel];

      actions += `<button class="btn primary" data-a="upgradegear" data-v="${sel}" ${c.credits < cost ? 'disabled' : ''}>Upgrade to +${it.level + 1} \u00B7 ${ms.key.toUpperCase()} ${ms.v} \u2192 ${ms.v + E.upgradeGain(it)} \u00B7 ${cr(cost)}</button>`;
    } else if (E.upgradeGain(it) > 0) actions += '<span class="note">Fully upgraded.</span>';
    if (E.canReroll(it)) it.bonuses.forEach((x, i) => { if (!x.fixed) actions += `<button class="btn" data-a="reroll" data-v="${sel}" data-k="${i}" ${c.credits < E.price(state, E.rerollCost(it)) ? 'disabled' : ''} title="Replace this bonus with a random different one">Reroll \u201C${esc(E.bonusText(x))}\u201D \u00B7 ${cr(E.price(state, E.rerollCost(it)))}</button>`; });

  }
  const heir = state.meta.heirloom;
  const locker = heir ? `<h3>Safehouse locker</h3><p class="muted" style="font-size:.9rem">Left behind by an earlier operative (Heirloom).</p>
    ${itemCard(heir, { actions: E.canEquip(c, heir) ? `<button class="btn primary" data-a="equipheirloom">Equip${E.heirloomWorthy(state.meta, c.gear[E.baseOf(heir).slot]) ? ' (your current piece goes in the locker)' : ''}</button>` : `<span class="note">You need ${E.reqText(E.baseOf(heir).req)} to use it.</span>` })}` : '';
  return `
    <div class="doll">
      <div class="col">${['ranged', 'melee', 'gadget'].map(slotBtn).join('')}</div>
      <div class="me">${me ? `<img src="${me}" alt="${esc(c.name)}" width="128" height="128">` : ''}<dl class="kv"><dt>Shoot</dt><dd>${st.atk} ATK \u00B7 ${pct(st.crit)} crit</dd><dt>Strike</dt><dd>${st.atkM} ATK \u00B7 ${pct(st.critM)} crit</dd><dt>DEF \u00B7 SPD</dt><dd>${st.def} \u00B7 ${st.spd}</dd><dt>HP</dt><dd>${c.hp} / ${st.maxHp}</dd></dl></div>
      <div class="col">${['head', 'chest', 'legs'].map(slotBtn).join('')}</div>
    </div>
    <span class="label">${esc(SLOTS[sel].name)} \u00B7 ${esc(SLOTS[sel].desc)}</span>
    ${it ? itemCard(it, { compare: false, actions }) : '<p class="muted">Nothing in this slot. Check the Black Market.</p>'}
    ${locker}`;
}

function marketGear() {
  const c = state.char, o = E.shopOdds(state.meta);
  // Upgrades you can use come first. Each button keeps the piece's place in the stock.
  const order = (c.market || []).map((it, i) => ({ it, i, up: E.canEquip(c, it) && gearGain(it) > 0 })).sort((a, b) => b.up - a.up || a.i - b.i);
  const cards = order.map(({ it, i, up }) => {
    const net = E.netPrice(state, it), ok = E.canEquip(c, it), short = net - c.credits;
    const btn = `<button class="btn primary" data-a="buygear" data-v="${i}" ${!ok || short > 0 ? 'disabled' : ''}>${!ok ? `Needs ${esc(E.reqText(E.baseOf(it).req))}` : short > 0 ? `${cr(short)} short` : `Buy \u00B7 ${cr(net)}`}</button>`;
    const cmp = `<button class="btn" data-a="compare" data-v="${i}" title="See this piece next to what you have in that slot">Compare</button>`;
    return itemCard(it, { actions: `${btn}${cmp}`, flag: up ? 'Upgrade' : '' });
  }).join('');
  return `<div class="odds"><span>Odds:</span>${['common', 'rare', 'elite', 'legendary'].map((k) => `<span class="rname r-${k}">${D.RARITY[k].name} ${Math.round(o[k] * 1000) / 10}%</span>`).join('')}</div>
    ${cards ? `<div class="item-grid">${cards}</div>` : '<p class="muted">Sold out. Marrow restocks after your next raid.</p>'}`;
}

function market() {
  const c = state.char, st = E.stats(state);
  const items = Object.entries(D.ITEMS).map(([id, it]) => `<div class="row i">${ico(`item:${id}`)}<div><div class="name">${esc(it.name)} <span class="num muted" style="font-size:.8rem">${c.items[id]}/${st.carry}</span></div><div class="desc">${esc(it.desc)}</div></div>

  const restock = c.items.stim < st.carry ? `<div class="row i restock">${ico('item:stim')}<div><div class="name">Restock Med Stims</div><div class="desc">Fill up in one tap.</div></div><button class="btn primary" data-a="restock" ${stimN ? '' : 'disabled'}>${stimN ? `Buy ${stimN} \u00B7 ${cr(stimN * stimEach)}` : 'Can\u2019t afford'}</button></div>` : '';
  const ups = D.UPGRADES.map((u) => {

}

      <div style="display:grid;gap:14px;align-content:start;min-width:0">
        <span class="label">Marks \u00B7 ${(c.marks || []).length} / 5 \u00B7 earned in orbit</span>${(c.marks || []).length ? `<div class="perk-list">${c.marks.map((id) => { const mk = D.MARKS[id]; return `<div class="perk-mini rare">${ico(`mark:${id}`, 'sm2')}<div><b>${esc(mk.name)}</b><span>${esc(mk.desc)}</span></div></div>`; }).join('')}</div>` : '<p class="muted">None yet. Fly the shuttle (Orbit, after curfew) on the harder runs.</p>'}
        ${(() => { const fb = E.featBuffs(m), t = Object.entries(fb).filter(([k, v]) => k !== 'vs' && v > 0), vs = Object.keys(fb.vs).length; return `<span class="label">Achievements \u00B7 the cell\u2019s permanent edges</span>${t.length || vs ? `<div class="chips">${t.map(([k, v]) => `<span class="chip good">+${(v * 100).toFixed(1).replace(/\.0$/, '')}% ${esc(E.BUFF_NAMES[k])}</span>`).join('')}${vs ? `<span class="chip good">bonus damage vs ${vs} enemy type${vs > 1 ? 's' : ''}</span>` : ''}<button class="btn" data-a="modal" data-v="feats" style="margin-left:4px">All feats</button></div>` : '<p class="muted">No tiers yet. Everything the cell does counts: see <button class="btn" data-a="modal" data-v="feats">Feats</button>.</p>'}`; })()}
        <span class="label">Contraband \u00B7 ${c.perks.reduce((t, id) => t + E.perkStacks(c, id), 0)} carried</span>${c.perks.length ? `<div class="perk-list">${c.perks.map((id) => { const pk = { ...E.perkById(id), name: E.perkName(id, E.perkStacks(c, id)), desc: E.perkText(id, E.perkStacks(c, id)) }; return `<div class="perk-mini ${pk.rare ? 'rare' : ''}">${ico(`perk:${id}`, 'sm2')}<div><b>${esc(pk.name)}</b><span>${esc(pk.desc)}</span></div></div>`; }).join('')}</div>` : '<p class="muted">None yet. Bosses always carry it; other enemies sometimes do.</p>'}
      </div>
      <div style="display:grid;gap:14px;align-content:start;min-width:0">
        <span class="label">Choices that changed you</span><div class="wall">${history}</div>
        <span class="label">The wall \u00B7 ${m.operatives} operative${m.operatives === 1 ? '' : 's'} so far</span><div class="wall">${wall}</div>
      </div>
    </div>` : ''}`;
}

function gate() {
  const c = state.char, st = E.stats(state), m = state.meta;
  const sel = E.mapById(state.gateMap || 'garrison'), tab = state.missionTab || 'deploy';
  const open = D.MAPS.filter((mp) => E.mapUnlocked(state, mp)), locked = D.MAPS.filter((mp) => !E.mapUnlocked(state, mp));
  const cards = open.map((mp) => {
    const lib = m.liberated[mp.id];
    return `<button class="map-card ${mp.id === sel.id ? 'on' : ''} theme-${mp.theme}" data-a="pickmap" data-v="${mp.id}" aria-pressed="${mp.id === sel.id}"><b>${esc(mp.name)}</b><span class="label">${lib ? '<span class="lib">Liberated</span>' : `Best: sector ${m.bestByMap[mp.id] || 0} / 15`}</span></button>`;
  }).join('');
  const traits = [sel.credits !== 1 ? `${sel.credits > 1 ? '+' : ''}${pct(sel.credits - 1)} credits` : null, sel.level ? `enemies +${sel.level} lv` : null, (c.maps[sel.id] || {}).deepest ? `this operative: sector ${c.maps[sel.id].deepest}` : null].filter(Boolean);
  const ins = [...E.insertionsAt(c, sel.id, m.threat || 0)].sort((a, b) => a - b);
  // Under 80% health the dispatcher says so, with the clinic one tap away. Deploying hurt is still allowed.
  const hurt = c.hp < st.maxHp * 0.8, hc = E.healCost(state), canHeal = c.credits >= hc;
  const stimEach = E.price(state, E.itemCost(state, 'stim')), stimN = Math.min(st.carry, Math.floor(c.credits / stimEach));
  const droneRow = !c.drone ? `<div class="gate-heal"><div class="gate-heal-text"><b>No drone yet</b><span>Every operative gets one, free.</span></div><button class="btn" data-a="popup" data-v="character" data-k="drone">Choose</button></div>`
    : c.drone.damaged ? `<div class="gate-heal"><div class="gate-heal-text"><b>${esc(D.DRONES[c.drone.type].name)} is offline</b><span>It won\u2019t help until it\u2019s repaired.</span></div><button class="btn" data-a="dronerepair" ${c.credits < E.droneRepairCost(state) ? 'disabled' : ''}>Repair \u00B7 ${cr(E.droneRepairCost(state))}</button></div>` : '';
  const noStim = c.items.stim ? '' : `<div class="gate-heal"><div class="gate-heal-text"><b>No stims packed</b><span>${stimN ? 'They heal you mid-fight, and stop bleeding.' : `A stim costs ${cr(stimEach)} and you have ${cr(c.credits)}.`}</span></div><button class="btn" data-a="restock" ${stimN ? '' : 'disabled'}>Restock${stimN ? ` ${stimN} \u00B7 ${cr(stimN * stimEach)}` : ''}</button></div>`;
  const warn = droneRow + noStim + (hurt ? `<div class="gate-heal ${c.hp < st.maxHp * 0.5 ? 'bad' : ''}"><div class="gate-heal-text"><b>You\u2019re hurt: ${c.hp} / ${st.maxHp} HP</b>${bar(c.hp, st.maxHp)}<span>${canHeal ? 'Patch up before you go in.' : `Doc wants ${cr(hc)} and you have ${cr(c.credits)}. Going in like this is a risk.`}</span></div><button class="btn primary" data-a="heal" ${canHeal ? '' : 'disabled'}>Patch up \u00B7 ${cr(hc)}</button></div>` : '');
  const mt = E.maxThreat(state);
  const threat = mt > 0 ? `<div class="threat"><span class="label">Threat level</span><div class="btnrow">${D.THREAT.slice(0, mt + 1).map((t, i) => `<button class="btn ${m.threat === i ? 'primary' : ''}" data-a="threat" data-v="${i}" title="${esc(t.desc)}">${esc(t.name)}</button>`).join('')}</div><p class="muted" style="font-size:.84rem">${esc(D.THREAT[m.threat].desc)}${m.threat ? ' Starts again from sector 1.' : ''}</p></div>` : '';
  const contracts = (m.contracts || []).map((k) => `<div class="contract ${k.done ? 'done' : ''}"><div><b>${esc(k.text)}</b><span class="muted"> ${k.done ? 'Complete' : `${Math.min(k.progress, k.n)} / ${k.n}`}</span></div><span class="chip ${k.done ? 'good' : ''}">+${k.resolve} ${esc(S.meta)} \u00B7 +${k.credits} ${S.cur}</span></div>`).join('');
  const tabBtn = (k, label) => `<button class="tab" aria-selected="${tab === k}" data-a="missiontab" data-v="${k}">${label}</button>`;
  const go = isGuest() ? `<div class="deploy-go">${warn}<span class="muted">The host picks the target.</span><button class="btn big ${state.guestReady ? 'primary' : ''}" data-a="coopready" aria-pressed="${!!state.guestReady}">${state.guestReady ? 'Ready \u00B7 waiting for the host' : 'Ready for the raid'}</button></div>`
    : `<div class="deploy-go ${hurt && canHeal ? 'hurt' : ''}">${warn}${E.isCoop(state) ? `<span class="muted" style="font-size:.84rem">${state.guestReady ? `${esc(state.guestName || 'Your friend')} is ready.` : `Waiting for ${esc(state.guestName || 'your friend')} to press Ready.`}</span>` : ''}<span class="label">${ins.length > 1 ? 'Deploy \u00B7 pick where to start' : 'Deploy'}</span><div class="ins">${ins.map((n) => `<button class="btn big ${n === ins[ins.length - 1] ? 'primary' : ''}" data-a="deploy" data-v="${n}" ${E.isCoop(state) && !state.guestReady ? 'disabled' : ''}><span class="ins-n">Sector ${n}</span> <span class="ins-name">${esc(E.sectorName(n, sel.id))}</span></button>`).join('')}</div>${ins.length === 1 ? '<span class="muted ins-hint">Beat a boss to start deeper next time.</span>' : ''}</div>`;
  return `<nav class="tabs pop-tabs">${tabBtn('deploy', 'Deploy')}${tabBtn('contracts', `Contracts ${(m.contracts || []).length}`)}</nav>
    ${tab === 'contracts' ? `<div class="contracts">${contracts || '<p class="muted">No jobs right now.</p>'}</div>` : `<div class="gate">
      <div class="gate-maps"><div class="maps">${cards}</div>${locked.length ? `<p class="muted maps-locked">Locked: ${locked.map((mp) => `${esc(mp.name)} (reach sector ${mp.unlock})`).join(', ')}</p>` : ''}</div>
      <div class="gate-brief"><span class="label">${esc(sel.name)} \u00B7 what to expect</span><b class="mech-title">${esc(sel.mechanic.name)}</b> <span class="mech-line">${esc(sel.mechanic.desc)}</span>${traits.length ? `<div class="chips">${traits.map((x) => `<span class="chip">${esc(x)}</span>`).join('')}</div>` : ''}${threat}</div>
      ${go}
    </div>`}`;
}

function portraitImg(e, cls = '') {
  const src = e.portrait || sheetStill(e.id) || portraitURL(e.id);
  return src ? `<img class="portrait ${cls}" src="${src}" alt="Portrait of ${esc(e.name)}" width="160" height="160">` : '';
}

function intentLabel(e, k) { if (k.startsWith('sig:')) return BOSS_MOVES[e.id][k.slice(4)].name; return k === 'special' ? D.SPECIALS[e.id].name : D.INTENTS[k] ? D.INTENTS[k].label : k; }
function intentInfo(e) {
  if (e.stun > 0) return { label: `Stunned \u00B7 ${e.stun} turn${e.stun > 1 ? 's' : ''}`, tone: 'calm', tip: 'It can\u2019t act. Free hits.' };
  if (e.boss && E.intentHidden(state)) return { label: 'Lights out', tone: 'danger', tip: 'You can\u2019t read her. Strike can\u2019t miss; shots miss 25% of the time.' };
  if (e.intent === 'sig') return E.sigInfo(state) || { label: 'Thrown off', tone: 'calm', tip: 'You stopped the move. Its turn is wasted.' };
  if (e.intent === 'special') { const sp = D.SPECIALS[e.id]; return { label: sp.name, tone: 'danger', tip: sp.tip }; }
  return D.INTENTS[e.intent];
}
function combatScreen() {
  const r = state.run, e = r.enemy, c = state.char, st = E.stats(state);
  const intent = intentInfo(e);
  const sr = E.attackRange(state, false), mr = E.attackRange(state, true);
  const inc = E.incomingRange(state);
  const incChip = inc ? `<span class="chip ${inc.lethal ? 'lethal' : 'bad'}" title="If it connects. Defend to take ${inc.defMin}-${inc.defMax}.">${inc.lethal ? 'Lethal ' : 'Hits '}${inc.min}-${inc.max}</span>` : '';
  const coop = E.isCoop(state), mine = !coop || r.actor === myIdx();
  const party = coop ? `<div class="party">${[0, 1].map((i) => { const pc = E.charAt(state, i); if (!pc) return ''; const pst = E.statsOf(state.meta, pc); return `<div class="pm ${r.actor === i ? 'turn' : ''} ${i === myIdx() ? 'me' : ''}"><span class="label">${i === myIdx() ? 'You' : esc(pc.name)}${r.actor === i ? ' \u00B7 acting' : ''}${pc.downed ? ` \u00B7 <span class="danger-text">down, ${pc.downed} round${pc.downed > 1 ? 's' : ''} left</span>` : ''}</span><b>${Math.max(0, pc.hp)} / ${pst.maxHp} <span class="pm-stim" title="Stims left">${ico('item:stim', 'sm')}\u00D7${pc.items.stim}</span></b>${bar(pc.hp, pst.maxHp)}</div>`; }).join('')}</div>` : '';
  const waiting = coop && !mine ? `<div class="notice ${c.downed || c.dead ? 'lose' : ''}">${c.dead ? `You\u2019re dead. ${esc(E.charAt(state, 1 - myIdx()).name)} is trying to get out alive.` : c.downed ? `You\u2019re down, bleeding out: ${c.downed} round${c.downed > 1 ? 's' : ''} left. ${esc(E.charAt(state, 1 - myIdx()).name)} can get you up.` : `Waiting for ${esc(E.charAt(state, 1 - myIdx()).name)} to act\u2026`}</div>` : '';
  const downedMate = coop && mine ? E.partnerDown(state) : null;
  const reviveBtn = downedMate ? `<button class="btn primary big" data-a="act" data-v="revive" style="width:100%">Get ${esc(downedMate.name.split(' ')[0])} up \u00B7 ${downedMate.downed} round${downedMate.downed > 1 ? 's' : ''} left<span class="k">V</span></button>` : '';
  const confirmSmoke = state.confirmSmoke && c.items.smoke;
  const items = ['thermal', 'ion', 'smoke'].map((id, i) => !c.items[id] ? '' : `<button class="btn twoline ${id === 'smoke' && confirmSmoke ? 'confirm' : ''}" data-a="act" data-v="${id}" title="${esc(D.ITEMS[id].desc)}" ${c.items[id] ? '' : 'disabled'}>
      <span class="bt">${ico(`item:${id}`, 'sm')}${esc(D.ITEMS[id].name)} <span class="num">\u00D7${c.items[id]}</span><span class="k">${i + 2}</span></span>
      <span class="bs">${id === 'smoke' && confirmSmoke ? 'Tap again to try to escape' : esc(D.ITEMS[id].short)}</span></button>`).join('');
  const skills = E.skillsOf(c).slice(0, 4).map((k, i) => {
    const cd = r.cooldowns[k] || 0, sk = D.SKILLS[k];
    const status = k === 'intimidate' ? (cd ? 'used this sector' : e.tags.includes('human') ? `${pct(E.intimidateChance(state))} chance` : 'humans only') : cd ? `ready in ${cd}` : 'ready';
    const note = `${esc(sk.short)} <span class="sk-status">${status}</span>`;
    return `<button class="btn skill ${cd ? '' : 'ready'}" data-a="act" data-v="${k}" title="${esc(sk.desc)}" ${E.canUse(state, k) && !(k === 'intimidate' && !e.tags.includes('human')) ? '' : 'disabled'}>
      <span class="sk-name">${ico(`skill:${k}`, 'sm')}${esc(sk.name)}<span class="k">${SKILL_KEYS[i].toUpperCase()}</span></span><span class="sk-note">${note}</span></button>`;
  }).join('');
  const meta = [...e.tags.filter((t) => t !== 'boss').map((t) => `<span class="tag ${t}">${t}</span>`),
    `<span>ATK <b>${e.atk}</b></span>`, `<span>DEF <b>${e.def}</b></span>`, `<span>SPD <b>${e.spd}</b></span>`,
    `<span>Dodge <b>${pct(E.dodgeChance(st, e))}</b></span>`, `<span>Run <b>${pct(E.runChance(state))}</b></span>`,
    c.drone ? `<span class="${c.drone.damaged ? 'danger-text' : ''}" title="${esc(`${D.DRONES[c.drone.type].name}, rank ${c.drone.rank}. ${c.drone.damaged ? 'Offline until repaired in town.' : D.DRONES[c.drone.type].effect(E.droneValue(c.drone))}`)}">${esc(D.DRONES[c.drone.type].name)} <b>${c.drone.damaged ? 'off' : `R${c.drone.rank}`}</b></span>` : ''].join('');
  return `<div class="columns"><section class="panel combat"><div class="c-left">
    <div class="combat-head"><span class="label">${esc(E.mapById(r.map).name)} \u00B7 Sector ${r.sector} \u00B7 ${esc(E.sectorName(r.sector, r.map))}</span>${stage.auto ? '<span class="auto-note">Auto battle \u00B7 change the mode to take over</span>' : ''}${roomPips(r)}</div>
    <div class="stage-box"><div id="stage-slot"></div></div>
    <div class="intent ${intent.tone} ${e.intent === 'sig' ? 'sigi' : ''} ${E.bossEffects(state).length ? 'fx' : ''}"><span class="dot"></span><b>${esc(intent.label)}</b><span class="tip">${esc(intent.tip)}${st.scan && e.next && !(e.boss && E.intentHidden(state)) ? ` <span class="next-intent">Scanner: then ${esc(intentLabel(e, e.next))}</span>` : ''}</span><span class="intent-side">${incChip}${E.bossEffects(state).map((x) => `<span class="chip bad" data-tip="${esc(x.tip)}" title="${esc(x.tip)}">${esc(x.label)}</span>`).join('')}${mechanicChip(r)}${r.ready ? `<span class="chip good">Aim +${E.hasPerk(c, 'steady') ? 100 : 50}%</span>` : ''}${r.momentum ? `<span class="chip good">Momentum +${Math.round(E.TUNE.momentum * 100)}%</span>` : ''}</span></div>
    <div class="statline">${meta}</div>
    ${(() => { const trait = (cls, t) => (t ? `<div class="quirk-line"><span class="chip ${cls}" data-tip="${esc(`${t.name}: ${t.desc}`)}">${esc(t.name)}</span><span>${esc(t.desc)}</span></div>` : ''); const all = trait('quirk', e.quirk && E.quirkById(e.quirk)) + trait('bad', D.MELEE_COUNTER[e.id]) + trait('bad', e.affix && D.AFFIXES[e.affix]); return all ? `<div class="quirk-row">${all}</div>` : ''; })()}
    </div><div class="c-right">
    ${tip('combat')}
    ${party}${waiting}${reviveBtn}
    <div class="actions ${mine ? '' : 'locked'}">
      <button class="btn primary twoline atk" data-a="act" data-v="shoot" title="${esc(E.weaponOf(c).name)}: ${st.atk} ATK, ${pct(E.critChance(st, e))} crit. Steady damage; cover halves it. You keep your distance, so you take ${Math.round(E.TUNE.shootGuard * 100)}% less damage this turn."><span class="bt">Shoot<span class="k">A</span></span><span class="wpn">${esc(E.weaponOf(c).name)}</span><span class="bs"><b class="rng">${sr[0]}\u2013${sr[1]}</b> dmg${e.intent === 'guard' && !e.stun ? ' (cover)' : ''}</span></button>
      <button class="btn twoline atk ${D.MELEE_COUNTER[e.id] ? 'warn' : ''}" data-a="act" data-v="strike" title="${esc(E.meleeOf(c).name)}: ${st.atkM} ATK, ${pct(E.critChance(st, e, true))} crit. Swingy damage, ignores cover, and your next attack hits ${Math.round(E.TUNE.momentum * 100)}% harder."><span class="bt">Strike<span class="k">F</span></span><span class="wpn">${esc(E.meleeOf(c).name)}</span><span class="bs"><b class="rng">${mr[0]}\u2013${mr[1]}</b> dmg${D.MELEE_COUNTER[e.id] ? ' \u00B7 hits back!' : ''}</span></button>
      <button class="btn twoline" data-a="act" data-v="defend" title="Take half damage, about a third from a heavy strike, and steady your next shot."><span class="bt">Defend<span class="k">D</span></span><span class="bs">${inc ? `Take ${inc.defMin}-${inc.defMax}` : 'Half damage'}</span></button>
      <button class="btn twoline" data-a="act" data-v="stim" title="${esc(D.ITEMS.stim.desc)}" ${c.items.stim ? '' : 'disabled'}><span class="bt">${ico('item:stim', 'sm')}Stim <span class="num">\u00D7${c.items.stim}</span><span class="k">S</span></span><span class="bs">${esc(D.ITEMS.stim.short)}</span></button>
      <button class="btn twoline" data-a="act" data-v="run" ${E.canUse(state, 'run') ? '' : 'disabled'} title="Getting away drops ${Math.round(E.runShare(state) * 100)}% of unsecured credits and XP. Failing gives the enemy a free turn."><span class="bt">Run<span class="k">R</span></span><span class="bs" title="Getting away drops ${Math.round(E.runShare(state) * 100)}% of unsecured credits and XP">${E.runBlocked(state) ? esc(E.runBlocked(state)) : `${pct(E.runChance(state))}, lose ${Math.round(E.runShare(state) * 100)}%`}</span></button>
    </div>
    ${skills ? `<div class="skills ${mine ? '' : 'locked'}">${skills}</div>` : ''}
    ${items.trim() ? `<div class="items">${items}</div>` : ''}
  </div></section>${logPanel()}</div>`;
}

const ROOM_LABEL = { fight: 'Fight', elite: 'Elite fight', event: 'Event', supply: 'Supplies', rest: 'Rest', cells: 'Prisoners', cargo: 'Cargo', boss: 'Boss', bounty: 'Bounty fight', vault: 'Strongroom', medbay: 'Medic', locker: 'Gear', bench: 'Upgrade', fence: 'Contraband' };
function mechanicChip(r) {
  const m = E.mapById(r.map).mechanic;
  let v = '';
  if (m.id === 'alarm') v = `${'\u25A0'.repeat(r.alert)}${'\u25A1'.repeat(5 - r.alert)} ${r.alert}/5`;
  if (m.id === 'vents') v = r.enemy ? (r.vent === 1 ? 'blast next turn' : `blast in ${r.vent} turns`) : 'every 3 turns';
  if (m.id === 'allies') v = `${r.allies}/2 with you`;
  if (m.id === 'snipers') v = `${Math.round(E.sniperChance(r) * 100)}% per turn`;
  const hot = (m.id === 'vents' && r.enemy && r.vent === 1) || (m.id === 'alarm' && r.alert >= 3);
  return `<span class="mech ${hot ? 'hot' : ''}" title="${esc(m.desc)}"><b>${esc(m.name)}</b> ${v}</span>`;
}
function bulletinBox(r) {
  const b = E.bulletinOf(r);
  if (b.id === 'quiet') return '';
  return `<div class="bulletin" data-tip="${esc(`${b.name}: ${b.desc}`)}"><span class="label">Directorate bulletin</span><b>${esc(b.name)}</b><span>${esc(b.desc)}</span></div>`;
}
function roomPips(r) {
  return `<span class="pips rooms" aria-label="room ${r.room} of ${E.FIGHTS_PER_SECTOR}">${Array.from({ length: E.FIGHTS_PER_SECTOR }, (_, i) => `<i class="${i < r.room ? 'on' : ''}"></i>`).join('')}</span>`;
}

// v5: the floor condition for this sector, under the raid's bulletin.
function condBox(r) {
  const k = E.condOf(r);
  if (!r.cond || r.cond === 'none') return '';
  return `<div class="bulletin cond" data-tip="${esc(`${k.name}: ${k.desc}`)}"><span class="label">This floor</span><b>${esc(k.name)}</b><span>${esc(k.desc)}</span></div>`;
}
function routeScreen() {
  const r = state.run, map = E.mapById(r.map), c = state.char, st = E.stats(state);
  const coopVote = E.isCoop(state) && net && net.peer, votes = (coopVote && r.votes) || {}, mate = E.charAt(state, 1 - myIdx());
  const voteChips = (i) => [votes[myIdx()] === i ? '<span class="chip good">Your vote</span>' : '', mate && votes[1 - myIdx()] === i ? `<span class="chip">${esc(mate.name.split(' ')[0])}\u2019s vote</span>` : ''].join('');
  const doors = r.choices.map((k, i) => `<button class="door door-${k}" data-a="room" data-v="${i}">${ico(`room:${k}`)}
      <span class="label">${ROOM_LABEL[k]} <span class="k">${i + 1}</span></span>${voteChips(i) ? `<span class="chips">${voteChips(i)}</span>` : ''}
      <b>${esc(E.roomName(r.map, k))}</b><span class="desc">${esc(D.ROOMS[k].desc)}</span></button>`).join('');
  const cds = Object.entries(r.cooldowns).filter(([, v]) => v > 0).map(([k, v]) => `${D.SKILLS[k].name} ${v >= 50 ? 'used' : `ready in ${v}`}`);
  return `<div class="columns"><section class="panel screen-route">
    <div class="raid-where" style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center"><span class="label">${esc(map.name)} \u00B7 Sector ${r.sector} \u00B7 ${esc(E.sectorName(r.sector, r.map))}</span>${roomPips(r)}</div>
    ${afterAction()}
    ${r.areaLine && r.room === 0 && r.areaLine.sector === r.sector ? `<p class="area-line">${esc(r.areaLine.text)}</p>` : ''}
    <h2>${r.choices[0] === 'boss' ? 'No way around it' : r.room === 0 ? 'Which way in?' : 'Two doors'}</h2>
    ${tip('route')}

// ---------- between fights: a slim raid view with popups on top ----------
function afterAction() {
  const o = state.lastResult, c = state.char;
  if (!o) return '';
  let main = '', chips = [];
  if (o.kind === 'fight') {
    main = `<b>${esc(o.enemy)}</b> ${o.fled ? 'fled' : 'down'}`;
    chips.push(`+${o.credits} ${S.cur}`, `+${o.xp} XP`);
    if (o.healed) chips.push(`+${o.healed} HP`);
    for (const it of o.items || []) chips.push(`found ${it}`);
    for (const n of o.notes || []) chips.push(n);
    if (o.loot) chips.push(`dropped ${o.loot}`);
    if (o.resolve) chips.push(`+${o.resolve} ${S.meta}`);
    if (o.defeatLine) main += ` <span class="muted">${esc(o.defeatLine)}</span>`;
  } else {
    main = `<b>${esc(o.name)}</b> <span class="muted">${esc(o.text)}</span>`;
    chips = o.notes || [];
  }
  const feats = o.kind === 'fight' && o.feats && o.feats.length ? `<div class="aa-feats">${o.feats.slice(0, 2).map((p) => `<div class="aa-feat ${p.done ? 'done' : ''}" title="${esc(E.FEAT_DEFS[p.key].desc)}"><span class="num">${esc(p.name)} <b>${p.done ? 'Done' : `${p.count}/${p.next}`}</b></span>${featBar(p)}</div>`).join('')}</div>` : '';
  const lvl = o.kind === 'fight' && o.levelUps && o.levelUps.length ? `<span class="chip good">Level ${o.levelUps[o.levelUps.length - 1]}!</span>` : '';
  return `${o.liberated ? `<div class="liberated"><span class="label">District liberated</span><b>${esc(o.liberated)}</b><span>Threat levels are now available under Missions.</span></div>` : ''}
    <div class="aa"><div class="aa-main">${main} ${lvl}<span class="chips">${chips.map((t) => `<span class="chip ${/\u2212|alerted|exploded/.test(t) ? 'bad' : 'good'}">${esc(t)}</span>`).join('')}</span></div>
    <button class="tool" data-a="dismissresult" aria-label="Hide">\u00D7</button>${feats}</div>`;
}
// The view behind loot, contraband and sector-clear popups.
function popupView(inner, cls = '') {
  const r = state.run;
  return `<div class="columns"><section class="panel screen-behind">
    <div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center"><span class="label">${esc(E.mapById(r.map).name)} \u00B7 Sector ${r.sector} \u00B7 ${esc(E.sectorName(r.sector, r.map))}</span>${roomPips(r)}</div>
    ${afterAction()}
    <p class="muted">The corridor goes quiet for a moment.</p>
  </section>${logPanel()}</div>
  <div class="popup-wrap"><div class="modal popup ${cls}" role="dialog" aria-modal="true">${inner}</div></div>`;
}

const isRareDrop = (it) => !!it && (['elite', 'legendary', 'unique'].includes(it.rarity) || !!E.baseOf(it).unique);
function lootScreen() {
  const r = state.run, c = state.char, it = r.lootOffer, b = E.baseOf(it), old = c.gear[b.slot], ok = E.canEquip(c, it), free = E.lockupFree(state), oldKept = old && E.baseOf(old).tier > 0;
  return popupView(`
    <span class="label">Dropped \u00B7 ${esc(D.RARITY[it.rarity].name)} ${esc(SLOTS[b.slot].name.toLowerCase())}</span><h2>${b.unique ? 'Something with a name on it' : 'Something worth taking'}</h2>
    ${tip('loot')}
    <div class="loot">
      <div style="display:grid;gap:6px;align-content:start"><span class="label">The drop</span>${itemCard(it, { cls: 'new' })}</div>
      <div style="display:grid;gap:6px;align-content:start"><span class="label">What you\u2019re using</span>${old ? itemCard(old, { compare: false }) : '<p class="muted">Nothing in that slot.</p>'}</div>
    </div>
    <div class="btnrow">
      <button class="btn primary big" data-a="loottake" ${ok ? '' : 'disabled'}>${ok ? `Take it${oldKept ? ' \u00B7 leave the old one' : ''}` : `Needs ${E.reqText(b.req)}`}<span class="k">1</span></button>
      ${ok && oldKept ? `<button class="btn big" data-a="loottakekeep" ${free > 0 ? '' : 'disabled'}>Take it \u00B7 stash the old one</button>` : ''}
      <button class="btn big" data-a="lootstash" ${free > 0 ? '' : 'disabled'}>Send to Lockup<span class="k">3</span></button>
      <button class="btn big" data-a="lootsell">Leave it<span class="k">2 \u00B7 Esc</span></button>
    </div>
    <p class="muted" style="font-size:.86rem">Lockup: ${free} free of ${E.lockupCap(state.meta)}. It waits at the safehouse and dies with this operative.</p>

// Co-op rewards: each player sees only their own choice, then waits for the other.

  return popupView(`<span class="label">Spoils</span><h2>Picked over</h2><p>Waiting for ${esc(pc ? pc.name : 'your partner')} to choose what they\u2019re taking\u2026</p>`);

const rewardView = () => { const r = state.run; if (!r || !['loot', 'perk'].includes(state.screen)) return null; return r.lootOffer ? 'loot' : r.perkOffer ? 'perk' : null; };
function perkScreen() {
  const r = state.run, c = state.char;

let orbitScene = null, orbitBusy = false, orbitArm = null;
const ORBIT_TIP = { fire: 'Fire away.', volley: 'Evade now: a broadside does x1.8.', lock: 'Evade now to line up a +50% shot; the locked shot that follows can\u2019t be dodged.', repair: 'Overcharge now while it patches up.' };
function orbitOdds(tier) {

  for (let i = 0; i < N; i++) {
    const r = E.seededRng(777 + i), c = { ...state.char, marks: [...(state.char.marks || [])], credits: 0, ejected: true };
    const t = { meta: { ...state.meta, journal: [], ship: { ...state.meta.ship, cell: [...state.meta.ship.cell] } }, char: c, run: null, screen: 'town', orbit: null };
    if (!E.orbitStart(t, tier, r)) return null;
    let n = 0;
    while (!t.orbit.over && n++ < 80) { const o = t.orbit; E.orbitAct(t, o.hull <= o.maxHull * 0.2 && o.eHull > o.eMaxHull * 0.5 ? 'jump' : (o.intent === 'volley' || o.intent === 'lock') ? 'evade' : o.intent === 'repair' ? 'overcharge' : 'fire', r); }

}

      setTimeout(async () => { if (wheel) await wheel.spinTo(res.n); state.wheelResult = res; wheelBusy = false; sfx(res.win ? 'perk' : 'denied'); render(); }, 50);
      break;
    }
    case 'invest': { const n = Math.floor(+((document.getElementById(`inv-${v}`) || {}).value || 0)); ok = E.invest(state, v, n); break; }
    case 'withdraw': ok = E.withdraw(state, v); break;
    case 'shippart': ok = E.buyShipPart(state, v); break;
    case 'shipcell': ok = E.buyShipCell(state, v); if (ok) sfx('perk'); break;
    case 'orbitarm': orbitArm = v || null; sfx('click'); render(); return;
    case 'orbitgo': orbitArm = null; ok = E.orbitStart(state, v, rng); if (ok) sfx('door'); break;
    case 'orbitact': {
      ok = E.orbitAct(state, v, rng);
      if (ok && orbitScene) { const o = state.orbit; const ms = orbitScene.play(o.events); orbitBusy = true; save(); setTimeout(() => { orbitBusy = false; if (o.over === 'lost') { orbitScene.set(D.ORBIT_TIERS.find((x) => x.id === o.tier).ship, { me: true, enemy: false }); } render(); }, ms + 150); return; }

    case 'begin': state.screen = 'create'; if (!state.draft) state.draft = E.newDraft(state.meta, rng); break;
    case 'bg': state.draft.background = v; { for (const key of Object.keys(D.ATTRS)) while (E.draftAttr(state.draft, key) > D.ATTR_CREATE_MAX) E.draftAdjust(state.draft, key, -1); } break;
    case 'attr': E.draftAdjust(state.draft, v, +k); break;
    case 'randomize': {

      const sexPick = any(BODIES); d.look = { ...(d.look || defaultLook()), body: sexPick.id, hair: HAIR_FOR[sexPick.sex], skin: Math.floor(rng() * SKINS.length), hairColor: Math.floor(rng() * HAIRS.length) };
      for (const k of Object.keys(D.ATTRS)) while (E.draftAdjust(d, k, -1));

    case 'randname': state.draft.name = D.OPERATIVE_NAMES[Math.floor(rng() * D.OPERATIVE_NAMES.length)]; break;
    case 'create': E.createChar(state, rng); state.gateMap = 'garrison'; state.popup = null; fallenScene(state, state.char); break;
    case 'tab': case 'popup': state.popup = v === 'gate' ? 'missions' : v === 'safehouse' ? 'character' : v; if (k && state.popup === 'character') state.charTab = k; state.notice = null; break;
    case 'closepopup': state.popup = null; state.notice = null; state.compare = null; break;
    case 'compare': state.compare = +v; sfx('click'); break;
    case 'closecompare': state.compare = null; sfx('click'); break;
    case 'buygear': ok = E.buyGear(state, +v, k === 'stash'); state.compare = null; break;
    case 'lockupstore': ok = E.lockupStore(state, v); sfx(ok ? 'click' : 'denied'); break;
    case 'lockuptake': ok = E.lockupTake(state, +v, k); sfx(ok ? 'buy' : 'denied'); break;
    case 'lockupscrap': ok = E.lockupScrap(state, +v, k); sfx(ok ? 'click' : 'denied'); break;
    case 'givearm': giveArm = v; sfx('click'); break;
    case 'givecredits': ok = E.giveCredits(state, actingAs, +v); giveArm = null; sfx(ok ? 'buy' : 'denied'); break;
    case 'givegear': { const why = E.giveGear(state, actingAs, v); giveArm = null; if (why) state.notice = why; sfx(why ? 'denied' : 'buy'); break; }
    case 'tradeask': if (E.tradeAsk(state, actingAs)) state.popup = null; sfx('click'); break;
    case 'tradeanswer': E.tradeAnswer(state, actingAs, v === 'yes'); sfx('click'); break;
    case 'tradecancel': E.tradeCancel(state, actingAs); sfx('click'); break;
    case 'tradecredits': E.tradeCredits(state, actingAs, v === 'all' ? 'all' : +v); sfx('click'); break;
    case 'tradeslot': E.tradeSlot(state, actingAs, v); sfx('click'); break;
    case 'tradeok': E.tradeAccept(state, actingAs); sfx('click'); break;
    case 'gearslot': state.gearSlot = v; sfx('click'); break;
    case 'upgradegear': ok = E.upgradeItem(state, v); break;
    case 'reroll': ok = E.rerollBonus(state, v, +k, rng); break;
    case 'equipheirloom': ok = E.equipHeirloom(state); break;
    case 'heirloom': E.setHeirloom(state, v); sfx('click'); break;
    case 'loottake': if (E.takeLoot(state, rng, actingAs)) sfx('buy'); break;
    case 'loottakekeep': if (E.takeLoot(state, rng, actingAs, true)) sfx('buy'); break;
    case 'lootstash': if (E.stashLoot(state, rng, actingAs)) sfx('buy'); break;
    case 'lootsell': if (E.leaveLoot(state, rng)) sfx('click'); break;
    case 'item': ok = E.buyItem(state, v); break;
    case 'restock': ok = E.restockStims(state); break;
    case 'upgrade': ok = E.buyUpgrade(state, v); break;
    case 'implant': ok = E.installImplant(state, v); break;
    case 'unimplant': E.removeImplant(state, v); break;
    case 'heal': ok = E.heal(state); break;
    case 'missiontab': state.missionTab = v; sfx('click'); break;
    case 'markettab': state.marketTab = v; sfx('click'); break;
    case 'chartab': state.charTab = v; sfx('click'); break;
    case 'train': ok = E.train(state, v); break;
    case 'cell': ok = E.buyCell(state, v); break;
    case 'spend': ok = E.spendAttr(state, v); break;
    case 'respec': ok = E.respec(state); break;
    case 'pickmap': state.gateMap = v; break;
    case 'deploy': if (E.isCoop(state) && !state.guestReady) { ok = false; break; } state.trade = null; state.popup = null; state.lastResult = null; E.deploy(state, state.gateMap || 'garrison', +v, rng); break;
    case 'continue': E.continueAfterVictory(state, rng); break;
    case 'room': { if (E.isCoop(state) && net && net.peer) { if (!E.voteDoor(state, actingAs, +v, rng)) break; } else E.enterRoom(state, +v, rng); state.lastResult = null; } if (state.screen === 'room') { state.lastResult = { kind: 'room', ...state.roomResult }; E.continueAfterVictory(state, rng); } break;
    case 'dismissresult': state.lastResult = null; break;
    case 'roomDone': E.continueAfterVictory(state, rng); break;
    case 'event': E.resolveEvent(state, +v, rng, actingAs); break;
    case 'eventDone': state.lastResult = null; E.nextEncounter(state, rng); break;
    case 'deeper': if (E.isCoop(state) && net && net.peer && !E.voteExit(state, actingAs, 'deeper')) break; state.lastResult = null; E.pushDeeper(state, rng); break;
    case 'extract': if (E.isCoop(state) && net && net.peer && !E.voteExit(state, actingAs, 'extract')) break; E.attemptExtract(state, rng); break;
    case 'extractsafe': if (E.isCoop(state) && net && net.peer && !E.voteExit(state, actingAs, 'extractsafe')) break; E.safeExtract(state, rng); break;
    case 'recruit': E.recruit(state, rng); if (!state.coopFallen || state.coopFallen.idx !== 1) state.coopFallen = null; break;
    case 'report': {
      const text = E.runReport(state);
      state.report = text;

      sfx('click'); break;
    }
