name = "cinder-cell"
main = "coop/worker.js"
compatibility_date = "2025-01-01"

[assets]
directory = "."
run_worker_first = ["/room/*", "/save/*", "/board", "/bug", "/stat", "/presence", "/contract/*", "/.well-known/*", "/apple-app-site-association"]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# The free plan only allows SQLite-backed Durable Objects.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[durable_objects.bindings]]
name = "VAULT"
class_name = "Vault"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Vault"]

[[durable_objects.bindings]]
name = "BOARD"
class_name = "Board"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Board"]

[[durable_objects.bindings]]
name = "BUGS"
class_name = "Bugs"

[[migrations]]
tag = "v4"
new_sqlite_classes = ["Bugs"]

[[durable_objects.bindings]]
name = "STATS"
class_name = "Stats"

[[durable_objects.bindings]]
name = "CONTRACTS"
class_name = "Contracts"

[[migrations]]
tag = "v5"
new_sqlite_classes = ["Stats", "Contracts"]

# Friends online and spectating requests. Kept in memory only (nothing is written), but the free plan still wants a SQLite class.
[[durable_objects.bindings]]
name = "PRESENCE"
class_name = "Presence"

[[migrations]]
tag = "v6"
new_sqlite_classes = ["Presence"]
