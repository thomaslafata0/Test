name = "cinder-cell"
main = "coop/worker.js"
compatibility_date = "2025-01-01"

[assets]
directory = "."
run_worker_first = ["/room/*", "/save/*"]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# The free plan only allows SQLite-backed Durable Objects.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[durable_objects.bindings]]
name = "VAULT"
class_name = "Vault"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Vault"]
