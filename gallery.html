<meta charset="utf-8"><body style="background:#121518;margin:0;padding:12px;display:flex;flex-wrap:wrap;gap:12px">
<script type="module">
import { ART, portraitURL } from './portraits.js';
for (const id of Object.keys(ART)) { const d=document.createElement('div'); d.style.cssText='background:#222930;padding:6px;color:#aaa;font:11px monospace'; d.innerHTML=`<img src="${portraitURL(id)}" style="width:160px;height:160px;image-rendering:pixelated;display:block">${id}`; document.body.append(d); }
</script>
